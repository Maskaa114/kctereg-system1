<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KCTE OFFICIAL RESULTS PORTAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, getDocs, updateDoc, doc, onSnapshot, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDoMZETvL5-oYm5wiP2dcbLm1p6ZfsgvjE",
            authDomain: "kctereg-online.firebaseapp.com",
            projectId: "kctereg-online",
            storageBucket: "kctereg-online.firebasestorage.app",
            messagingSenderId: "308277595556",
            appId: "1:308277595556:web:1b1814886668eda0310531"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Nadiifi xogta ID-ga (Ka saar meel kasta oo banaan ama calaamad qaldan)
        const scrubID = (id) => String(id).toUpperCase().replace(/[^A-Z0-9]/g, '').trim();

        // --- 1. PORTAL LOGIN (Staff) ---
        window.loginStaff = async () => {
            const u = document.getElementById('staff-u').value.trim();
            const p = document.getElementById('staff-p').value.trim();

            if(u === "Macalin114" && p === "kctepass") return setupDash("Macalin");
            if(u === "D.head 5353" && p === "headpass") return setupDash("HOD");
            if(u === "REG.12345" && p === "regpass") return setupDash("REG");
            if(u === "dean12345" && p === "deanpass") return setupDash("Dean");
            alert("Username ama Password-ka Staff-ka waa khaldan yahay!");
        };

        function setupDash(role) {
            document.getElementById('student-home').classList.add('hidden');
            document.getElementById('staff-login-box').classList.add('hidden');
            document.getElementById('dashboard-ui').classList.remove('hidden');
            document.getElementById('user-role').innerText = role;

            if(role === 'Macalin') document.getElementById('teacher-ui').classList.remove('hidden');
            if(['HOD', 'REG', 'Dean'].includes(role)) loadSubmissions(role);
        }

        // --- 2. STUDENT SEARCH (Direct & Secure) ---
        window.findGrade = async () => {
            const idInput = document.getElementById('st-id-search').value.trim();
            if(!idInput) return alert("Fadlan qor ID Number-kaaga!");
            
            const target = scrubID(idInput);
            const resDiv = document.getElementById('st-result-area');
            resDiv.innerHTML = "<p class='animate-pulse text-indigo-900 font-bold'>Raadin baa socota...</p>";

            const q = query(collection(db, "v11_grades"), where("status", "==", "APPROVED"));
            const snap = await getDocs(q);
            let results = [];

            snap.forEach(docSnap => {
                const list = docSnap.data().students;
                const found = list.find(s => scrubID(s.sid) === target || scrubID(s.name).includes(target));
                if(found) results.push({ gradeInfo: found, subject: docSnap.data().subject });
            });

            if(results.length > 0) {
                let html = "";
                results.forEach(res => {
                    html += `
                    <div class='mt-6 p-8 bg-white border-t-8 border-indigo-900 rounded-[2.5rem] shadow-2xl animate-fade-in text-center'>
                        <p class='text-[10px] font-black text-indigo-400 uppercase tracking-widest mb-2 underline decoration-yellow-400'>KCTE Official Result Card</p>
                        <h2 class='text-3xl font-black text-indigo-950 uppercase'>${res.gradeInfo.name}</h2>
                        <p class='text-sm font-bold text-gray-400 mt-2 uppercase'>Subject: ${res.subject}</p>
                        <div class='grid grid-cols-2 gap-4 mt-8'>
                             <div class='bg-gray-50 p-6 rounded-3xl border'> <span class='text-[8px] font-bold opacity-30'>Tira (100)</span> <h2 class='text-4xl font-black text-indigo-900'>100/${res.gradeInfo.mark}</h2> </div>
                             <div class='bg-indigo-950 text-white p-6 rounded-3xl shadow-xl border-b-8 border-yellow-500'> <span class='text-[8px] font-bold opacity-50 uppercase'>Grade</span> <h2 class='text-6xl font-black italic underline'>${res.gradeInfo.grade}</h2> </div>
                        </div>
                    </div>`;
                });
                resDiv.innerHTML = html;
            } else {
                resDiv.innerHTML = `<div class='mt-6 p-6 bg-red-50 text-red-600 rounded-3xl font-bold text-xs uppercase animate-shake text-center'>ID-gan xog laguma hayo. <br>Hubi: Ma 'APPROVED' baa? Ma 'SRLD/007/15' baad u qortay siday u jirtay?</div>`;
            }
        };

        // --- 3. STAFF LOGIC (Excel Copy Paste) ---
        let pasteBuffer = [];
        window.onDataPaste = (e) => {
            const rows = e.target.value.split("\n");
            pasteBuffer = [];
            rows.forEach(r => {
                const c = r.split("\t");
                if(c.length >= 3){
                    let name = (c[1] || "").split("+")[0].split("=")[0].trim();
                    let sid = (c[2] || "").trim();
                    let mark = c.find(val => !isNaN(val) && val != "" && val.length >= 1) || "0";
                    let grade = (c[c.length-1] || "F").toUpperCase().trim();
                    if(name && !name.toLowerCase().includes("name")) pasteBuffer.push({name, sid, mark, grade});
                }
            });
            document.getElementById('paste-status').innerText = `Laxaqiijiyey: ${pasteBuffer.length} Arday.`;
        };

        window.submitSub = async () => {
            const subject = document.getElementById('subject-name').value.trim();
            if(!subject || pasteBuffer.length === 0) return alert("Magaca Maadada qor & Paste-gareey xogta.");
            await addDoc(collection(db, "v11_grades"), {
                subject: subject.toUpperCase(),
                instructor: "Macalin114",
                students: pasteBuffer,
                status: "PENDING_HOD",
                at: new Date().toLocaleString()
            });
            alert("Guul: Buundooyinka waxaa loo diray Head-ka!");
            location.reload();
        };

        function loadSubmissions(r) {
            const q = r==='Dean' ? collection(db,"v11_grades") : query(collection(db,"v11_grades"), where("status","==",(r==='HOD'?'PENDING_HOD':'PENDING_REG')));
            onSnapshot(q, snap => {
                let html = "";
                snap.forEach(ds => {
                    const data = ds.data();
                    let sList = ""; data.students.forEach(s => sList += `<tr><td class='border p-1'>${s.sid}</td><td class='border p-1'>${s.name}</td><td class='border p-1'>${s.mark}</td><td class='border p-1 font-bold'>${s.grade}</td></tr>`);
                    html += `<div class='bg-white p-6 rounded-3xl shadow-xl mb-8 border-l-[15px] border-indigo-950 animate-fade-in'>
                        <div class='flex justify-between items-center mb-4'>
                            <div><h3 class='font-black text-xl'>${data.subject}</h3><p class='text-[10px] uppercase font-bold text-gray-400'>Teacher: ${data.instructor}</p></div>
                            <div class='flex gap-2 h-fit'>
                                ${(r=='HOD' && data.status=='PENDING_HOD') ? `<button onclick="approveSt('${ds.id}','PENDING_REG')" class='bg-green-600 text-white px-4 py-1 rounded text-xs font-bold'>Oggolaaw (To REG)</button>` : ""}
                                ${(r=='REG' && data.status=='PENDING_REG') ? `<button onclick="approveSt('${ds.id}','APPROVED')" class='bg-indigo-950 text-white px-6 py-2 rounded-xl text-xs font-black italic underline'>REG FINAL APPROVE</button>` : ""}
                                <button onclick="rejectSt('${ds.id}')" class='bg-red-400 text-white px-3 py-1 rounded text-xs'>Reject</button>
                                <span class='p-1 bg-gray-50 rounded text-[9px] font-black italic uppercase'>${data.status}</span>
                            </div>
                        </div>
                        <details class="cursor-pointer text-[10px] text-blue-500 font-bold"><summary>Liiska Ardayda dhabta ah ▽</summary><table class='w-full mt-2'>${sList}</table></details>
                    </div>`;
                });
                document.getElementById('audit-list').innerHTML = html || "<p class='p-20 text-center italic opacity-30'>Pipeline is Empty</p>";
            });
        }
        window.approveSt = async (id, s) => { await updateDoc(doc(db,"v11_grades",id), {status:s}); alert("Ok!"); };
        window.rejectSt = async (id) => { if(confirm("Hubi tirtiridda?")) await deleteDoc(doc(db,"v11_grades",id)); };

    </script>
    <style> .animate-fade-in { animation: fadeIn 0.4s ease-out; } @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: 0; } } </style>
</head>
<body class="bg-gray-100 font-sans tracking-tighter text-indigo-950 italic">

    <!-- LANDING: STUDENT DIRECT SEARCH -->
    <div id="student-home" class="container mx-auto p-6 lg:p-16 max-w-4xl text-center">
        <h1 class="text-7xl font-black text-indigo-950 leading-none italic mb-2 tracking-widest italic italic">KCTE PORTAL</h1>
        <p class="text-[11px] font-black text-slate-400 uppercase tracking-[0.5em] mb-12 italic underline decoration-yellow-500 decoration-8 underline-offset-4">Public Result Search Gateway</p>
        
        <div class="bg-white p-12 rounded-[4.5rem] shadow-[0_40px_100px_rgba(0,0,0,0.2)] border-t-[20px] border-yellow-500 relative overflow-hidden italic">
             <div class="absolute -top-10 -right-10 w-40 h-40 bg-indigo-50 rounded-full blur-3xl opacity-30 italic"></div>
             <h2 class="text-5xl font-black text-indigo-950 mb-1 leading-none italic italic">Raadi Buundada</h2>
             <p class="text-[9px] font-black text-slate-300 mb-12 uppercase italic underline decoration-gray-100">Geli ID lambarka dhabta ah ee SRLD</p>
             
             <input id="st-id-search" type="text" placeholder="SRLD/007/15" class="w-full bg-slate-50 border-4 border-indigo-50 p-8 rounded-[4rem] text-center font-black text-5xl outline-none focus:border-yellow-500 shadow-inner mb-6 uppercase tracking-widest text-indigo-950 italic placeholder:opacity-10 italic">
             <button onclick="findGrade()" class="w-full bg-indigo-950 text-white p-8 rounded-[3.5rem] font-black text-4xl shadow-xl hover:scale-105 active:scale-95 transition underline decoration-yellow-500 underline-offset-8">ARAG NATIIJADAYDA ➜</button>
             
             <div id="st-result-area" class="min-h-[250px]"></div>

             <div class="mt-20 pt-8 border-t">
                 <button onclick="document.getElementById('staff-login-box').classList.remove('hidden'); document.getElementById('student-home').classList.add('hidden')" class="text-slate-300 font-bold uppercase text-[9px] tracking-widest hover:text-indigo-950 transition-colors">Institutional Management Login</button>
             </div>
        </div>
    </div>

    <!-- STAFF LOGIN (Hidden behind link) -->
    <div id="staff-login-box" class="hidden max-w-sm mx-auto mt-20 p-12 bg-white rounded-[3.5rem] shadow-2xl border-t-8 border-indigo-950 text-center italic italic">
        <h2 class="text-4xl font-black text-indigo-950 mb-10 tracking-tighter uppercase italic italic">Staff Access</h2>
        <input id="staff-u" placeholder="Enter Staff User ID" class="w-full bg-slate-50 border-2 p-5 rounded-2xl mb-4 font-black tracking-widest uppercase">
        <input id="staff-p" type="password" placeholder="Pass-key" class="w-full bg-slate-50 border-2 p-5 rounded-2xl mb-10 text-3xl font-black text-center shadow-inner">
        <button onclick="loginStaff()" class="w-full bg-indigo-950 text-white p-5 rounded-2xl font-black text-xl active:scale-90 transition">Gal Dash-ka Maareynta</button>
        <button onclick="location.reload()" class="mt-6 text-[9px] text-gray-300 uppercase underline block w-full italic">Xir Panel-kan</button>
    </div>

    <!-- DASHBOARD AREA -->
    <div id="dashboard-ui" class="hidden p-8 lg:p-20 max-w-6xl mx-auto animate-fade-in italic italic">
        <h2 id="user-role" class="text-5xl font-black text-indigo-950 mb-16 uppercase underline underline-offset-8 decoration-yellow-500 decoration-8 italic italic">PORTAL DASHBOARD</h2>
        
        <!-- TEACHER -->
        <div id="teacher-ui" class="hidden max-w-4xl mx-auto animate-fade-in italic italic italic">
             <div class="bg-white p-12 rounded-[5rem] shadow-2xl border border-indigo-50 text-center italic italic italic italic">
                 <h2 class="text-3xl font-black mb-12 text-indigo-950 underline decoration-indigo-200">Gudbi Natiijo Hub</h2>
                 <input id="subject-name" placeholder="E.g EPSY 261" class="w-full p-8 border bg-gray-50 rounded-3xl mb-8 font-black text-4xl text-center focus:border-indigo-900 uppercase shadow-inner">
                 <textarea oninput="onDataPaste(event)" placeholder="Xogta Excel halkan PASTE ku dheh durbaba..." class="w-full h-40 p-5 rounded-3xl border bg-indigo-50/20 text-[9px] mb-4 outline-none italic tracking-widest italic italic"></textarea>
                 <p id="paste-status" class="font-black text-indigo-950 mb-10 uppercase italic"></p>
                 <button onclick="submitSub()" class="w-full bg-indigo-950 text-white p-8 rounded-[4rem] font-black text-3xl shadow-xl hover:scale-105 active:scale-95 transition">GUDBI NATIIJADA REGISTRY HUB</button>
             </div>
        </div>

        <div id="audit-list"></div>
    </div>

</body>
</html>
