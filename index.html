<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KCTE OFFICIAL PORTAL v18 - FINAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, getDocs, updateDoc, doc, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDoMZETvL5-oYm5wiP2dcbLm1p6ZfsgvjE",
            authDomain: "kctereg-online.firebaseapp.com",
            projectId: "kctereg-online",
            storageBucket: "kctereg-online.firebasestorage.app",
            messagingSenderId: "308277595556",
            appId: "1:308277595556:web:1b1814886668eda0310531"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- MASTER CLEANER: Xaliya cilada ID-ga (Space iyo Slash iska indho-tir) ---
        const smartMatch = (t) => String(t).toUpperCase().replace(/[^A-Z0-9]/g, '').trim();

        // --- STAFF LOGIN ---
        window.staffLogin = () => {
            const u = document.getElementById('u_id').value.trim();
            const p = document.getElementById('p_id').value.trim();

            if (u === "Macalin114" && p === "kctepass") return setupUI("Macalin");
            if (u === "D.head 5353" && p === "headpass") return setupUI("HOD");
            if (u === "REG.12345" && p === "regpass") return setupUI("REG");
            if (u === "dean12345" && p === "deanpass") return setupUI("Dean");

            alert("KHALAD: Magaca ama Password Staff-ka ma jiro.");
        };

        function setupUI(role) {
            document.getElementById('student-home').classList.add('hidden');
            document.getElementById('staff-modal').classList.add('hidden');
            document.getElementById('dashboard-ui').classList.remove('hidden');
            document.getElementById('current-role-txt').innerText = role;

            if (role === "Macalin") document.getElementById('teacher-ui').classList.remove('hidden');
            if (['HOD', 'REG', 'Dean'].includes(role)) loadManagementAudits(role);
        }

        // --- ARDAYDA SEARCH LOGIC (THE FIX) ---
        window.checkFinalResult = async () => {
            const searchInput = document.getElementById('st_search').value.trim();
            if(!searchInput) return alert("Fadlan qor ID SRLD lambarkaaga.");

            const searchTarget = smartMatch(searchInput);
            const resArea = document.getElementById('st-result-view');
            resArea.innerHTML = "<p class='text-white animate-pulse font-bold'>RAADINTA DATABASE-KA KCTE...</p>";

            const q = query(collection(db, "grades_v18"), where("status", "==", "APPROVED"));
            const snap = await getDocs(q);
            let matchData = null;

            snap.forEach(docSnap => {
                const sheet = docSnap.data().students;
                const match = sheet.find(s => smartMatch(s.sid) === searchTarget || smartMatch(s.name).includes(searchTarget));
                if(match) { matchData = { val: match, subj: docSnap.data().subject }; }
            });

            if(matchData) {
                resArea.innerHTML = `
                <div class='mt-6 p-8 bg-white border-t-[12px] border-yellow-500 rounded-[3rem] shadow-[0_40px_100px_rgba(0,0,0,0.5)] animate-fade-in text-center'>
                    <div class='flex flex-col items-center mb-8'>
                         <span class='bg-indigo-950 text-white px-4 py-1 rounded-full text-[8px] font-black uppercase tracking-[0.3em] mb-4 shadow-xl'>Official KCTE Transcript</span>
                         <p class='text-xs font-black text-gray-400 uppercase tracking-tighter'>Student Full Name</p>
                         <h2 class='text-4xl font-black text-indigo-950 uppercase leading-tight italic'>${matchData.val.name}</h2>
                    </div>

                    <div class='grid grid-cols-2 gap-4 mt-6 bg-slate-50 p-4 rounded-3xl border-2 border-indigo-50/50 shadow-inner'>
                         <div class='text-left border-r'> <p class='text-[8px] font-black opacity-40 uppercase'>Department/Maadada</p> <h4 class='font-black text-indigo-900 uppercase'>${matchData.subj}</h4> </div>
                         <div class='text-left pl-2'> <p class='text-[8px] font-black opacity-40 uppercase'>Official ID No.</p> <h4 class='font-black text-slate-500'>${matchData.val.sid}</h4> </div>
                    </div>

                    <div class='grid grid-cols-2 gap-4 mt-10'>
                        <div class='bg-white p-6 rounded-3xl shadow-xl border border-indigo-50 text-indigo-950'>
                             <span class='text-[9px] font-black uppercase opacity-30'>Wadarta (Score 100/)</span>
                             <h2 class='text-4xl font-black italic tracking-tighter'>100/${matchData.val.mark}</h2>
                        </div>
                        <div class='bg-indigo-950 p-6 rounded-3xl shadow-2xl border-b-8 border-yellow-500 text-white italic overflow-hidden'>
                             <span class='text-[9px] font-black uppercase opacity-50 underline decoration-yellow-400'>Letter Grade (Hub Hub)</span>
                             <h2 class='text-6xl font-black tracking-widest'>${matchData.val.grade}</h2>
                        </div>
                    </div>
                    <p class='mt-12 text-[10px] text-green-600 font-bold uppercase underline decoration-dotted'>Verified Registration System-OK</p>
                </div>`;
            } else {
                resArea.innerHTML = `<div class='mt-6 p-8 bg-red-50 text-red-600 rounded-[2rem] font-bold text-[11px] uppercase italic animate-bounce shadow-xl border border-red-100 text-center'>XOG LAGUMA HELIN: ID Number (${searchInput}) laguma hayo liiska OGGOLAANSHO helay (APPROVED). <br><br>Hubi: Ma 'REG.12345' baa "Final Approve" dhuftay?</div>`;
            }
        };

        // --- 3. TEACHER (MACALIN PASTE) ---
        let currentBuffer = [];
        window.processDataEntry = (e) => {
            const rows = e.target.value.split("\n");
            currentBuffer = [];
            rows.forEach(r => {
                const c = r.split("\t");
                if(c.length >= 3){
                    let name = (c[1] || "").split("+")[0].split("=")[0].trim();
                    let sid = (c[2] || "").trim();
                    let mark = c.find(val => !isNaN(val) && val != "" && val.length >= 1) || "0";
                    let grade = (c[c.length-1] || "F").toUpperCase().trim();
                    if(name && !name.toLowerCase().includes("name")) currentBuffer.push({name, sid, mark, grade});
                }
            });
            document.getElementById('st_count').innerText = currentBuffer.length + " Arday ayaa laga diyaariyey xogta Excel-kaada.";
        };

        window.submitActionMaster = async () => {
            const subjName = document.getElementById('subj_title').value.trim();
            if(!subjName || currentBuffer.length == 0) return alert("Magaca maadada qor iyo Xogta Excel.");
            await addDoc(collection(db, "grades_v18"), {
                subject: subjName.toUpperCase(), instructor: "Macalin114",
                students: currentBuffer, status: "PENDING_HOD", date: new Date().toLocaleString()
            });
            alert("U GUDUBTI MADAXDA!"); location.reload();
        };

        // --- 4. APPROVAL WORKFLOW ---
        function loadManagementAudits(role) {
            const q = role === 'Dean' ? collection(db,"grades_v18") : query(collection(db,"grades_v18"), where("status","==",(role==='HOD'?'PENDING_HOD':'PENDING_REG')));
            onSnapshot(q, snap => {
                let html = "";
                snap.forEach(ds => {
                    const i = ds.data();
                    let stH = ""; i.students.forEach(s => stH += `<tr><td class='border p-1'>${s.sid}</td><td class='border p-1'>${s.name}</td><td class='border p-1'>${s.mark}</td><td class='border p-1 font-black text-red-600'>${s.grade}</td></tr>`);
                    html += `
                    <div class='bg-white p-10 rounded-[3rem] shadow-2xl border-l-[20px] border-indigo-950 mb-12 animate-fade-in'>
                        <div class='flex flex-col lg:flex-row justify-between gap-6 border-b-2 pb-6 mb-4'>
                            <div><h2 class='text-3xl font-black uppercase text-indigo-950 underline underline-offset-4 decoration-yellow-400'>${i.subject}</h2><p class='text-[10px] text-gray-400 font-bold italic tracking-widest mt-1'>BY INSTRUCTOR: Macalin114</p></div>
                            <div class='flex gap-2 items-center'>
                                ${(role=='HOD'&&i.status=='PENDING_HOD') ? `<button onclick="actionSt('${ds.id}','PENDING_REG')" class='bg-green-600 text-white px-6 py-2 rounded-xl text-[10px] font-black shadow-xl uppercase italic'>Ogolaw (REG-GEEY)</button>` : ""}
                                ${(role=='REG'&&i.status=='PENDING_REG') ? `<button onclick="actionSt('${ds.id}','APPROVED')" class='bg-indigo-950 text-white px-8 py-3 rounded-2xl text-[11px] font-black shadow-[0_20px_50px_rgba(49,46,129,0.3)] tracking-tighter uppercase italic italic italic italic'>FINAL APPROVE (ARDAA)</button>` : ""}
                                <span class='p-1 bg-gray-50 border rounded text-[8px] font-bold opacity-30 tracking-widest uppercase italic ml-2'>Status: ${i.status}</span>
                            </div>
                        </div>
                        <details class="cursor-pointer font-black text-blue-500 text-xs italic tracking-widest uppercase'><summary>Hubi Natiijada Miiska ah (Detailed View) ▼</summary>
                             <table class='w-full text-left text-[11px] border mt-6'><thead class='bg-slate-50 uppercase'><tr><th>ID No</th><th>Student Name</th><th>Total 100/</th><th>Letter Grade</th></tr></thead><tbody>${stH}</tbody></table>
                        </details>
                    </div>`;
                });
                document.getElementById('admin-audit-area').innerHTML = html || "<p class='p-20 text-center italic opacity-30 uppercase font-black tracking-widest'>Majiraan wax buundo ah halkan hadda.</p>";
            });
        }
        window.actionSt = async(id, s) => { await updateDoc(doc(db,"grades_v18",id), {status:s}); alert("Process Ok!"); };

    </script>
    <style> .animate-fade-in { animation: fI 0.5s ease-out; } @keyframes fI { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } } </style>
</head>
<body class="bg-gray-200 font-sans tracking-tight text-slate-900 italic overflow-x-hidden italic">

    <!-- ARDAYDA LANDING PAGE -->
    <div id="student-home" class="container mx-auto p-12 lg:p-24 max-w-4xl text-center italic">
        <h1 class="text-7xl lg:text-8xl font-black text-indigo-950 tracking-widest italic mb-2 leading-none italic uppercase italic italic italic">KCTE PORTAL</h1>
        <p class="text-indigo-400 font-bold uppercase text-[10px] tracking-[0.4em] mb-12 underline decoration-yellow-400 decoration-8 underline-offset-8">Public Result Search Gateway</p>
        
        <div class="bg-indigo-900 p-16 rounded-[5rem] shadow-[0_40px_100px_-20px_rgba(49,46,129,0.5)] border-t-[20px] border-yellow-500 relative overflow-hidden italic italic italic">
             <div class="absolute -top-10 -right-10 w-60 h-60 bg-indigo-50/10 rounded-full blur-3xl italic"></div>
             <h2 class="text-6xl font-black text-white italic tracking-tighter mb-10 leading-none">Raadi Buundada</h2>
             
             <div class="max-w-md mx-auto space-y-4">
                 <input id="st_search" placeholder="Enter SRLD/ID" class="w-full bg-white p-10 rounded-[4rem] text-center font-black text-5xl italic outline-none shadow-2xl focus:ring-[15px] focus:ring-yellow-500 transition text-indigo-950 uppercase italic italic italic placeholder:opacity-10 italic">
                 <button onclick="checkFinalResult()" class="w-full bg-yellow-500 text-indigo-950 py-10 rounded-[4rem] font-black text-4xl shadow-xl hover:scale-105 active:scale-95 transition underline decoration-indigo-950 decoration-4">CHECK BUUNDADAYDA ➜</button>
             </div>

             <div id="st-result-view" class="min-h-[250px]"></div>

             <div class="mt-24 pt-8 border-t border-white/5 italic">
                  <button onclick="document.getElementById('staff-modal').classList.remove('hidden');" class="text-white/20 hover:text-white transition uppercase font-black text-[9px] tracking-widest italic">Institutional Management Hub Access Portal Login</button>
             </div>
        </div>
    </div>

    <!-- STAFF MODAL -->
    <div id="staff-modal" class="hidden fixed inset-0 bg-indigo-950/98 backdrop-blur-3xl flex items-center justify-center p-8 z-[1000] italic">
        <div class="bg-white p-16 rounded-[4rem] w-full max-w-sm text-center shadow-2xl border-t-8 border-indigo-950 relative">
             <h2 class="text-4xl font-black text-indigo-950 mb-1 tracking-tighter italic">Enter Dashboard</h2>
             <p class="text-[9px] font-black text-slate-300 border-b pb-4 mb-10 italic uppercase decoration-yellow-500 decoration-2">Admin Identify HUB Login</p>
             <input id="u_id" placeholder="Staff Name" class="w-full bg-slate-50 border p-5 rounded-2xl mb-4 font-black italic tracking-widest text-center shadow-inner uppercase">
             <input id="p_id" type="password" placeholder="Pass-key Number" class="w-full bg-slate-50 border p-5 rounded-2xl mb-10 font-black text-5xl text-center italic focus:border-yellow-500 outline-none">
             <button onclick="staffLogin()" class="w-full bg-indigo-950 text-white p-7 rounded-[3rem] font-black text-xl hover:shadow-indigo-400 active:scale-90 transition">Login Gateway Portal</button>
             <button onclick="location.reload()" class="mt-6 text-[10px] text-gray-400 underline uppercase italic font-bold">Kala xir / Exit Portal Search Hub Hub</button>
        </div>
    </div>

    <!-- MAIN PORTAL WRAPPER -->
    <div id="dashboard-ui" class="hidden p-8 lg:p-16 max-w-6xl mx-auto italic italic">
        <div class="flex items-center gap-4 mb-16 border-b-8 border-indigo-950 pb-8 italic italic">
             <h1 id="current-role-txt" class="text-6xl font-black text-indigo-950 italic italic uppercase underline decoration-yellow-400 decoration-8 underline-offset-8 decoration-8">Staff</h1>
             <p class="text-indigo-300 font-bold mt-12 tracking-[0.2em] italic uppercase underline">Dashboard Hub Account Status: Connected</p>
        </div>

        <!-- MACALIN INPUT PANEL -->
        <div id="teacher-ui" class="hidden animate-fade-in italic italic">
            <div class="bg-white p-12 rounded-[5.5rem] shadow-2xl border-t-[20px] border-green-500 text-center italic mb-10 group relative transition-all italic italic italic">
                 <input id="subj_title" placeholder="Magaca Maadada / SUBJECT" class="w-full p-8 border bg-slate-50 rounded-3xl font-black text-4xl text-center italic uppercase outline-none focus:border-indigo-900 shadow-inner italic underline decoration-yellow-500 decoration-4">
                 <p class="text-gray-400 font-bold uppercase text-[9px] mb-8 mt-12 underline tracking-[0.3em] decoration-indigo-50 italic">KCTE Excel Table Pasteur HUB 100%</p>
                 <textarea oninput="processDataEntry(event)" placeholder="Xogta Excel copy halkan Paste ku dheh..." class="w-full h-44 border-4 p-8 rounded-[4rem] bg-indigo-50/20 text-[9px] italic outline-none tracking-widest shadow-inner mb-6 transition italic italic italic italic"></textarea>
                 <h2 id="st_count" class="font-black text-indigo-950 mb-10 uppercase text-lg italic decoration-yellow-400 underline decoration-2 underline-offset-4"></h2>
                 <button onclick="submitActionMaster()" class="w-full bg-indigo-950 text-white p-10 rounded-[4.5rem] font-black text-4xl shadow-xl hover:scale-105 active:scale-95 transition italic italic tracking-tighter uppercase underline decoration-yellow-400 decoration-8 underline-offset-4 italic">Gudbi Hada Official HubHub ➜</button>
            </div>
        </div>

        <div id="admin-audit-area"></div>
    </div>

</body>
</html>
