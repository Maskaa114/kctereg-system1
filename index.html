<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KCTE REGISTRATION PORTAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, getDocs, updateDoc, doc, onSnapshot, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDoMZETvL5-oYm5wiP2dcbLm1p6ZfsgvjE",
            authDomain: "kctereg-online.firebaseapp.com",
            projectId: "kctereg-online",
            storageBucket: "kctereg-online.firebasestorage.app",
            messagingSenderId: "308277595556",
            appId: "1:308277595556:web:1b1814886668eda0310531"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let activeRole = "";
        let excelData = [];
        let stUser = "";
        let stIdNo = "";

        // --- AUTH LOGIC ---
        window.loginProcess = async () => {
            const u = document.getElementById('l-u').value.trim();
            const p = document.getElementById('l-p').value.trim();

            if(u === "Macalin114" && p === "kctepass") return renderDash("Macalin");
            if(u === "D.head 5353" && p === "headpass") return renderDash("HOD");
            if(u === "REG.12345" && p === "regpass") return renderDash("REG");
            if(u === "dean12345" && p === "deanpass") return renderDash("Dean");

            // Check Student Account
            const q = query(collection(db, "users"), where("username", "==", u), where("password", "==", p));
            const snap = await getDocs(q);
            if(!snap.empty){
                stUser = u;
                stIdNo = snap.docs[0].data().idNo;
                renderDash("Arday");
            } else { alert("Login failed! Username ama Password ma jiro."); }
        };

        function renderDash(role){
            activeRole = role;
            document.getElementById('landing-page').classList.add('hidden');
            document.getElementById('login-div').classList.add('hidden');
            document.getElementById('app-main').classList.remove('hidden');
            document.getElementById('nav-role').innerText = role + " Session";

            if(role === "Macalin") document.getElementById('teacher-ui').classList.remove('hidden');
            if(role === "Arday") loadStudentGrades();
            if(['HOD','REG','Dean'].includes(role)) loadApprovals(role);
        }

        // --- TEACHER: COPY & PASTE ---
        window.onPaste = (e) => {
            const lines = e.target.value.split("\n");
            excelData = [];
            lines.forEach(l => {
                const c = l.split("\t");
                if(c.length >= 3){
                    let name = c[1] || "";
                    let sid = (c[2] || "").toUpperCase().replace(/\s+/g,'');
                    let mark = c.find(val => !isNaN(val) && val != "" && val.length >= 1) || "0";
                    let grade = c[c.length-1].toUpperCase().trim() || "F";
                    if(name && !name.toLowerCase().includes("name")) excelData.push({name, sid, mark, grade});
                }
            });
            document.getElementById('c-count').innerText = "Waa la diyaariyay: " + excelData.length + " Arday.";
        };

        window.submitToHOD = async () => {
            const sub = document.getElementById('sub-name').value;
            if(!sub || excelData.length==0) return alert("Subject name iyo Xog loo baahan yahay!");
            await addDoc(collection(db, "official_records"), {
                subject: sub.toUpperCase(), teacher: "Macalin114",
                data: excelData, status: "PENDING_HOD", at: new Date().toLocaleString()
            });
            alert("Waa la gudbiyey!"); location.reload();
        };

        // --- MANAGEMENT ---
        function loadApprovals(r){
            const q = r==='Dean' ? collection(db,"official_records") : query(collection(db,"official_records"), where("status","==",(r==='HOD'?'PENDING_HOD':'PENDING_REG')));
            onSnapshot(q, snap => {
                let h = "";
                snap.forEach(d => {
                    const info = d.data();
                    let stH = "";
                    info.data.forEach(s => stH += `<tr><td class="p-1">${s.sid}</td><td class="p-1">${s.name}</td><td class="p-1">${s.mark}</td><td class="p-1 font-bold text-red-600">${s.grade}</td></tr>`);
                    h += `<div class='bg-white p-6 rounded-3xl shadow-xl mb-6 border-l-[15px] border-indigo-900 animate-fade-in'>
                        <div class='flex justify-between items-center mb-4'>
                            <div><h3 class='font-black'>${info.subject}</h3><p class='text-[10px]'>BY: ${info.teacher}</p></div>
                            <div class='flex gap-1'>
                                ${(r=='HOD'&&info.status=='PENDING_HOD') ? `<button onclick="act('${d.id}','PENDING_REG')" class='bg-green-600 text-white p-2 rounded text-[10px]'>Approve</button>` : ""}
                                ${(r=='REG'&&info.status=='PENDING_REG') ? `<button onclick="act('${d.id}','APPROVED')" class='bg-indigo-900 text-white p-2 rounded text-[10px] font-black underline'>REG FINAL APPROVE</button>` : ""}
                                <span class='p-1 bg-gray-100 rounded text-[9px] uppercase font-black'>${info.status}</span>
                            </div>
                        </div>
                        <details class="text-[9px] cursor-pointer text-indigo-400 font-bold"><summary>Table Preview</summary>
                            <table class='w-full text-left'><thead><tr><th>ID</th><th>Name</th><th>Mark</th><th>Grade</th></tr></thead><tbody>${stH}</tbody></table>
                        </details>
                    </div>`;
                });
                document.getElementById('admin-list').innerHTML = h;
            });

            // ADD PASSWORD RESET PANEL FOR REG
            if(r === "REG"){
                document.getElementById('reg-controls').classList.remove('hidden');
                loadAllStudents();
            }
        }

        window.act = async(id,s) => { await updateDoc(doc(db, "official_records", id), { status: s }); alert("Success!"); };

        // --- REG: PASSWORD RESET (SPECIAL POWER) ---
        function loadAllStudents(){
            onSnapshot(collection(db, "users"), snap => {
                let h = "";
                snap.forEach(d => {
                    const u = d.data();
                    h += `<div class="bg-indigo-50 p-2 mb-2 rounded flex justify-between items-center">
                        <span class="text-xs font-bold">${u.username} (${u.idNo})</span>
                        <button onclick="resetPass('${d.id}')" class="bg-red-500 text-white px-3 py-1 rounded-lg text-[10px] font-bold">RESET PASSWORD (TO 123)</button>
                    </div>`;
                });
                document.getElementById('st-list-reset').innerHTML = h;
            });
        }
        window.resetPass = async (un) => { await updateDoc(doc(db, "users", un), { password: "123" }); alert("Password changed to: 123"); };

        // --- STUDENT SIGN UP ---
        window.studentSignup = async () => {
            const sid = document.getElementById('reg-id').value.trim().toUpperCase().replace(/\s+/g,'');
            const un = document.getElementById('reg-un').value.trim();
            const pw = document.getElementById('reg-pw').value.trim();
            if(!sid || !un || !pw) return alert("Fadlan wada buuxi xogta.");

            const snap = await getDocs(query(collection(db, "official_records"), where("status", "==", "APPROVED")));
            let valid = false;
            snap.forEach(d => { if(d.data().data.find(s => s.sid === sid)) valid = true; });

            if(valid) {
                await setDoc(doc(db, "users", un), { username: un, password: pw, idNo: sid });
                alert("Akoonka waa la sameeyay! Hadda login dheh."); location.reload();
            } else { alert("ID Number-kan wali xog ma oggolaan Registrar!"); }
        };

        // --- ARDAY DASHBOARD (MY GRADES) ---
        async function loadStudentGrades(){
            document.getElementById('student-view').classList.remove('hidden');
            const snap = await getDocs(query(collection(db, "official_records"), where("status", "==", "APPROVED")));
            let listH = "";
            snap.forEach(d => {
                const match = d.data().data.find(s => s.sid === stIdNo);
                if(match){
                    listH += `<div class='p-8 bg-white rounded-[3rem] shadow-2xl border-t-[10px] border-indigo-950 mb-6 text-center animate-fade-in'>
                        <h2 class='text-indigo-900 font-black uppercase text-[10px] mb-4'>Academic Grade Record</h2>
                        <h1 class='text-4xl font-black text-indigo-950 uppercase'>${match.name}</h1>
                        <p class='text-xs font-bold text-slate-400 mt-2 italic'>COURSE: ${d.data().subject}</p>
                        <div class='grid grid-cols-2 gap-4 mt-8'>
                            <div class='bg-gray-50 p-6 rounded-3xl border'> <span class='text-[8px] font-bold text-gray-300'>TOTAL SCORE</span> <h2 class='text-4xl font-black'>100/${match.mark}</h2> </div>
                            <div class='bg-indigo-950 text-white p-6 rounded-3xl shadow-xl shadow-indigo-100 border-b-8 border-yellow-500'> <span class='text-[8px] font-bold text-indigo-400 italic'>GRADE</span> <h2 class='text-6xl font-black italic underline decoration-yellow-400'>${match.grade}</h2> </div>
                        </div>
                    </div>`;
                }
            });
            document.getElementById('st-grades-list').innerHTML = listH || "<p class='p-20 opacity-30 text-center font-bold'>Wali wax buundo ah laguma hayo ID-gaaga.</p>";
        }

    </script>
</head>
<body class="bg-gray-100 font-sans tracking-tight">

    <!-- START PAGE (Landing Ardayga u leh) -->
    <div id="landing-page" class="fixed inset-0 bg-indigo-950 flex flex-col items-center justify-center p-8 z-[100] text-center italic">
        <h1 class="text-6xl font-black text-white mb-4 italic tracking-widest italic leading-none">KCTE <span class="bg-yellow-500 text-indigo-950 px-2 rounded italic">REGISTRY</span></h1>
        <p class="text-indigo-300 mb-12 uppercase font-black text-[10px] tracking-[0.5em] italic">Kebridahar Teacher Center Portal</p>
        <button onclick="document.getElementById('landing-page').classList.add('hidden');" class="bg-white text-indigo-950 px-20 py-8 rounded-[4rem] font-black text-3xl shadow-[0_20px_50px_rgba(255,255,255,0.2)] hover:scale-105 active:scale-95 transition-all">KA EEG BUUNDADA ➜</button>
        <button onclick="document.getElementById('landing-page').classList.add('hidden'); document.getElementById('login-div').classList.remove('hidden');" class="mt-8 text-yellow-500 font-black uppercase text-xs border-b border-yellow-500 pb-1 italic">Staff Admin Login</button>
    </div>

    <nav id="portal-nav" class="hidden bg-indigo-950 p-6 flex justify-between border-b-8 border-yellow-500 text-white shadow-xl items-center sticky top-0 z-[100] italic">
        <h1 class="font-black text-xl leading-none">KCTE HUB</h1>
        <div id="nav-role" class="text-[9px] bg-white/10 px-4 py-1 rounded-full uppercase tracking-tighter italic">Secure Access</div>
    </nav>

    <!-- DUAL LOGIN & SIGNUP -->
    <div id="login-div" class="max-w-md mx-auto mt-20 p-12 bg-white rounded-[3.5rem] shadow-2xl border border-indigo-50 text-center">
        <h2 class="text-4xl font-black text-indigo-950 mb-1 leading-none uppercase italic tracking-tighter">PORTAL ACCESS</h2>
        <p class="text-[9px] font-black text-slate-400 mb-10 border-b pb-4 italic tracking-widest decoration-yellow-400">Arday iyo Staff login</p>
        <input id="l-u" placeholder="Geli Username-ka" class="w-full bg-slate-50 border-2 p-5 rounded-2xl mb-4 font-black italic tracking-widest shadow-inner outline-none focus:border-yellow-500">
        <input id="l-p" type="password" placeholder="Pass-key" class="w-full bg-slate-50 border-2 p-5 rounded-2xl mb-8 outline-none font-black text-3xl text-center shadow-inner tracking-widest mb-10 italic">
        <button onclick="loginProcess()" class="w-full bg-indigo-950 text-white py-6 rounded-3xl font-black text-xl hover:shadow-indigo-400 active:scale-90 transition-all uppercase italic italic shadow-indigo-50">SIGN IN GATEWAY</button>
        <p class="mt-12 text-[10px] text-gray-400 italic">Arday cusub baad tahay? <br>
           <button onclick="document.getElementById('sign-up-modal').classList.remove('hidden')" class="text-indigo-600 font-black underline decoration-yellow-500 uppercase tracking-tighter mt-1 italic">Akoon Sameeyo / Create Student Account</button>
        </p>
    </div>

    <!-- MAIN APP DIV -->
    <div id="app-main" class="hidden p-8 lg:p-12 max-w-5xl mx-auto italic">
        <!-- TEACHER -->
        <div id="teacher-ui" class="hidden">
             <div class="bg-white p-12 rounded-[5rem] shadow-2xl text-center border-t-[15px] border-green-500 mb-10 italic italic">
                <h2 class="text-3xl font-black text-indigo-950 mb-10 italic uppercase tracking-tighter decoration-yellow-400 underline underline-offset-8">Gudbi Natiijo</h2>
                <input id="sub-name" placeholder="Magaca Maadada" class="w-full p-8 border bg-gray-50 rounded-3xl mb-8 font-black text-4xl text-center outline-none focus:border-indigo-900 shadow-inner">
                <textarea oninput="onPaste(event)" placeholder="Xogta Excel-ka halkan Paste (duji) ka dheh..." class="w-full h-40 border p-5 rounded-3xl text-[9px] mb-4 outline-none italic tracking-[0.2em] italic italic"></textarea>
                <p id="c-count" class="font-black text-indigo-900 mb-6 italic italic uppercase"></p>
                <button onclick="submitToHOD()" class="w-full bg-indigo-950 text-white p-8 rounded-[4rem] font-black text-2xl shadow-xl hover:scale-105 active:scale-95 transition-all">DHEEFTA U DAAFI Maareeyaha</button>
             </div>
        </div>

        <!-- ARDAY (MY GRADES ONLY) -->
        <div id="student-view" class="hidden">
            <h2 class="text-5xl font-black text-indigo-950 mb-12 italic underline underline-offset-8 decoration-yellow-400 decoration-8 tracking-tighter uppercase italic italic">Result Profile</h2>
            <div id="st-grades-list"></div>
        </div>

        <!-- LIST AREA -->
        <div id="admin-list" class="max-w-3xl mx-auto"></div>

        <!-- REG PASSWORD RESET AREA -->
        <div id="reg-controls" class="hidden bg-white p-8 rounded-3xl border-2 mt-10 border-indigo-950 shadow-2xl">
             <h3 class="font-black text-red-600 mb-4 underline uppercase italic">MAAMULKA PASSWORD-ka ARDAYDA</h3>
             <div id="st-list-reset"></div>
        </div>
    </div>

    <!-- STUDENT SIGNUP MODAL -->
    <div id="sign-up-modal" class="hidden fixed inset-0 bg-indigo-950/98 flex items-center justify-center p-8 z-[1000] backdrop-blur-3xl italic italic italic italic">
        <div class="bg-slate-100 p-12 rounded-[4rem] w-full max-w-sm text-center shadow-2xl border-t-[15px] border-yellow-500 overflow-hidden relative italic italic italic">
             <h2 class="text-3xl font-black text-indigo-950 mb-1 leading-none uppercase italic italic italic">Student Sign Up</h2>
             <p class="text-[9px] font-black text-slate-300 mb-8 italic">ID SRLD hubi ka dib akoon sameyso</p>
             <input id="reg-id" placeholder="Geli ID (E.g SRLD/141/15)" class="w-full p-6 rounded-2xl mb-4 border font-black text-center shadow-inner">
             <input id="reg-un" placeholder="Username (Xulo adigu)" class="w-full p-6 rounded-2xl mb-4 border font-bold text-center">
             <input id="reg-pw" type="password" placeholder="Pass Samayso" class="w-full p-6 rounded-2xl mb-10 border font-bold text-center italic italic italic italic">
             <button onclick="studentSignup()" class="w-full bg-indigo-950 text-white p-7 rounded-[2.5rem] font-black text-xl hover:shadow-indigo-100 transition shadow-lg italic">CREATE ACCOUNT NOW</button>
             <button onclick="document.sign-up-modal.classList.add('hidden')" class="mt-8 text-[9px] font-bold text-gray-300 border-b border-gray-200">Xir / Close Modal</button>
        </div>
    </div>

</body>
</html>
