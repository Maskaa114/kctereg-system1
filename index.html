<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KCTE OFFICIAL PORTAL v20</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, getDocs, updateDoc, doc, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDoMZETvL5-oYm5wiP2dcbLm1p6ZfsgvjE",
            authDomain: "kctereg-online.firebaseapp.com",
            projectId: "kctereg-online",
            storageBucket: "kctereg-online.firebasestorage.app",
            messagingSenderId: "308277595556",
            appId: "1:308277595556:web:1b1814886668eda0310531"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Standardizer: Wuxuu ID-ga ka saaraa /, . iyo booska si uusan qalad u dhicin
        const clean = (t) => String(t).toUpperCase().replace(/[^A-Z0-9]/g, '').trim();

        // --- 1. STAFF LOGIN ---
        window.staffLogin = () => {
            const u = document.getElementById('u').value.trim();
            const p = document.getElementById('p').value.trim();
            if(u==="Macalin114" && p==="kctepass") return startPortal("Macalin");
            if(u==="D.head 5353" && p==="headpass") return startPortal("HOD");
            if(u==="REG.12345" && p==="regpass") return startPortal("REG");
            if(u==="dean12345" && p==="deanpass") return startPortal("Dean");
            alert("Credentials Not Recognized!");
        };

        function startPortal(r) {
            document.getElementById('landing').classList.add('hidden');
            document.getElementById('login-div').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            document.getElementById('nav-role').innerText = r + " Account";
            if(r === 'Macalin') document.getElementById('teacher-ui').classList.remove('hidden');
            if(['HOD','REG','Dean'].includes(r)) loadDatabase(r);
        }

        // --- 2. STUDENT TRANSCRIPT ENGINE (THE FINAL FIX) ---
        window.getNatiijo = async () => {
            const idVal = document.getElementById('search-inp').value.trim();
            if(!idVal) return alert("Fadlan ID Number qor!");

            const tid = clean(idVal); // Example: ENRLD18915
            const resArea = document.getElementById('result-area');
            resArea.innerHTML = "<p class='animate-bounce text-indigo-500 font-bold'>Raadin baa socota...</p>";

            // Waxaan ka raadineynaa collection-ka results_v20 oo kaliya 'APPROVED'
            const q = query(collection(db, "results_v20"), where("status", "==", "APPROVED"));
            const snap = await getDocs(q);
            let userFound = null; let subjects = [];

            snap.forEach(d => {
                const sheet = d.data().students;
                const match = sheet.find(s => clean(s.sid) === tid);
                if(match) {
                    userFound = match;
                    subjects.push({ name: d.data().subject, mark: match.mark, grade: match.grade });
                }
            });

            if(userFound) {
                let subHtml = "";
                subjects.forEach(sb => {
                    subHtml += `<tr class='border-b'><td class='p-3 uppercase font-bold text-xs'>${sb.name}</td><td class='p-3 text-center font-black'>100/${sb.mark}</td><td class='p-3 text-right font-black text-indigo-700 italic'>${sb.grade}</td></tr>`;
                });

                resArea.innerHTML = `
                <div class='mt-10 p-10 bg-white border-t-[20px] border-yellow-500 rounded-[3rem] shadow-[0_40px_100px_rgba(0,0,0,0.5)] animate-fade-in text-center'>
                    <p class='text-[9px] font-black text-indigo-200 uppercase mb-4 tracking-[0.4em] italic'>Verification Management Hub</p>
                    <span class='block text-[8px] font-bold text-gray-300 uppercase'>Student Transcript Holder</span>
                    <h2 class='text-4xl font-black text-indigo-950 uppercase mb-8 leading-none'>${userFound.name}</h2>
                    
                    <div class="overflow-hidden rounded-2xl border bg-slate-50 mb-10 text-left shadow-inner">
                        <table class='w-full'>
                            <thead class='bg-indigo-950 text-white text-[9px]'><tr><th class='p-2 uppercase'>Course Name</th><th class='p-2 text-center uppercase'>CA/Score</th><th class='p-2 text-right uppercase'>Grade</th></tr></thead>
                            <tbody>${subHtml}</tbody>
                        </table>
                    </div>
                    
                    <p class='text-[10px] text-green-600 font-black italic uppercase tracking-tighter'>Certified Registry Verified Account ✓</p>
                </div>`;
            } else {
                resArea.innerHTML = `<div class='mt-8 p-6 bg-red-100 text-red-700 rounded-3xl font-black text-[11px] uppercase italic animate-shake'>ID lambarkaagii lama helin xog oggolaansho "FINAL" ah heshay. (Malaha REG Head wali ma oggolaan).</div>`;
            }
        };

        // --- 3. TEACHER HANDLING ---
        let currentPasted = [];
        window.processPaste = (e) => {
            const raw = e.target.value.split("\n");
            currentPasted = [];
            raw.forEach(r => {
                const c = r.split("\t");
                if(c.length >= 3){
                    let name = (c[1] || "").split("+")[0].trim();
                    let id = (c[2] || "").trim();
                    let mark = c.find(v => !isNaN(v) && v != "" && v.length >= 1) || "0";
                    let grade = (c[c.length-1] || "F").toUpperCase().trim();
                    if(name && !name.toLowerCase().includes("name")) currentPasted.push({name, sid:id, mark, grade});
                }
            });
            document.getElementById('c-count').innerText = "Ardayda Diyaar: " + currentPasted.length;
        };

        window.submitSub = async () => {
            const subName = document.getElementById('sj-field').value.trim();
            if(!subName || currentPasted.length == 0) return alert("Subj Name & Paste needed.");
            await addDoc(collection(db, "results_v20"), {
                subject: subName.toUpperCase(), instructor: "Macalin114",
                students: currentPasted, status: "PENDING_HOD", at: new Date().toLocaleString()
            });
            alert("Sent!"); location.reload();
        };

        // --- 4. AUDIT & PIPELINE ---
        function loadDatabase(r) {
            const q = r === 'Dean' ? collection(db,"results_v20") : query(collection(db,"results_v20"), where("status","==",(r==='HOD'?'PENDING_HOD':'PENDING_REG')));
            onSnapshot(q, snap => {
                let html = "";
                snap.forEach(ds => {
                    const i = ds.data();
                    let sH = ""; i.students.forEach(st => sH += `<tr><td class='border p-1'>${st.sid}</td><td class='border p-1'>${st.name}</td><td class='border p-1'>${st.mark}</td><td class='border p-1 font-bold'>${st.grade}</td></tr>`);
                    html += `<div class='bg-white p-8 rounded-3xl shadow-xl mb-10 border-l-[20px] border-indigo-950 animate-fade-in italic'>
                        <div class='flex justify-between items-center mb-2'>
                            <div><h2 class='font-black text-2xl uppercase underline decoration-yellow-400'>${i.subject}</h2><p class='text-[10px] italic'>Teacher: Macalin114</p></div>
                            <div class='flex gap-2 h-fit'>
                                ${(r=='HOD'&&i.status=='PENDING_HOD') ? `<button onclick="actDoc('${ds.id}','PENDING_REG')" class='bg-green-600 text-white px-5 py-2 rounded-xl text-xs font-bold'>Oggolaaw HUB</button>` : ""}
                                ${(r=='REG'&&i.status=='PENDING_REG') ? `<button onclick="actDoc('${ds.id}','APPROVED')" class='bg-indigo-950 text-white px-6 py-2.5 rounded-2xl text-[10px] font-black underline italic'>REG FINAL APPROVE (Live ➜)</button>` : ""}
                                <button onclick="delDocS('${ds.id}')" class='bg-red-400 text-white px-3 py-1 rounded text-xs italic font-bold'>Rejected</button>
                                <span class='p-1 bg-slate-50 border rounded text-[8px] font-bold uppercase'>${i.status}</span>
                            </div>
                        </div>
                        <details class="cursor-pointer text-[10px] font-black text-blue-500 uppercase mt-4 italic"><summary>Student Detail Auditor List ▽</summary>
                             <table class='w-full text-left mt-2 border'><thead class='bg-gray-50'><tr><th>ID No</th><th>Magaca</th><th>Tira/Score</th><th>Xaraf</th></tr></thead><tbody>${sH}</tbody></table>
                        </details>
                    </div>`;
                });
                document.getElementById('report-ui').innerHTML = html;
            });
        }
        window.actDoc = async(id,s) => { await updateDoc(doc(db,"results_v20",id), {status:s}); alert("Update Successfully!"); };
        window.delDocS = async(id) => { if(confirm("Confirm Delete?")) await deleteDoc(doc(db,"results_v20",id)); };
    </script>
    <style> .animate-fade-in { animation: f 0.4s ease-out; } @keyframes f { from { opacity:0; transform:translateY(15px); } to { opacity:1; transform:translateY(0); } } .animate-shake { animation: sK 0.3s; } @keyframes sK { 25%{transform:translateX(-10px);} 75%{transform:translateX(10px);} } </style>
</head>
<body class="bg-gray-100 font-sans tracking-tight text-indigo-950 italic">

    <!-- HOME PAGE -->
    <div id="landing" class="fixed inset-0 bg-indigo-950 flex flex-col items-center justify-center p-8 z-[500] text-center italic italic">
        <h1 class="text-7xl lg:text-9xl font-black text-white italic tracking-tighter mb-4 leading-none uppercase italic italic italic">KCTE <span class="bg-yellow-500 text-indigo-950 px-4 rounded italic shadow-2xl">REG</span></h1>
        <p class="text-indigo-400 font-bold uppercase text-[10px] tracking-[0.5em] mb-12 opacity-80 underline decoration-indigo-800 decoration-8 underline-offset-8 italic">Registry Verification System HUB v20</p>
        <button onclick="document.getElementById('landing').classList.add('hidden');" class="bg-white text-indigo-900 px-10 py-7 rounded-[4rem] font-black text-3xl shadow-xl hover:scale-105 active:scale-90 transition-all uppercase tracking-tighter shadow-indigo-100/50">HUUR CHECK GRADE ➜</button>
        <button onclick="document.getElementById('landing').classList.add('hidden'); document.getElementById('login-div').classList.remove('hidden');" class="mt-8 text-yellow-500 underline text-xs font-bold uppercase tracking-[0.4em] opacity-40">Staff HUB ACCESS DOOR Portal</button>
    </div>

    <!-- STUDENT PORTAL INTERFACE -->
    <div id="student-portal" class="container mx-auto p-12 lg:p-24 max-w-4xl text-center italic">
        <div class="bg-white p-12 lg:p-16 rounded-[4.5rem] shadow-2xl border-t-[30px] border-yellow-500 text-center relative overflow-hidden italic">
             <div class="absolute -top-10 -right-10 w-40 h-40 bg-indigo-50 opacity-10 rounded-full blur-3xl italic"></div>
             <h2 class="text-5xl font-black text-indigo-950 leading-none mb-10 tracking-tighter italic italic italic underline decoration-yellow-400 decoration-8 underline-offset-8">Gashidka Ardayga</h2>
             
             <input id="search-inp" placeholder="Geli SRLD/ID Nambarkaaga" class="w-full bg-slate-50 border-4 border-white p-10 rounded-[5rem] text-center font-black text-5xl italic outline-none focus:ring-8 focus:ring-yellow-500 text-indigo-950 shadow-inner uppercase tracking-widest placeholder:opacity-10 italic mb-8">
             <button onclick="getNatiijo()" class="w-full bg-indigo-900 text-white p-8 rounded-[4rem] font-black text-4xl shadow-xl hover:scale-105 active:scale-95 transition underline decoration-yellow-400 decoration-4 italic">Hubi Natiijada Port Hada</button>
             
             <div id="result-area" class="min-h-[200px]"></div>

             <div class="mt-20 border-t pt-10 opacity-30 italic font-black uppercase text-[8px] tracking-[0.5em]">Kebridahar Teachers Education Management Service 2026</div>
        </div>
    </div>

    <!-- STAFF LOGIN AREA -->
    <div id="login-div" class="hidden max-w-md mx-auto mt-20 p-12 bg-white rounded-[4rem] shadow-2xl border border-slate-50 text-center animate-fade-in relative italic italic">
        <h2 class="text-4xl font-black text-indigo-950 mb-1 leading-none italic italic tracking-tighter uppercase italic italic">Control Login</h2>
        <p class="text-[9px] font-black text-slate-300 uppercase tracking-widest mb-12 border-b pb-6 italic decoration-yellow-400 decoration-4">Institutional Gateway Entrance</p>
        <div class="space-y-4">
            <input id="u" placeholder="ID User Management" class="w-full bg-slate-50 border p-5 rounded-2xl mb-4 font-bold text-center outline-none focus:border-yellow-500 shadow-inner uppercase italic">
            <input id="p" type="password" placeholder="PASSWORD KEY" class="w-full bg-slate-50 border p-5 rounded-2xl mb-12 font-bold text-center text-4xl shadow-inner focus:border-yellow-400 outline-none">
            <button onclick="staffLogin()" class="w-full bg-indigo-900 text-white p-6 rounded-3xl font-black text-xl hover:shadow-indigo-400 active:scale-95 transition-all italic underline decoration-yellow-500 decoration-4 italic uppercase">Log-In Dashboard Portal ➜</button>
        </div>
        <button onclick="location.reload()" class="mt-8 text-gray-200 font-bold uppercase text-[9px] underline">Back Hub</button>
    </div>

    <!-- MAIN DASHBOARD HUB -->
    <div id="main-app" class="hidden p-8 lg:p-20 max-w-7xl mx-auto italic italic">
        <nav class="flex justify-between items-center border-b-8 border-yellow-500 pb-12 mb-20 italic">
            <h1 class="text-6xl font-black text-indigo-950 uppercase italic tracking-tighter underline underline-offset-8">Hub Portal</h1>
            <span id="nav-role" class="bg-indigo-900 text-yellow-500 px-6 py-2 rounded-full border border-indigo-400 font-black text-xs uppercase tracking-widest">Admin Hub</span>
        </nav>
        
        <!-- TEACHER INPUT -->
        <div id="teacher-ui" class="hidden animate-fade-in max-w-5xl mx-auto">
            <div class="bg-white p-12 rounded-[5.5rem] shadow-2xl border-t-[20px] border-green-500 text-center italic mb-20 italic">
                <input id="sj-field" placeholder="Enter Course Name E.g Somali I" class="w-full p-8 border bg-gray-50 rounded-3xl mb-12 font-black text-4xl text-center italic uppercase outline-none focus:border-indigo-900 shadow-inner">
                <p class="text-xs font-black text-indigo-200 uppercase mb-8 italic tracking-[0.2em] underline decoration-slate-100 underline-offset-4 decoration-2">KCTE Direct Pasteur Clipboard Dashboard</p>
                <textarea oninput="processPaste(event)" placeholder="Halkan midig-guji ka dib Paste xogtii Excel ee dhameystiran..." class="w-full h-44 p-6 border-4 border-indigo-50 bg-indigo-50/10 rounded-[3rem] text-[9px] outline-none italic tracking-widest shadow-inner mb-6 transition"></textarea>
                <h3 id="c-count" class="font-black text-indigo-950 mb-12 text-lg uppercase italic decoration-yellow-500 underline underline-offset-4 decoration-8"></h3>
                <button onclick="submitSub()" class="w-full bg-indigo-950 text-white p-10 rounded-[4rem] font-black text-4xl shadow-xl hover:shadow-indigo-200 active:scale-95 transition-all uppercase underline underline-offset-4 decoration-yellow-400 decoration-[15px] italic italic italic">Submit Records hub ➜</button>
            </div>
        </div>

        <div id="report-ui"></div>
        <div id="audit-list"></div>
    </div>

</body>
</html>
