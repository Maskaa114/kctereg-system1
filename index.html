<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KCTE MASTER PORTAL - OFFICIAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, getDocs, updateDoc, doc, onSnapshot, deleteDoc, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDoMZETvL5-oYm5wiP2dcbLm1p6ZfsgvjE",
            authDomain: "kctereg-online.firebaseapp.com",
            projectId: "kctereg-online",
            storageBucket: "kctereg-online.firebasestorage.app",
            messagingSenderId: "308277595556",
            appId: "1:308277595556:web:1b1814886668eda0310531"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let currentUserRole = "";
        let excelExtractedData = [];

        window.login = () => {
            const u = document.getElementById('u').value.trim();
            const p = document.getElementById('p').value.trim();
            
            if(u === "Macalin114" && p === "kctepass") startSession("Teacher");
            else if(u === "D.head 5353" && p === "headpass") startSession("HOD");
            else if(u === "REG.12345" && p === "regpass") startSession("REG");
            else if((u === "dean12345" || u === "v.dean1") && p === "deanpass") startSession("Dean");
            else alert("Fadlan iska hubi ID-ga iyo Password-ka!");
        };

        function startSession(role) {
            currentUserRole = role;
            document.getElementById('login-div').classList.add('hidden');
            document.getElementById('nav-role').innerText = role + " Panel";
            document.getElementById('dash-main').classList.remove('hidden');
            if(role === 'Teacher') document.getElementById('teacher-ui').classList.remove('hidden');
            if(role === 'HOD') loadReports('PENDING_HOD');
            if(role === 'REG') loadReports('PENDING_REG');
            if(role === 'Dean') loadReports();
        }

        // --- EXCEL LOGIC (DEAD ACCURATE FOR KCTE) ---
        window.handleExcel = (e) => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = (evt) => {
                const data = evt.target.result;
                const workbook = XLSX.read(data, { type: 'binary' });
                const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1 });
                
                excelExtractedData = [];
                rows.forEach(row => {
                    const rowStr = row.join("").toUpperCase();
                    // Nidaamku wuxuu qabanayaa kaliya safafka leh SRLD
                    if(rowStr.includes("SRLD")) {
                        const sId = String(row.find(c => String(c).includes("/"))).replace(/\s+/g, '');
                        const sName = row[1] || row[2]; // Magacu badanaa waa Col 2
                        const sTotal = row[row.length - 2] || row[row.length - 3] || "0"; // Boqolkiiba (%)
                        const sGrade = row[row.length - 1]; // Grade-ka A,B,C..

                        if(sId && sName && sGrade) {
                            excelExtractedData.push({
                                id: sId.toUpperCase(),
                                name: String(sName).trim(),
                                mark: String(sTotal).trim(),
                                grade: String(sGrade).trim()
                            });
                        }
                    }
                });
                alert("Smart Link: Waa la aqriyey " + excelExtractedData.length + " Arday!");
            };
            reader.readAsBinaryString(file);
        };

        window.submitToCloud = async () => {
            const course = document.getElementById('course').value.trim();
            if(!course || excelExtractedData.length == 0) return alert("Geli Magaca Maadada iyo Excel-ka!");
            
            await addDoc(collection(db, "grades_master"), {
                instructor: "Macalin114",
                course: course,
                students: excelExtractedData,
                status: "PENDING_HOD",
                createdAt: new Date().getTime(),
                timeStr: new Date().toLocaleString()
            });
            alert("Xogta " + course + " waxaa loo diray Department Head!");
            location.reload();
        };

        function loadReports(filter) {
            const q = filter ? query(collection(db, "grades_master"), where("status", "==", filter)) : query(collection(db, "grades_master"));
            onSnapshot(q, (snap) => {
                let h = "";
                snap.forEach(docSnap => {
                    const data = docSnap.data();
                    let rowsHtml = "";
                    data.students.forEach(s => {
                        rowsHtml += `<tr class="border-b text-xs"><td class="p-2">${s.id}</td><td class="p-2 font-bold">${s.name}</td><td class="p-2">${s.mark}%</td><td class="p-2 text-blue-700 font-bold">${s.grade}</td></tr>`;
                    });

                    h += `
                    <div class="bg-white rounded-3xl shadow-2xl p-6 mb-8 border border-slate-100">
                        <div class="flex flex-col lg:flex-row justify-between mb-4 border-b pb-4">
                            <div>
                                <h2 class="text-2xl font-black text-indigo-950">${data.course.toUpperCase()}</h2>
                                <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">Gudbiye: ${data.instructor} | ${data.timeStr}</p>
                            </div>
                            <div class="flex gap-2 items-center">
                                ${(currentUserRole == 'HOD' && data.status == 'PENDING_HOD') ? `<button onclick="actDoc('${docSnap.id}', 'PENDING_REG')" class="bg-green-600 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-lg">Approve</button> <button onclick="rejectDoc('${docSnap.id}')" class="bg-red-500 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-lg">Reject</button>` : ''}
                                ${(currentUserRole == 'REG' && data.status == 'PENDING_REG') ? `<button onclick="actDoc('${docSnap.id}', 'APPROVED')" class="bg-indigo-950 text-white px-8 py-2 rounded-xl text-xs font-black uppercase italic underline">Final Approval</button>` : ''}
                                <span class="bg-yellow-50 px-2 py-1 text-[10px] rounded border font-bold uppercase">${data.status}</span>
                            </div>
                        </div>
                        <div class="max-h-60 overflow-y-auto">
                            <table class="w-full text-left text-sm border">
                                <thead class="bg-slate-50 sticky top-0"><tr><th class="p-2">ID NO.</th><th class="p-2">STUDENT NAME</th><th class="p-2">100% MARK</th><th class="p-2">GRADE</th></tr></thead>
                                <tbody>${rowsHtml}</tbody>
                            </table>
                        </div>
                    </div>`;
                });
                document.getElementById('report-list').innerHTML = h || "<p class='text-center py-20 italic text-gray-300'>Ma jiraan wax natiijo ah.</p>";
            });
        }

        window.actDoc = async (id, s) => { await updateDoc(doc(db, "grades_master", id), { status: s }); alert("Waa la oggolaaday: " + s); };
        window.rejectDoc = async (id) => { await deleteDoc(doc(db, "grades_master", id)); alert("Waa la diiday xogta!"); };

        // --- STUDENT NATIIJO NATIIJO ---
        window.searchResult = async () => {
            const idInput = document.getElementById('search-id').value.trim().toUpperCase().replace(/\s+/g, '');
            if(!idInput) return alert("Fadlan qor SRLD ID Number-kaaga!");
            
            const q = query(collection(db, "grades_master"), where("status", "==", "APPROVED"));
            const snapshot = await getDocs(q);
            let match = null;

            snapshot.forEach(doc => {
                match = doc.data().students.find(s => s.id === idInput);
                if(match) match.course = doc.data().course;
            });

            const resDiv = document.getElementById('result-area');
            if(match) {
                resDiv.innerHTML = `
                    <div class="mt-4 p-8 bg-white border-t-8 border-indigo-950 rounded-[2rem] shadow-2xl animate-fade-in text-center">
                        <p class="text-[10px] font-bold text-gray-400 uppercase mb-4 underline decoration-yellow-400">Kebridahar College Transcript</p>
                        <h2 class="text-3xl font-black text-indigo-950 uppercase italic leading-none">${match.name}</h2>
                        <p class="text-xs text-indigo-400 font-bold mt-2 italic underline uppercase">${match.course}</p>
                        <div class="grid grid-cols-2 gap-4 mt-8">
                             <div class="bg-gray-50 p-4 rounded-xl"> <span class="text-[9px] block uppercase font-bold text-gray-400 italic">Total 100%</span> <h2 class="text-3xl font-black">${match.mark}%</h2> </div>
                             <div class="bg-indigo-950 text-white p-4 rounded-xl shadow-xl shadow-indigo-100"> <span class="text-[9px] block uppercase font-bold italic text-indigo-300">Grade Letter</span> <h2 class="text-4xl font-black italic underline">${match.grade}</h2> </div>
                        </div>
                    </div>`;
            } else { resDiv.innerHTML = "<p class='mt-6 p-4 bg-red-100 text-red-600 rounded-xl font-bold uppercase text-[10px] italic'>ID-gan lama helin natiijo FINAL APPROVED ah. Fadlan iska hubi oggolaanshaha REG.12345.</p>"; }
        };
    </script>
</head>
<body class="bg-slate-100 font-sans tracking-tight text-slate-900">

    <nav class="bg-indigo-950 p-5 text-white flex justify-between items-center shadow-xl border-b-8 border-yellow-500 sticky top-0 z-[500]">
        <h1 class="text-xl font-black italic tracking-widest decoration-yellow-400 underline underline-offset-8">KCTE SYSTEM</h1>
        <div id="nav-role" class="text-[10px] font-bold text-yellow-500 bg-white/10 px-4 py-1 rounded-full uppercase tracking-tighter italic">Online Port</div>
        <button onclick="document.getElementById('st-modal').classList.remove('hidden')" class="bg-yellow-500 text-indigo-900 px-6 py-2 rounded-full font-black text-xs hover:bg-white uppercase italic tracking-tighter">Check Buundo</button>
    </nav>

    <!-- LOGIN -->
    <div id="login-div" class="max-w-sm mx-auto mt-20 bg-white p-12 rounded-[3.5rem] shadow-2xl border-t-8 border-indigo-950 text-center animate-fade-in">
        <h2 class="text-3xl font-black mb-10 text-indigo-950 tracking-tighter uppercase italic">Access Portal</h2>
        <div class="space-y-4">
            <input id="u" type="text" placeholder="Username (Macalin114..)" class="w-full bg-slate-50 border-2 p-4 rounded-2xl outline-none font-bold italic tracking-tighter focus:border-yellow-500">
            <input id="p" type="password" placeholder="••••••••" class="w-full bg-slate-50 border-2 p-4 rounded-2xl mb-4 text-center">
            <button onclick="login()" class="w-full bg-indigo-950 text-white py-5 rounded-2xl font-black text-xl hover:shadow-indigo-300 transition-all uppercase">Enter Portal</button>
        </div>
    </div>

    <!-- MAIN DASH -->
    <div id="dash-main" class="hidden container mx-auto p-10 animate-fade-in">
        
        <div id="teacher-ui" class="hidden">
            <div class="bg-white p-10 rounded-[3.5rem] shadow-2xl border-2 mb-12 text-center group transition-all">
                <h3 class="text-3xl font-black mb-8 italic uppercase tracking-tighter text-indigo-950 underline decoration-yellow-400 decoration-8 underline-offset-4">📤 Soo Geli Excel-ka Grade-ka</h3>
                <input id="course" type="text" placeholder="Geli Course Name (e.g. Somali 101)" class="w-full max-w-lg bg-gray-50 border-2 p-6 rounded-3xl mb-8 font-black text-2xl uppercase tracking-tighter shadow-inner outline-none focus:border-yellow-500">
                <div class="border-4 border-dashed rounded-[3rem] p-16 bg-slate-50 border-indigo-100 group-hover:bg-white">
                     <input type="file" onchange="handleExcel(event)" accept=".xlsx, .xls" class="mb-4">
                     <button onclick="submitToCloud()" class="w-full bg-indigo-950 text-white p-6 rounded-2xl font-black text-2xl hover:scale-[1.02] shadow-xl uppercase italic">U GURBI (SENT FOR REVIEW)</button>
                </div>
            </div>
        </div>

        <div id="report-list" class="max-w-4xl mx-auto"></div>
    </div>

    <!-- STUDENT CHECK NATIIJO -->
    <div id="st-modal" class="hidden fixed inset-0 bg-indigo-950/98 flex items-center justify-center p-8 z-[1000] backdrop-blur-2xl">
        <div class="bg-slate-100 p-12 rounded-[4.5rem] w-full max-w-lg shadow-[0_40px_100px_rgba(0,0,0,0.6)] border-t-[12px] border-yellow-500 relative text-center">
            <h2 class="text-4xl font-black text-indigo-950 leading-none mb-1 tracking-tighter uppercase italic underline decoration-indigo-950 decoration-4">Grade Result</h2>
            <p class="text-[9px] font-black text-slate-300 mb-10 tracking-[0.4em] italic uppercase leading-none">Kebridahar Teachers Education Center</p>
            <input id="search-id" type="text" placeholder="SRLD/140/15" class="w-full border-2 bg-white p-8 rounded-[3.5rem] text-4xl font-black text-center text-indigo-950 focus:border-yellow-500 shadow-inner mb-6 tracking-widest outline-none">
            <button onclick="searchResult()" class="w-full bg-indigo-950 text-white p-7 rounded-[3rem] font-black text-2xl shadow-xl hover:scale-105 active:scale-95 transition-all">CHECK BUUNDADAYDA</button>
            <div id="result-area" class="mt-4 min-h-[150px]"></div>
            <button onclick="document.getElementById('st-modal').classList.add('hidden')" class="mt-6 text-slate-300 font-bold uppercase text-[9px] underline decoration-gray-100 pb-2">Xir Xogta / Exit Portal</button>
        </div>
    </div>

</body>
</html>
