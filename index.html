<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KCTE OFFICIAL PORTAL v16</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, getDocs, updateDoc, doc, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDoMZETvL5-oYm5wiP2dcbLm1p6ZfsgvjE",
            authDomain: "kctereg-online.firebaseapp.com",
            projectId: "kctereg-online",
            storageBucket: "kctereg-online.firebasestorage.app",
            messagingSenderId: "308277595556",
            appId: "1:308277595556:web:1b1814886668eda0310531"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let activeRole = "";
        let teacherData = [];

        // Nadiifiyaha ID: Ka saar / space . iyo xarfaha si uu u noqdo 'Match' sax ah
        const cleanID = (id) => String(id).toUpperCase().replace(/[^A-Z0-9]/g, '').trim();

        // --- 1. STAFF LOGIN ---
        window.loginStaff = async () => {
            const u = document.getElementById('s-u').value.trim();
            const p = document.getElementById('s-p').value.trim();
            if(u === "Macalin114" && p === "kctepass") startPortal("Macalin");
            else if(u === "D.head 5353" && p === "headpass") startPortal("HOD");
            else if(u === "REG.12345" && p === "regpass") startPortal("REG");
            else if(u === "dean12345" && p === "deanpass") startPortal("Dean");
            else alert("Staff ID ama Password khalad ah!");
        };

        function startPortal(r) {
            activeRole = r;
            document.getElementById('search-home').classList.add('hidden');
            document.getElementById('login-modal').classList.add('hidden');
            document.getElementById('dash-ui').classList.remove('hidden');
            document.getElementById('role-txt').innerText = r;
            if(r === "Macalin") document.getElementById('teacher-zone').classList.remove('hidden');
            if(['HOD', 'REG', 'Dean'].includes(r)) loadAudit(r);
        }

        // --- 2. STUDENT SEARCH (Direct Action) ---
        window.searchMyResult = async () => {
            const sidInput = document.getElementById('st-id-input').value.trim();
            if(!sidInput) return alert("Fadlan qor ID SRLD lambarkaaga.");

            const targetID = cleanID(sidInput);
            const displayArea = document.getElementById('result-card');
            displayArea.innerHTML = "<p class='animate-pulse text-white font-bold uppercase'>Baarista Database-ka...</p>";

            const q = query(collection(db, "results_v16"), where("status", "==", "APPROVED"));
            const snapshot = await getDocs(q);
            let foundEntries = [];

            snapshot.forEach(dSnap => {
                const sheet = dSnap.data().students;
                const match = sheet.find(s => cleanID(s.sid) === targetID);
                if(match) foundEntries.push({ data: match, subject: dSnap.data().subject });
            });

            if(foundEntries.length > 0) {
                let html = "";
                foundEntries.forEach(res => {
                    html += `
                    <div class='mt-6 p-10 bg-white border-t-[12px] border-yellow-500 rounded-[3rem] shadow-2xl animate-fade-in text-center relative overflow-hidden'>
                        <p class='text-[10px] font-black uppercase text-indigo-950/40 tracking-[0.3em] mb-4'>KCTE OFFICIAL RECORD HUB</p>
                        <span class='text-[10px] block font-bold text-slate-300 uppercase tracking-tighter'>FullName</span>
                        <h2 class='text-4xl font-black text-indigo-950 uppercase italic leading-none mb-1'>${res.data.name}</h2>
                        <div class='mt-6 flex flex-col items-center border-b border-indigo-50 pb-4 mb-4'>
                            <p class='text-xs font-black text-indigo-700 uppercase italic'>DEPARTMENT: ${res.subject}</p>
                            <p class='text-xs font-bold text-gray-400 uppercase italic tracking-widest'>ID No: ${res.data.sid}</p>
                        </div>
                        <div class='grid grid-cols-2 gap-6'>
                            <div class='bg-gray-50 p-6 rounded-3xl shadow-inner border border-slate-100'> <span class='text-[9px] font-black opacity-30 uppercase'>Total (Tira)</span> <h1 class='text-5xl font-black text-indigo-900'>100/${res.data.mark}</h1> </div>
                            <div class='bg-indigo-950 text-white p-6 rounded-3xl border shadow-xl shadow-indigo-100'> <span class='text-[9px] font-black opacity-50 uppercase'>Grade (Xaraf)</span> <h1 class='text-7xl font-black italic decoration-yellow-500 underline underline-offset-8 decoration-8'>${res.data.grade}</h1> </div>
                        </div>
                    </div>`;
                });
                displayArea.innerHTML = html;
            } else {
                displayArea.innerHTML = `<p class='mt-10 p-6 bg-red-100 text-red-600 rounded-3xl font-black text-xs uppercase animate-shake italic'>ID-ga SRLD (${sidInput}) natiijadiisa laguma hayo liiska OGGOLAADAY (APPROVED). Xiriiri Registry-ga.</p>`;
            }
        };

        // --- 3. TEACHER LOGIC ---
        window.processPaste = (e) => {
            const raw = e.target.value.split("\n");
            teacherData = [];
            raw.forEach(r => {
                const c = r.split("\t");
                if(c.length >= 3){
                    let name = (c[1] || "").split("+")[0].split("=")[0].trim();
                    let id = (c[2] || "").trim();
                    let m = c.find(val => !isNaN(val) && val != "" && val.length >= 1) || "0";
                    let g = (c[c.length-1] || "F").toUpperCase().trim();
                    if(name && !name.toLowerCase().includes("name")) teacherData.push({name, sid:id, mark:m, grade:g});
                }
            });
            document.getElementById('log-txt').innerText = "Diyaar: " + teacherData.length + " Arday.";
        };

        window.submitToMaamulka = async () => {
            const sub = document.getElementById('s-title').value.trim();
            if(!sub || teacherData.length === 0) return alert("Subj name iyo Paste xog!");
            await addDoc(collection(db, "results_v16"), {
                subject: sub.toUpperCase(), instructor: "Macalin114",
                students: teacherData, status: "PENDING_HOD", date: new Date().toLocaleString()
            });
            alert("Sent to Hub!"); location.reload();
        };

        function loadAudit(role) {
            const q = role==='Dean' ? collection(db,"results_v16") : query(collection(db,"results_v16"), where("status","==",(role==='HOD'?'PENDING_HOD':'PENDING_REG')));
            onSnapshot(q, snap => {
                let html = "";
                snap.forEach(ds => {
                    const i = ds.data();
                    let stH = ""; i.students.forEach(s => stH += `<tr class='border-b'><td>${s.sid}</td><td>${s.name}</td><td>${s.mark}</td><td class="font-bold text-red-600">${s.grade}</td></tr>`);
                    html += `<div class='bg-white p-8 rounded-3xl shadow-xl mb-10 border-l-[20px] border-indigo-950'>
                        <div class='flex justify-between items-center border-b pb-4'>
                            <div><h3 class='font-black text-2xl'>${i.subject}</h3><p class='text-[10px] uppercase font-bold text-gray-400 italic'>Sub: Macalin114 | ${i.date}</p></div>
                            <div class='flex gap-2 h-fit'>
                                ${(role=='HOD'&&i.status=='PENDING_HOD') ? `<button onclick="actionSt('${ds.id}','PENDING_REG')" class='bg-green-600 text-white px-5 py-2 rounded-xl text-xs font-black shadow-lg shadow-green-100'>APPROVE HUB Hub</button>` : ""}
                                ${(role=='REG'&&i.status=='PENDING_REG') ? `<button onclick="actionSt('${ds.id}','APPROVED')" class='bg-indigo-950 text-white px-8 py-3 rounded-2xl text-[11px] font-black italic underline shadow-2xl'>REG FINAL APPROVE (ARKA-ARDAY)</button>` : ""}
                                <button onclick="deleteDocH('${ds.id}')" class='bg-red-400 text-white px-2 py-1 rounded text-xs uppercase'>Reject</button>
                                <span class='p-1 bg-yellow-50 text-[10px] font-bold text-yellow-600 uppercase border italic rounded'>${i.status}</span>
                            </div>
                        </div>
                        <details class="text-[9px] text-blue-500 font-bold uppercase mt-2 italic cursor-pointer"><summary>Preview Ardayda oo dhaman ▽</summary>
                             <table class='w-full mt-4 text-[9px] text-left border'><thead><tr><th>ID No</th><th>Name</th><th>Tira 100/X</th><th>Grade</th></tr></thead><tbody>${stH}</tbody></table>
                        </details>
                    </div>`;
                });
                document.getElementById('manager-list').innerHTML = html || "<p class='p-20 text-center italic opacity-30'>DATABASE MARXUUN</p>";
            });
        }
        window.actionSt = async(id, s) => { await updateDoc(doc(db,"results_v16",id),{status:s}); alert("Succes!"); };
        window.deleteDocH = async(id) => { if(confirm("Confirm Delete?")) await deleteDoc(doc(db,"results_v16",id)); };
    </script>
    <style> .animate-fade-in { animation: fIn 0.5s ease-out; } @keyframes fIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: 0; } } .animate-shake { animation: sK 0.3s; } @keyframes sK { 25%{transform:translateX(-8px);} 75%{transform:translateX(8px);} } </style>
</head>
<body class="bg-gray-200 font-sans tracking-tight text-indigo-950 italic overflow-x-hidden italic">

    <!-- SEARCH LANDING: KANI WAAYE BOGGA ARDAYDU TOOS UGALAYAAN -->
    <div id="search-home" class="container mx-auto p-8 lg:p-20 max-w-4xl text-center">
        <h1 class="text-7xl font-black text-indigo-950 leading-none mb-1 italic italic tracking-tighter">KCTE PORTAL</h1>
        <p class="text-[10px] font-black text-indigo-400 mb-12 uppercase tracking-[0.5em] italic underline decoration-yellow-400 decoration-8 underline-offset-8">Academic Self-Service Search Center</p>
        
        <div class="bg-indigo-900 p-12 lg:p-16 rounded-[4rem] shadow-[0_50px_100px_-20px_rgba(0,0,0,0.5)] border-t-[20px] border-yellow-500 text-center relative overflow-hidden italic italic">
             <div class="absolute -top-10 -right-10 w-40 h-40 bg-white/10 rounded-full blur-3xl opacity-50"></div>
             <h2 class="text-5xl font-black text-white leading-none italic mb-10 underline underline-offset-8">KaEEG Natiijada</h2>
             
             <div class="space-y-4 max-w-lg mx-auto">
                 <input id="st-id-input" placeholder="Enter SRLD ID (E.g SRLD/141/15)" class="w-full p-8 rounded-[4rem] bg-white text-5xl font-black text-center text-indigo-950 outline-none shadow-[0_0_50px_rgba(255,255,255,0.2)] focus:ring-8 focus:ring-yellow-400 transition uppercase tracking-widest placeholder:text-indigo-950/20 italic italic italic italic italic">
                 <button onclick="searchMyResult()" class="w-full bg-yellow-500 text-indigo-950 py-8 rounded-[4rem] font-black text-4xl shadow-xl hover:scale-105 active:scale-95 transition-all italic underline decoration-indigo-950 decoration-4 italic">CHECK BUUNDADAYDA ➜</button>
             </div>

             <div id="result-card" class="min-h-[250px]"></div>

             <div class="mt-24 border-t border-white/5 pt-12">
                  <button onclick="document.getElementById('login-modal').classList.remove('hidden')" class="text-white/20 hover:text-yellow-500 font-bold uppercase text-[9px] tracking-widest italic underline italic underline-offset-4 decoration-yellow-400">STAFF LOGIN: Macalin, HOD, Registry</button>
             </div>
        </div>
    </div>

    <!-- STAFF LOGIN POPUP (Hidden) -->
    <div id="login-modal" class="hidden fixed inset-0 bg-indigo-950 flex items-center justify-center p-8 z-[1000] italic italic italic italic italic">
        <div class="bg-white p-12 rounded-[4rem] w-full max-w-sm text-center shadow-2xl">
             <h2 class="text-4xl font-black text-indigo-950 mb-1 uppercase tracking-tighter">Enter Desk</h2>
             <p class="text-[9px] font-black text-gray-300 border-b pb-6 mb-8 uppercase tracking-[0.2em]">Management Identity Verification</p>
             <input id="s-u" placeholder="ID (Username)" class="w-full bg-slate-50 border p-5 rounded-3xl font-black text-indigo-900 uppercase italic tracking-widest mb-4 outline-none italic">
             <input id="s-p" type="password" placeholder="PASSWORD KEY" class="w-full bg-slate-50 border p-5 rounded-3xl font-black text-indigo-900 text-4xl text-center shadow-inner mb-10 outline-none">
             <button onclick="loginStaff()" class="w-full bg-indigo-950 text-white p-6 rounded-3xl font-black text-xl hover:bg-indigo-900 active:scale-95 transition-all italic underline decoration-yellow-500 underline-offset-4 underline shadow-lg italic italic">GAL PORTAL Hub Port Hub</button>
             <button onclick="location.reload()" class="mt-8 text-gray-300 text-xs font-black uppercase underline italic">Back Arday Home X</button>
        </div>
    </div>

    <!-- MAIN DASHBOARD CONTENT -->
    <div id="dash-ui" class="hidden p-8 lg:p-20 max-w-6xl mx-auto italic italic">
        <h2 id="role-txt" class="text-6xl font-black text-indigo-950 mb-16 uppercase underline underline-offset-4 decoration-yellow-400 decoration-[10px] tracking-tighter">PORTAL Dashboard</h2>
        
        <!-- MACALINKA -->
        <div id="teacher-zone" class="hidden animate-fade-in max-w-5xl italic italic italic">
            <div class="bg-white p-16 rounded-[6rem] shadow-2xl border border-indigo-50 text-center mb-20 italic">
                 <h2 class="text-4xl font-black text-indigo-950 underline decoration-indigo-200 decoration-8 underline-offset-8 uppercase mb-10 tracking-widest italic italic">Submit New Records</h2>
                 <input id="s-title" placeholder="Maadada (English, Somali..)" class="w-full p-8 border bg-gray-50 rounded-[2.5rem] font-black text-4xl text-center uppercase shadow-inner focus:border-indigo-900 mb-8 italic italic">
                 <textarea oninput="processPaste(event)" placeholder="Halkan Copy Paste (duuji) xogta dhabta ah ee Excel..." class="w-full h-40 p-8 border rounded-[3rem] bg-indigo-50/20 text-[9px] mb-6 italic tracking-[0.2em] outline-none shadow-inner"></textarea>
                 <p id="log-txt" class="font-black text-indigo-950 mb-12 uppercase text-lg"></p>
                 <button onclick="submitToMaamulka()" class="w-full bg-indigo-950 text-white p-8 rounded-[4.5rem] font-black text-4xl hover:scale-105 active:scale-95 shadow-xl transition underline underline-offset-4 decoration-yellow-400 decoration-4">Submit For Hubinta Audit HUB</button>
            </div>
        </div>

        <div id="manager-list"></div>
    </div>

</body>
</html>
