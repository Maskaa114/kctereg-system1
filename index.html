<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KCTE OFFICIAL PORTAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, getDocs, updateDoc, doc, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDoMZETvL5-oYm5wiP2dcbLm1p6ZfsgvjE",
            authDomain: "kctereg-online.firebaseapp.com",
            projectId: "kctereg-online",
            storageBucket: "kctereg-online.firebasestorage.app",
            messagingSenderId: "308277595556",
            appId: "1:308277595556:web:1b1814886668eda0310531"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let role = "";
        let parsedGrades = [];

        window.login = () => {
            const user = document.getElementById('user').value.trim();
            const pass = document.getElementById('pass').value.trim();
            if(user === "Macalin114" && pass === "kctepass") initDash('Teacher');
            else if(user === "D.head 5353" && pass === "headpass") initDash('HOD');
            else if(user === "REG.12345" && pass === "regpass") initDash('REG');
            else if(user === "dean12345" && pass === "deanpass") initDash('Dean');
            else alert("ID ama Password khalad ah!");
        };

        function initDash(r) {
            role = r;
            document.getElementById('login-div').classList.add('hidden');
            document.getElementById('main-div').classList.remove('hidden');
            document.getElementById('u-role').innerText = role + " Session";
            if(role === 'Teacher') document.getElementById('teacher-ui').classList.remove('hidden');
            if(role === 'HOD') loadAudits('PENDING_HOD');
            if(role === 'REG') loadAudits('PENDING_REG');
            if(role === 'Dean') loadAudits();
        }

        // SMART EXCEL SCANNER: Wax kasta ha ahaado Excel-kaagu, wuxuu raadinayaa xog kasta
        window.processFile = (e) => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                const workbook = XLSX.read(ev.target.result, {type: 'binary'});
                const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], {header: 1});
                parsedGrades = [];
                
                rows.forEach(row => {
                    const rowStr = row.join("").toUpperCase();
                    // Nidaamku wuxuu qabanaa saf kasta oo leh ID-ga KCTE
                    if(rowStr.includes("SRLD") || rowStr.includes("/")) {
                        parsedGrades.push({
                            id: String(row.find(c => String(c).toUpperCase().includes("/"))).replace(/\s/g, ''),
                            name: row[1] || row[2], // Magaca
                            totalMark: row[row.length - 2] || "0", // 100% Mark
                            grade: row[row.length - 1] || "N/A"    // A,B,C...
                        });
                    }
                });
                alert("Found " + parsedGrades.length + " Student Records!");
            };
            reader.readAsBinaryString(e.target.files[0]);
        };

        window.sendSub = async () => {
            const course = document.getElementById('course').value;
            if(!course || parsedGrades.length == 0) return alert("Course Name and File Required!");
            
            await addDoc(collection(db, "submissions"), {
                teacher: "Macalin114",
                course: course,
                students: parsedGrades,
                status: "PENDING_HOD",
                at: new Date().toLocaleString()
            });
            alert("Loo diray HOD-ka!"); location.reload();
        };

        function loadAudits(st) {
            const q = st ? query(collection(db, "submissions"), where("status", "==", st)) : collection(db, "submissions");
            onSnapshot(q, (snap) => {
                let h = "";
                snap.forEach(d => {
                    const data = d.data();
                    const high = Math.max(...data.students.map(s => parseFloat(s.totalMark) || 0));
                    const low = Math.min(...data.students.map(s => parseFloat(s.totalMark) || 0));
                    
                    h += `<div class="bg-white p-6 rounded-3xl shadow-xl mb-6 border-l-[12px] ${data.status=='APPROVED'?'border-green-500':'border-yellow-400'}">
                        <div class="flex justify-between items-start">
                            <div>
                                <h3 class="font-black text-blue-900 text-xl">${data.course.toUpperCase()}</h3>
                                <p class="text-[10px] text-gray-400 font-bold tracking-widest">Instructor: ${data.teacher} | ${data.at}</p>
                                <div class="mt-2 flex gap-4 text-[10px]">
                                    <span class="bg-indigo-100 px-2 rounded">Students: ${data.students.length}</span>
                                    <span class="bg-green-100 text-green-700 px-2 rounded">High Score: ${high}%</span>
                                    <span class="bg-red-100 text-red-700 px-2 rounded">Low Score: ${low}%</span>
                                </div>
                            </div>
                            <div class="space-x-1">
                                ${(role=='HOD' && data.status=='PENDING_HOD') ? `<button onclick="actDoc('${d.id}','PENDING_REG')" class="bg-green-600 text-white p-2 rounded-lg font-bold">Approve</button> <button onclick="actDoc('${d.id}','REJECTED')" class="bg-red-600 text-white p-2 rounded-lg font-bold">Reject</button>` : ''}
                                ${(role=='REG' && data.status=='PENDING_REG') ? `<button onclick="actDoc('${d.id}','APPROVED')" class="bg-indigo-900 text-white p-2 rounded-lg font-bold">FINAL APPROVE</button>` : ''}
                                <span class="p-2 text-xs font-black uppercase text-indigo-400">${data.status}</span>
                            </div>
                        </div>
                    </div>`;
                });
                document.getElementById('list-data').innerHTML = h || "Majiraan xog xiligaan.";
            });
        }

        window.actDoc = async (id, s) => { await updateDoc(doc(db, "submissions", id), { status: s }); alert("Success!"); };

        // STUDENT CHECK NATIIJO
        window.studentCheck = async () => {
            const inputId = document.getElementById('st-id').value.trim().toUpperCase().replace(/\s+/g, '');
            const rDiv = document.getElementById('st-res');
            rDiv.innerHTML = "Processing...";
            const snap = await getDocs(query(collection(db, "submissions"), where("status", "==", "APPROVED")));
            let match = null; let matchDoc = null;
            snap.forEach(d => { 
                let m = d.data().students.find(s => s.id.toUpperCase().replace(/\s+/g, '') === inputId);
                if(m) { match = m; matchDoc = d.data(); }
            });

            if(match) {
                rDiv.innerHTML = `
                    <div class="mt-4 p-8 bg-white border-t-8 border-indigo-950 rounded-3xl shadow-2xl text-center">
                        <p class="text-[9px] font-bold text-gray-400 tracking-[0.3em] uppercase underline decoration-yellow-500 underline-offset-4">Academic Natiijo Report</p>
                        <h2 class="text-3xl font-black mt-2 text-indigo-950">${match.name}</h2>
                        <p class="text-xs text-slate-500 font-bold mb-6">${matchDoc.course} - ${matchDoc.teacher}</p>
                        <div class="grid grid-cols-2 gap-4">
                            <div class="bg-slate-50 p-4 rounded-2xl border-2"> <span class="block text-[8px] font-bold">TOTAL MARK</span> <h1 class="text-3xl font-black text-indigo-900">${match.totalMark}%</h1> </div>
                            <div class="bg-indigo-950 p-4 rounded-2xl border-2 text-white"> <span class="block text-[8px] font-bold">GRADE</span> <h1 class="text-3xl font-black">${match.grade}</h1> </div>
                        </div>
                    </div>`;
            } else { rDiv.innerHTML = "<p class='mt-4 p-4 bg-red-100 text-red-600 rounded-xl text-xs font-bold'>Wali lama soo gelin xogtaada ama oggolaansho kama helin Registry.</p>"; }
        };
    </script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900 font-sans tracking-tighter">
    
    <nav class="bg-indigo-950 p-6 text-white border-b-8 border-yellow-500 shadow-xl flex justify-between items-center sticky top-0 z-[100]">
        <h1 class="font-black text-2xl tracking-tighter uppercase italic">KCTE <span class="bg-white text-indigo-900 px-2 rounded">GRADES</span></h1>
        <button onclick="document.getElementById('st-mod').classList.remove('hidden')" class="bg-yellow-500 text-indigo-950 px-8 py-2 rounded-full font-black text-xs hover:bg-white transition-all uppercase italic">Ardayda Search</button>
    </nav>

    <!-- LOGIN UI -->
    <div id="login-div" class="max-w-md mx-auto mt-20 p-10 bg-white rounded-[3rem] shadow-2xl border border-slate-100 text-center animate-fade-in">
        <h2 class="text-3xl font-black mb-8 uppercase text-indigo-950 italic">Gashidka Maamulka</h2>
        <input id="user" type="text" placeholder="Magaca" class="w-full border-2 p-5 rounded-2xl mb-4 focus:border-yellow-500 outline-none">
        <input id="pass" type="password" placeholder="Password-ka" class="w-full border-2 p-5 rounded-2xl mb-8 focus:border-yellow-500 outline-none">
        <button onclick="login()" class="w-full bg-indigo-950 text-white p-5 rounded-3xl font-black text-xl hover:shadow-indigo-100 shadow-lg transition-all uppercase italic active:scale-95">GAL DASHBOARD-KA</button>
        <p id="u-role" class="mt-4 text-[9px] text-slate-400 font-black"></p>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="main-div" class="hidden p-10 max-w-6xl mx-auto">
        
        <!-- TEACHER VIEW -->
        <div id="teacher-ui" class="hidden bg-white p-12 rounded-[4rem] border-2 shadow-2xl border-indigo-50 mb-10 text-center">
            <h2 class="text-3xl font-black text-indigo-950 mb-10 uppercase italic underline decoration-yellow-400">📤 SOO GUDBI NATIIJADA CUSUB</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8">
                <input id="course" type="text" placeholder="Geli Course Name (e.g English 101)" class="p-6 border-2 border-indigo-50 rounded-3xl font-bold uppercase tracking-tighter shadow-inner text-xl">
                <div class="p-6 border-2 border-indigo-50 rounded-3xl flex items-center bg-indigo-50">
                   <input type="file" onchange="processFile(event)" accept=".xlsx, .xls" class="text-xs file:bg-indigo-950 file:text-white file:rounded-full file:px-4 file:py-1">
                </div>
            </div>
            <button onclick="sendSub()" class="bg-indigo-950 text-white px-20 py-6 rounded-3xl font-black text-2xl hover:scale-105 active:scale-95 shadow-2xl transition-all uppercase italic shadow-indigo-100">Send for Audit</button>
        </div>

        <!-- LIST SECTION (AUDIT/STATS) -->
        <div id="list-data"></div>
    </div>

    <!-- STUDENT MODAL -->
    <div id="st-mod" class="hidden fixed inset-0 bg-indigo-950/95 flex items-center justify-center p-8 z-[200] backdrop-blur-xl animate-fade-in">
        <div class="bg-slate-100 p-12 rounded-[4rem] w-full max-w-md shadow-2xl border-t-[10px] border-yellow-500">
             <h2 class="font-black text-3xl text-indigo-950 mb-2 uppercase leading-none">CHECK RESULT</h2>
             <p class="text-[9px] text-slate-400 font-bold mb-10 tracking-[0.2em] italic uppercase border-b pb-4">STUDENT ACADEMIC PORTAL</p>
             <input id="st-id" type="text" placeholder="E.g SRLD/140/15" class="w-full bg-white border-2 border-slate-100 p-6 rounded-[2.5rem] font-black text-3xl text-center outline-none focus:border-yellow-500 uppercase tracking-tighter">
             <button onclick="studentCheck()" class="mt-4 w-full bg-indigo-950 text-white p-6 rounded-[2.5rem] font-black text-2xl hover:bg-yellow-500 hover:text-indigo-950 transition-all shadow-xl active:scale-95 uppercase">KA BAADI NATIIJADA</button>
             <div id="st-res"></div>
             <button onclick="document.getElementById('st-mod').classList.add('hidden')" class="mt-8 text-gray-300 font-black text-[9px] tracking-widest hover:text-red-600 transition-colors uppercase border-b border-gray-100 pb-1">Exit X Search</button>
        </div>
    </div>

</body>
</html>
