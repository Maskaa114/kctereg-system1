<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KCTE PORTAL - FIXED</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, getDocs, updateDoc, doc, onSnapshot, deleteDoc, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDoMZETvL5-oYm5wiP2dcbLm1p6ZfsgvjE",
            authDomain: "kctereg-online.firebaseapp.com",
            projectId: "kctereg-online",
            storageBucket: "kctereg-online.firebasestorage.app",
            messagingSenderId: "308277595556",
            appId: "1:308277595556:web:1b1814886668eda0310531"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let currentRole = "";
        let teacherGrades = [];

        window.login = () => {
            const user = document.getElementById('user').value.trim();
            const pass = document.getElementById('pass').value.trim();
            if(user === "Macalin114" && pass === "kctepass") initUI('Teacher');
            else if(user === "D.head 5353" && pass === "headpass") initUI('HOD');
            else if(user === "REG.12345" && pass === "regpass") initUI('REG');
            else if(user === "dean12345" && pass === "deanpass") initUI('Dean');
            else alert("Username/Password khalad!");
        };

        function initUI(r) {
            currentRole = r;
            document.getElementById('login-box').classList.add('hidden');
            document.getElementById('dash-ui').classList.remove('hidden');
            document.getElementById('nav-role').innerText = r;
            if(r === 'Teacher') { document.getElementById('teacher-ui').classList.remove('hidden'); loadMyHistory(); }
            if(r === 'HOD') loadAudits('PENDING_HOD');
            if(r === 'REG') loadAudits('PENDING_REG');
            if(r === 'Dean') loadAudits();
        }

        // --- SMART & SAFE EXCEL PARSER ---
        window.processExcel = (e) => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                const workbook = XLSX.read(ev.target.result, {type: 'binary'});
                const sheet = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], {header: 1});
                teacherGrades = [];
                sheet.forEach(row => {
                    const rowText = row.join("|").toUpperCase();
                    if(rowText.includes("SRLD") || rowText.includes("/")) {
                        // Hubi in xog kasta ay jirto (No undefined allowed)
                        const rawId = row.find(c => String(c).includes("/")) || "No-ID";
                        const rawName = row[1] || row[2] || "Unknown Name";
                        const rawTotal = row[row.length - 2] || "0";
                        const rawGrade = row[row.length - 1] || "N/A";

                        teacherGrades.push({
                            id: String(rawId).replace(/\s+/g, '').toUpperCase(),
                            name: String(rawName).trim(),
                            total: String(rawTotal).trim(),
                            grade: String(rawGrade).trim()
                        });
                    }
                });
                alert("Natiijo: " + teacherGrades.length + " Arday ayaa la diyaariyey!");
            };
            reader.readAsBinaryString(e.target.files[0]);
        };

        window.sendSub = async () => {
            const courseInput = document.getElementById('course').value.trim() || "Cusub";
            if(teacherGrades.length == 0) return alert("Fadlan kow soo xulo Excel File-ka!");

            const btn = document.getElementById('send-btn');
            btn.innerText = "Gudbin baa socota...";
            btn.disabled = true;

            try {
                // Halkan waxaan ku gureynaa xogta annagoo iska jirna undefined
                await addDoc(collection(db, "grades_list"), {
                    instructor: "Macalin114",
                    course: String(courseInput),
                    students: teacherGrades,
                    status: "PENDING_HOD",
                    timestamp: Number(new Date().getTime()),
                    dateStr: String(new Date().toLocaleString())
                });
                alert("GUUL: Natiijada waa la gudbiyey!");
                location.reload();
            } catch (err) {
                console.error("Firebase Error:", err);
                alert("KHALAD: Firestore rules-ka furi ama xogta ayaa dhiman.");
                btn.innerText = "SEND FOR AUDIT";
                btn.disabled = false;
            }
        };

        function loadMyHistory() {
            const q = query(collection(db, "grades_list"), where("instructor", "==", "Macalin114"), orderBy("timestamp", "desc"));
            onSnapshot(q, (snap) => {
                let h = "";
                snap.forEach(d => {
                    const item = d.data();
                    h += `<div class="p-4 border mb-2 rounded bg-gray-50 flex justify-between">
                            <span class="font-bold">${item.course}</span>
                            <span class="px-2 py-1 bg-yellow-400 text-xs font-black rounded uppercase">${item.status}</span>
                         </div>`;
                });
                document.getElementById('teacher-history').innerHTML = h;
            });
        }

        function loadAudits(st) {
            const q = st ? query(collection(db, "grades_list"), where("status", "==", st)) : query(collection(db, "grades_list"));
            onSnapshot(q, (snap) => {
                let h = "";
                snap.forEach(d => {
                    const data = d.data();
                    h += `<div class="bg-white p-6 rounded-3xl shadow-xl mb-4 border-l-[10px] border-indigo-900">
                            <h3 class="font-black text-indigo-950 text-xl underline">${data.course}</h3>
                            <p class="text-[10px] font-bold text-gray-400">By ${data.instructor} | ${data.dateStr}</p>
                            <div class="mt-4 flex gap-2">
                                ${(currentRole=='HOD' && data.status=='PENDING_HOD') ? `<button onclick="updateSt('${d.id}', 'PENDING_REG')" class="bg-green-600 text-white px-4 py-1 rounded-lg text-xs font-bold shadow">APPROVE</button>` : ''}
                                ${(currentRole=='REG' && data.status=='PENDING_REG') ? `<button onclick="updateSt('${d.id}', 'APPROVED')" class="bg-indigo-950 text-white px-4 py-1 rounded-lg text-xs font-bold shadow uppercase tracking-widest">Final Approve</button>` : ''}
                                <span class="ml-auto font-black text-xs text-indigo-200 tracking-widest">${data.status}</span>
                            </div>
                         </div>`;
                });
                document.getElementById('audit-list').innerHTML = h;
            });
        }

        window.updateSt = async (id, s) => { await updateDoc(doc(db, "grades_list", id), { status: s }); alert("Update: " + s); };

        window.studentCheck = async () => {
            const idInput = document.getElementById('search-id').value.trim().toUpperCase().replace(/\s+/g, '');
            const resBox = document.getElementById('st-res');
            const q = query(collection(db, "grades_list"), where("status", "==", "APPROVED"));
            const snap = await getDocs(q);
            let matched = null;
            snap.forEach(d => { 
                let m = d.data().students.find(s => s.id === idInput);
                if(m) matched = {info: m, meta: d.data()};
            });

            if(matched) {
                resBox.innerHTML = `<div class="p-6 bg-white border-t-8 border-indigo-950 rounded-2xl shadow-xl mt-4">
                    <p class="text-[9px] font-bold text-indigo-300 uppercase underline decoration-yellow-400">Student Transcript</p>
                    <h2 class="text-3xl font-black text-indigo-950 mt-1 uppercase leading-none">${matched.info.name}</h2>
                    <p class="text-xs text-gray-400 mb-6 italic underline">${matched.meta.course} Instructor: ${matched.meta.instructor}</p>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-gray-100 p-4 rounded-xl border"><span class="text-[9px] block">Total CA</span> <span class="text-3xl font-black">${matched.info.total}%</span></div>
                        <div class="bg-indigo-950 text-white p-4 rounded-xl shadow-lg border border-indigo-400"><span class="text-[9px] block italic text-indigo-400">FINAL GRADE</span> <span class="text-4xl font-black italic underline">${matched.info.grade}</span></div>
                    </div>
                </div>`;
            } else { resBox.innerHTML = "<p class='mt-4 p-4 bg-red-100 text-red-700 text-xs font-black'>Lama helin natiijo APPROVED ah.</p>"; }
        };
    </script>
</head>
<body class="bg-gray-100 min-h-screen">

    <nav class="bg-indigo-950 p-5 text-white flex justify-between items-center shadow-2xl border-b-8 border-yellow-500">
        <h1 class="text-xl font-black italic flex items-center gap-2 tracking-tighter decoration-yellow-400 underline underline-offset-4 decoration-2">KCTE <span class="bg-white text-indigo-900 px-2 rounded-md">PORTAL</span></h1>
        <div id="nav-role" class="text-[10px] font-black uppercase italic text-yellow-400 bg-indigo-900/50 px-4 py-1 rounded-full border">GATEWAY</div>
        <button onclick="document.getElementById('modal').classList.remove('hidden')" class="bg-yellow-500 text-indigo-900 px-6 py-1.5 rounded-full font-black text-[11px] hover:bg-white uppercase tracking-tighter italic">Natiijo Raadi</button>
    </nav>

    <!-- LOGIN -->
    <div id="login-box" class="max-w-md mx-auto mt-20 p-10 bg-white rounded-[3rem] shadow-2xl text-center border-t-8 border-indigo-950">
        <h2 class="text-3xl font-black mb-8 uppercase text-indigo-950 tracking-tighter">Login Panel</h2>
        <input id="user" type="text" placeholder="Username" class="w-full bg-gray-50 border-2 p-5 rounded-2xl mb-4 font-bold outline-none focus:border-yellow-500">
        <input id="pass" type="password" placeholder="Password" class="w-full bg-gray-50 border-2 p-5 rounded-2xl mb-8 outline-none focus:border-yellow-500">
        <button onclick="login()" class="w-full bg-indigo-950 text-white py-5 rounded-3xl font-black text-xl hover:scale-105 active:scale-95 shadow-xl transition-all">SIGN IN</button>
    </div>

    <!-- DASHBOARD UI -->
    <div id="dash-ui" class="hidden p-8 lg:p-16 max-w-6xl mx-auto">
        <div id="teacher-ui" class="hidden">
            <div class="bg-white p-10 rounded-[3.5rem] shadow-2xl border-2 mb-10 text-center relative overflow-hidden">
                <h3 class="text-3xl font-black text-indigo-950 mb-10 uppercase italic">📤 GUDBI NATIIJO CUSUB</h3>
                <input id="course" type="text" placeholder="Geli Course Magaciis" class="w-full border-2 p-6 rounded-[2rem] font-black text-2xl uppercase tracking-widest text-indigo-950 bg-slate-50 mb-8 outline-none">
                <div class="p-16 border-4 border-dashed rounded-[3rem] border-indigo-100 bg-indigo-50/50 group">
                    <input type="file" onchange="processExcel(event)" accept=".xlsx, .xls" class="mb-4 text-xs">
                    <button id="send-btn" onclick="sendSub()" class="w-full bg-indigo-950 text-white p-6 rounded-3xl font-black text-2xl hover:bg-yellow-500 hover:text-indigo-900 transition-all active:scale-95 uppercase italic shadow-xl">DIRAAYAA (SEND TO HOD)</button>
                </div>
            </div>
            <div id="teacher-history" class="max-w-md mx-auto p-4 italic text-gray-400"></div>
        </div>
        <div id="audit-list" class="max-w-3xl mx-auto"></div>
    </div>

    <!-- STUDENT MODAL -->
    <div id="modal" class="hidden fixed inset-0 bg-indigo-950/95 flex items-center justify-center p-6 z-[300] backdrop-blur-xl animate-fade-in">
        <div class="bg-white p-12 rounded-[3.5rem] w-full max-w-lg shadow-[0_35px_60px_-15px_rgba(0,0,0,0.5)] border-t-[15px] border-yellow-500 text-center">
            <h2 class="text-4xl font-black text-indigo-950 uppercase italic leading-none">ResultRaadi</h2>
            <p class="text-[9px] font-black text-slate-300 mb-10 uppercase tracking-widest">KCTE Official Search Gateway</p>
            <input id="search-id" type="text" placeholder="ID E.g SRLD/140/15" class="w-full border-2 bg-gray-50 p-6 rounded-[3rem] text-4xl font-black text-center text-indigo-950 focus:border-yellow-500 shadow-inner outline-none">
            <button onclick="studentCheck()" class="mt-4 w-full bg-indigo-950 text-white p-6 rounded-[3rem] font-black text-2xl hover:scale-105 transition-all shadow-xl shadow-indigo-200">HEEG NATIIJO</button>
            <div id="st-res"></div>
            <button onclick="document.getElementById('modal').classList.add('hidden')" class="mt-8 text-gray-300 font-bold uppercase text-[9px] tracking-widest hover:text-red-500 underline decoration-2 decoration-gray-100 pb-1 italic transition-colors">Xir/Close Result View</button>
        </div>
    </div>

</body>
</html>
