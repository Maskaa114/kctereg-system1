<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KCTE OFFICIAL PORTAL v5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, getDocs, updateDoc, doc, onSnapshot, deleteDoc, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDoMZETvL5-oYm5wiP2dcbLm1p6ZfsgvjE",
            authDomain: "kctereg-online.firebaseapp.com",
            projectId: "kctereg-online",
            storageBucket: "kctereg-online.firebasestorage.app",
            messagingSenderId: "308277595556",
            appId: "1:308277595556:web:1b1814886668eda0310531"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let currentRole = "";
        let teacherGrades = [];

        window.login = () => {
            const user = document.getElementById('user').value.trim();
            const pass = document.getElementById('pass').value.trim();
            if(user === "Macalin114" && pass === "kctepass") initUI('Teacher');
            else if(user === "D.head 5353" && pass === "headpass") initUI('HOD');
            else if(user === "REG.12345" && pass === "regpass") initUI('REG');
            else if(user === "dean12345" && pass === "deanpass") initUI('Dean');
            else alert("ID ama Password khalad ah!");
        };

        function initUI(r) {
            currentRole = r;
            document.getElementById('login-box').classList.add('hidden');
            document.getElementById('dash-ui').classList.remove('hidden');
            document.getElementById('nav-role').innerText = r + " Account";
            
            if(r === 'Teacher') {
                document.getElementById('teacher-ui').classList.remove('hidden');
                loadMyHistory(); // Macalinku inuu arko xogtiisa uu diray
            }
            if(r === 'HOD') loadAudits('PENDING_HOD');
            if(r === 'REG') loadAudits('PENDING_REG');
            if(r === 'Dean') loadAudits();
        }

        window.processExcel = (e) => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                const workbook = XLSX.read(ev.target.result, {type: 'binary'});
                const sheet = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], {header: 1});
                teacherGrades = [];
                sheet.forEach(row => {
                    const str = row.join("").toUpperCase();
                    if(str.includes("SRLD") || str.includes("/")) {
                        teacherGrades.push({
                            id: String(row.find(c => String(c).includes("/"))).replace(/\s/g, '').toUpperCase(),
                            name: row[1] || row[2],
                            total: row[row.length - 2] || "0",
                            grade: row[row.length - 1] || "N/A"
                        });
                    }
                });
                alert("Natiijo: " + teacherGrades.length + " Arday ayaa Excel-ka laga soo dhex saaray.");
            };
            reader.readAsBinaryString(e.target.files[0]);
        };

        window.sendSub = async () => {
            const course = document.getElementById('course').value.trim();
            if(!course || teacherGrades.length == 0) return alert("Course-ka iyo Excel-ka ayaa loo baahan yahay!");
            
            document.getElementById('send-btn').innerText = "Diris baa socota...";
            document.getElementById('send-btn').disabled = true;

            try {
                await addDoc(collection(db, "grades_list"), {
                    instructor: "Macalin114",
                    course: course,
                    students: teacherGrades,
                    status: "PENDING_HOD",
                    timestamp: new Date().getTime(),
                    dateStr: new Date().toLocaleString()
                });
                alert("GUUL: Buundooyinka EPSY waxaa loo gudbiyey Department Head-ka!");
                location.reload();
            } catch (err) {
                alert("KHALAD: Firestore Rules ayaa u baahan in lagu furo Test Mode. " + err.message);
                document.getElementById('send-btn').innerText = "SEND FOR AUDIT";
                document.getElementById('send-btn').disabled = false;
            }
        };

        // Macalinku inuu arko xogta uu horey u diray
        function loadMyHistory() {
            const q = query(collection(db, "grades_list"), where("instructor", "==", "Macalin114"), orderBy("timestamp", "desc"));
            onSnapshot(q, (snap) => {
                let h = "";
                snap.forEach(d => {
                    const item = d.data();
                    h += `<div class="bg-gray-50 p-4 border rounded-xl mb-3 flex justify-between">
                            <div><span class="font-bold">${item.course}</span> - ${item.dateStr}</div>
                            <div class="text-xs px-3 py-1 rounded-full ${item.status=='APPROVED'?'bg-green-500 text-white':'bg-yellow-400 font-bold'}">${item.status}</div>
                          </div>`;
                });
                document.getElementById('teacher-history').innerHTML = h || "<p class='text-gray-400 text-center'>Wali xog ma aadan dirin.</p>";
            });
        }

        function loadAudits(st) {
            const q = st ? query(collection(db, "grades_list"), where("status", "==", st)) : query(collection(db, "grades_list"));
            onSnapshot(q, (snap) => {
                let h = "";
                snap.forEach(d => {
                    const data = d.data();
                    h += `<div class="bg-white p-6 rounded-3xl shadow-xl mb-6 border-l-[12px] border-indigo-900">
                        <div class="flex justify-between items-start">
                            <div>
                                <h3 class="font-black text-xl text-blue-900">${data.course.toUpperCase()}</h3>
                                <p class="text-xs text-gray-400 uppercase tracking-tighter">Instructor: ${data.instructor} | Sent: ${data.dateStr}</p>
                                <p class="mt-2 text-xs font-bold text-yellow-600 bg-yellow-50 px-2 rounded inline-block">Ardayda: ${data.students.length} | Status: ${data.status}</p>
                            </div>
                            <div class="space-x-1">
                                ${(currentRole=='HOD' && data.status=='PENDING_HOD') ? `<button onclick="updateSt('${d.id}','PENDING_REG')" class="bg-green-600 text-white px-4 py-2 rounded-xl font-bold hover:bg-green-700">GUDUBI (REG HEAD)</button>` : ''}
                                ${(currentRole=='REG' && data.status=='PENDING_REG') ? `<button onclick="updateSt('${d.id}','APPROVED')" class="bg-blue-800 text-white px-4 py-2 rounded-xl font-bold uppercase italic shadow-lg">APPROVE NATIIJO</button>` : ''}
                            </div>
                        </div>
                    </div>`;
                });
                document.getElementById('audit-list').innerHTML = h || "<p class='text-center py-20 text-gray-300 italic uppercase'>Hadda ma jiraan buundooyin la oggolaanayo...</p>";
            });
        }

        window.updateSt = async (id, s) => { 
            await updateDoc(doc(db, "grades_list", id), { status: s }); 
            alert("Tallaabada soo socota: " + s); 
        };

        // STUDENT NATIIJO NATIIJO
        window.studentCheck = async () => {
            const idInput = document.getElementById('search-id').value.trim().toUpperCase().replace(/\s+/g, '');
            if(!idInput) return alert("ID-ga SRLD qor!");
            const display = document.getElementById('st-res');
            display.innerHTML = "Check gareynaya...";

            const q = query(collection(db, "grades_list"), where("status", "==", "APPROVED"));
            const snapshot = await getDocs(q);
            let matchFound = null;

            snapshot.forEach(doc => {
                let sMatch = doc.data().students.find(s => s.id === idInput);
                if(sMatch) matchFound = { info: sMatch, details: doc.data() };
            });

            if(matchFound) {
                display.innerHTML = `
                    <div class="mt-4 p-8 bg-white border-t-[10px] border-indigo-900 rounded-3xl shadow-2xl animate-bounce">
                        <p class="text-[9px] font-black text-indigo-400 uppercase tracking-widest mb-4 italic underline decoration-yellow-400">Official College Transcript</p>
                        <h2 class="text-4xl font-black text-indigo-950 uppercase italic leading-none mb-4">${matchFound.info.name}</h2>
                        <div class="grid grid-cols-2 gap-4 border-t pt-6">
                            <div class="text-left bg-slate-50 p-4 rounded-xl"> <span class="block text-[8px] font-bold text-gray-400 uppercase">Subject Marks</span> <span class="text-3xl font-black">${matchFound.info.total}%</span> </div>
                            <div class="text-left bg-indigo-950 text-white p-4 rounded-xl"> <span class="block text-[8px] font-bold uppercase">Final Grade</span> <span class="text-4xl font-black italic underline">${matchFound.info.grade}</span> </div>
                        </div>
                    </div>`;
            } else { display.innerHTML = "<p class='mt-4 p-6 bg-red-100 text-red-600 font-bold rounded-2xl'>Natiijadaadu wali ma soo bixin (Waa Pending) ama ID-ga ayaa khalad ah.</p>"; }
        };
    </script>
</head>
<body class="bg-slate-50 font-sans tracking-tight">

    <!-- NAVBAR -->
    <nav class="bg-indigo-950 p-6 flex justify-between items-center text-white border-b-8 border-yellow-500 shadow-xl sticky top-0 z-[200]">
        <h1 class="text-2xl font-black tracking-tighter uppercase italic flex items-center gap-2">KCTE <span class="bg-white text-indigo-900 px-2 rounded-lg italic text-sm">ONLINE</span></h1>
        <div id="nav-role" class="text-[10px] bg-indigo-900/50 px-4 py-1 rounded-full border border-indigo-100 uppercase tracking-widest italic font-bold">Wali lama galin</div>
        <button onclick="document.getElementById('modal').classList.remove('hidden')" class="bg-yellow-500 text-indigo-950 px-6 py-2 rounded-full font-black text-xs uppercase shadow-xl hover:bg-white transition-all">Hubi Natiijo</button>
    </nav>

    <!-- LOGIN BOX -->
    <div id="login-box" class="max-w-md mx-auto mt-20 p-12 bg-white rounded-[3.5rem] shadow-2xl border border-slate-100 text-center animate-fade-in">
        <h2 class="text-4xl font-black text-indigo-950 mb-10 tracking-tighter uppercase">PORTAL GATEWAY</h2>
        <div class="space-y-4">
            <input id="user" type="text" placeholder="Isticmaalaha Staff-ka" class="w-full bg-slate-50 border-2 border-indigo-50 p-5 rounded-2xl outline-none focus:border-yellow-500 font-bold uppercase tracking-widest text-sm italic">
            <input id="pass" type="password" placeholder="Furaha Sirta" class="w-full bg-slate-50 border-2 border-indigo-50 p-5 rounded-2xl outline-none focus:border-yellow-500">
            <button onclick="login()" class="w-full bg-indigo-950 text-white p-5 rounded-3xl font-black text-2xl hover:bg-indigo-900 active:scale-95 shadow-xl transition-all italic tracking-tighter">GAL DASHBOARD-KA</button>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="dash-ui" class="hidden p-8 lg:p-16 max-w-7xl mx-auto">
        <h2 id="dash-title" class="text-5xl font-black text-indigo-950 mb-12 border-l-[12px] border-yellow-500 pl-6 uppercase tracking-tighter">DASHBOARD</h2>
        
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-16">
            <!-- TEACHER SECTION -->
            <div id="teacher-ui" class="hidden">
                <div class="bg-white p-12 rounded-[4rem] shadow-2xl border-2 border-slate-50 mb-10 text-center group">
                    <h3 class="text-2xl font-black text-indigo-950 mb-10 italic border-b pb-4">GUDBI BUUNDADA</h3>
                    <input id="course" type="text" placeholder="Course Name (e.g. EPSY 261)" class="w-full bg-slate-50 border-2 border-indigo-50 p-6 rounded-3xl mb-8 font-black uppercase text-2xl text-indigo-900 outline-none focus:border-yellow-500 shadow-inner">
                    <div class="bg-indigo-50 border-4 border-dashed rounded-[3rem] p-16 group-hover:bg-white transition-all border-indigo-200">
                         <input type="file" onchange="processExcel(event)" accept=".xlsx, .xls" class="mb-4 text-xs">
                         <button id="send-btn" onclick="sendSub()" class="w-full bg-indigo-950 text-white p-6 rounded-[2.5rem] font-black text-2xl shadow-xl hover:bg-yellow-500 hover:text-indigo-950 active:scale-95 transition-all uppercase tracking-tighter italic">GUDUBI (HOD HEAD)</button>
                    </div>
                </div>
                <div class="p-8">
                    <h4 class="font-black text-indigo-400 mb-6 uppercase tracking-widest text-[10px] border-l-4 border-indigo-200 pl-4 italic">Recent Upload History</h4>
                    <div id="teacher-history"></div>
                </div>
            </div>

            <!-- AUDIT VIEW (FOR ALL STAFF) -->
            <div class="w-full max-w-2xl">
                 <h3 class="text-xs text-gray-300 font-black mb-10 tracking-[0.3em] uppercase italic border-l-4 border-yellow-500 pl-6 italic">Audit & Oggolaansho Workflow</h3>
                 <div id="audit-list"></div>
            </div>
        </div>
    </div>

    <!-- MODAL STUDENT NATIIJO -->
    <div id="modal" class="hidden fixed inset-0 bg-indigo-950/95 flex items-center justify-center p-8 z-[300] backdrop-blur-2xl">
        <div class="bg-slate-50 p-16 rounded-[4rem] shadow-[0_50px_100px_rgba(0,0,0,0.5)] w-full max-w-lg border-t-[15px] border-yellow-500 relative">
             <h2 class="text-4xl font-black text-indigo-950 leading-none mb-1 italic tracking-tighter uppercase">Natiijo <span class="text-yellow-600 underline decoration-indigo-900 decoration-8 underline-offset-4">Raadi</span></h2>
             <p class="text-[9px] font-black text-slate-300 mb-12 uppercase tracking-[0.3em]">Official KCTE Student Self-Service Portal</p>
             <input id="search-id" type="text" placeholder="E.g SRLD/140/15" class="w-full p-8 rounded-[3rem] text-4xl font-black text-center text-indigo-950 shadow-inner bg-white border-2 border-slate-50 focus:border-yellow-500 outline-none uppercase tracking-widest placeholder:text-gray-100">
             <button onclick="studentCheck()" class="mt-4 w-full bg-indigo-950 text-white p-8 rounded-[3rem] font-black text-2xl shadow-2xl hover:scale-105 transition-all italic active:scale-95 shadow-indigo-300">HEL BUUNDADA (SEARCH)</button>
             <div id="st-res"></div>
             <button onclick="document.getElementById('modal').classList.add('hidden')" class="mt-12 text-slate-400 text-xs font-black uppercase underline decoration-2 tracking-widest decoration-gray-100 italic">Exit Gateway</button>
        </div>
    </div>

</body>
</html>
