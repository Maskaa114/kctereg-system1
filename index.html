<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KCTE MASTER SYSTEM v2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, getDocs, updateDoc, doc, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDoMZETvL5-oYm5wiP2dcbLm1p6ZfsgvjE",
            authDomain: "kctereg-online.firebaseapp.com",
            projectId: "kctereg-online",
            storageBucket: "kctereg-online.firebasestorage.app",
            messagingSenderId: "308277595556",
            appId: "1:308277595556:web:1b1814886668eda0310531"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let currentRole = "";

        // LOGIN SYSTEM
        window.login = () => {
            const user = document.getElementById('user').value.trim();
            const pass = document.getElementById('pass').value.trim();
            
            if(user === "Macalin114" && pass === "kctepass") renderUI('Teacher');
            else if(user === "D.head 5353" && pass === "headpass") renderUI('HOD');
            else if(user === "REG.12345" && pass === "regpass") renderUI('REG');
            else if(user === "dean12345" && pass === "deanpass") renderUI('Dean');
            else alert("Username ama Password khalad ah!");
        };

        function renderUI(role) {
            currentRole = role;
            document.getElementById('login-box').classList.add('hidden');
            document.getElementById('dash-title').innerText = role + " DASHBOARD";
            document.getElementById('dashboard-ui').classList.remove('hidden');

            if(role === 'Teacher') document.getElementById('teacher-section').classList.remove('hidden');
            if(role === 'HOD') loadData('PENDING_HOD');
            if(role === 'REG') loadData('PENDING_REG');
            if(role === 'Dean') loadData(); 
        }

        // EXCEL HANDLING
        let uploadedGrades = [];
        window.readExcel = (e) => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                const workbook = XLSX.read(ev.target.result, {type: 'binary'});
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                uploadedGrades = XLSX.utils.sheet_to_json(firstSheet);
                console.log("Excel Data:", uploadedGrades); // Debugging
                alert(uploadedGrades.length + " Arday ayaa la soo aqriyey!");
            };
            reader.readAsBinaryString(e.target.files[0]);
        };

        window.submitToHOD = async () => {
            if(uploadedGrades.length == 0) return alert("Fadlan kow soo geli Excel file-ka!");
            await addDoc(collection(db, "grades"), {
                teacher: "Macalin114",
                students: uploadedGrades,
                status: "PENDING_HOD",
                at: new Date().toLocaleString()
            });
            alert("Waxaa loo diray Head-ka Waaxda (HOD) si uu u soo hubiyo!");
            location.reload();
        };

        // ADMIN VIEW (LIST SUBMISSIONS WITH DATA)
        function loadData(status) {
            const q = status ? query(collection(db, "grades"), where("status", "==", status)) : collection(db, "grades");
            onSnapshot(q, (snap) => {
                let h = "";
                snap.forEach(d => {
                    const data = d.data();
                    let studentRows = "";
                    data.students.slice(0, 5).forEach(s => { // Preview 5 rows
                        studentRows += `<tr><td class='border px-2 text-xs'>${s.ID || s.id || 'N/A'}</td><td class='border px-2 text-xs'>${s.Name || s.magaca || 'N/A'}</td><td class='border px-2 text-xs font-bold text-red-600'>${s.Grade || s.buundada || s.grade || 'N/A'}</td></tr>`;
                    });

                    h += `
                    <div class="bg-white p-4 border-2 border-slate-300 mb-6 rounded-lg shadow-lg">
                        <div class="flex justify-between items-center mb-2">
                            <div>
                                <p class="font-black text-blue-900 text-lg uppercase">${data.teacher} Submission</p>
                                <p class="text-xs text-gray-500">${data.at}</p>
                                <p class="text-sm font-bold px-2 py-1 bg-yellow-100 inline-block mt-1">${data.status}</p>
                            </div>
                            <div class="space-x-2">
                                ${(currentRole=='HOD' && data.status=='PENDING_HOD') ? `<button onclick="act('${d.id}', 'PENDING_REG')" class="bg-green-600 text-white px-4 py-2 rounded shadow hover:bg-green-700">Approve & Send to REG</button>` : ""}
                                ${(currentRole=='REG' && data.status=='PENDING_REG') ? `<button onclick="act('${d.id}', 'APPROVED')" class="bg-indigo-700 text-white px-4 py-2 rounded font-black shadow hover:bg-indigo-900">FINAL APPROVE (Publish)</button>` : ""}
                                <button onclick="rejectDoc('${d.id}')" class="bg-red-500 text-white px-4 py-2 rounded text-xs">Delete/Reject</button>
                            </div>
                        </div>
                        <table class="w-full text-left mt-3 border">
                            <thead class="bg-slate-50"><tr><th class="border px-2 py-1 text-xs">ID</th><th class="border px-2 py-1 text-xs">Name</th><th class="border px-2 py-1 text-xs">Grade</th></tr></thead>
                            <tbody>${studentRows}</tbody>
                        </table>
                        <p class="text-[10px] mt-1 text-gray-400">Showing first 5 students. (Total: ${data.students.length})</p>
                    </div>`;
                });
                document.getElementById('list-box').innerHTML = h || "<p class='text-gray-400 italic text-center py-10'>Hadda ma jiraan buundooyin la sugayo...</p>";
            });
        }

        window.act = async (id, s) => {
            if(!confirm("Ma hubtaa inaad talaabadan qaaddo?")) return;
            await updateDoc(doc(db, "grades", id), { status: s });
            alert("Status-kii waa la bedelay!");
        };

        window.rejectDoc = async (id) => {
            if(!confirm("Ma tirtiraysaa submission-kaan?")) return;
            await deleteDoc(doc(db, "grades", id));
            alert("Waa la tirtiray!");
        };

        // STUDENT SEARCH (FIXED)
        window.studentSearch = async () => {
            const idInput = document.getElementById('student-id').value.trim();
            if(!idInput) return alert("Fadlan qor ID-gaaga!");
            
            const resultBox = document.getElementById('result');
            resultBox.innerHTML = "<p class='text-blue-500'>Raadinayaa...</p>";

            const q = query(collection(db, "grades"), where("status", "==", "APPROVED"));
            const snap = await getDocs(q);
            let found = null;

            snap.forEach(doc => {
                const list = doc.data().students;
                // Raadi adigoo barbar dhigaya Labada ID oo ah "String" si aysan nambar iyo qoraal isku khaldin
                const match = list.find(s => {
                    const excelId = String(s.ID || s.id || s.Id || '').trim();
                    return excelId === String(idInput);
                });
                if(match) found = match;
            });

            if(found) {
                resultBox.innerHTML = `
                <div class="mt-6 p-6 bg-blue-50 border-2 border-blue-900 rounded-xl animate-bounce">
                    <p class="text-sm text-blue-800 uppercase font-bold">Natiijada Buundada:</p>
                    <h3 class="text-xl font-bold text-slate-800">${found.Name || found.magaca || 'STUDENT'}</h3>
                    <p class="text-4xl font-black text-indigo-900 mt-2">${found.Grade || found.buundada || found.grade || 'A'}</p>
                    <p class="text-[10px] text-green-600 mt-2 font-bold uppercase underline">Oggolaanshaha REG: Diyaar</p>
                </div>`;
            } else {
                resultBox.innerHTML = `<p class="mt-4 p-4 bg-red-100 text-red-700 rounded font-bold text-xs italic text-center">Xogtani weli lama soo gelin, lama oggolaan, ama ID-ga ${idInput} ma jiro.</p>`;
            }
        };

    </script>
</head>
<body class="bg-slate-200 min-h-screen">

    <!-- NAVBAR -->
    <nav class="bg-indigo-950 p-5 text-white font-black flex justify-between items-center border-b-4 border-yellow-500 shadow-xl">
        <div class="flex items-center gap-2 text-xl italic uppercase tracking-tighter">
            <span>KCTE</span> 
            <span class="bg-white text-indigo-950 px-2 py-0.5 rounded shadow-lg">ONLINE GRADE</span>
        </div>
        <button onclick="document.getElementById('student-modal').classList.remove('hidden')" class="bg-yellow-500 hover:bg-yellow-400 text-indigo-950 px-4 py-2 rounded-full font-bold text-xs transition-all shadow-md">KAEEG BUUNDADA (ARDAAYADA)</button>
    </nav>

    <!-- LOGIN SCREEN -->
    <div id="login-box" class="max-w-md mx-auto mt-20 bg-white p-10 shadow-2xl rounded-2xl border-t-8 border-indigo-950">
        <h2 class="text-center font-black text-2xl mb-8 uppercase text-indigo-900 tracking-widest underline decoration-yellow-500">GASHIDKA STAFF-KA</h2>
        <input id="user" type="text" placeholder="Magaca Isticmaalaha" class="w-full border-2 border-slate-200 p-4 rounded-xl mb-4 focus:border-yellow-500 outline-none transition-all">
        <input id="pass" type="password" placeholder="Furaha Sirta" class="w-full border-2 border-slate-200 p-4 rounded-xl mb-8 focus:border-yellow-500 outline-none transition-all">
        <button onclick="login()" class="w-full bg-indigo-900 hover:bg-indigo-700 text-white p-5 rounded-2xl font-black text-lg transition-all transform active:scale-95 shadow-lg">GAL DASHBOARD-KA</button>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="dashboard-ui" class="hidden container mx-auto px-6 py-12">
        <h2 id="dash-title" class="text-4xl font-black mb-10 text-indigo-950 border-l-8 border-yellow-500 pl-4 tracking-tighter uppercase underline decoration-blue-500">DASHBOARD</h2>
        
        <!-- Teacher Control -->
        <div id="teacher-section" class="hidden bg-white p-10 rounded-3xl shadow-2xl border-2 border-slate-200 mb-10">
            <h3 class="font-black text-xl mb-6 text-slate-800 uppercase flex items-center gap-2 italic">
                <span class="p-2 bg-indigo-100 rounded-lg">📤</span> Soo Gudbinta Buundooyinka (Macalin)
            </h3>
            <div class="bg-slate-50 border-4 border-dashed border-slate-300 rounded-2xl p-10 text-center mb-6">
                <p class="mb-4 font-bold text-slate-500 underline uppercase italic">Fadlan halkan soo dhex dhig EXCEL FILE-ka:</p>
                <input type="file" onchange="readExcel(event)" accept=".xlsx, .xls" class="mb-6 block mx-auto text-xs text-slate-500 file:bg-indigo-950 file:text-white file:rounded-full file:px-6 file:py-2">
                <button onclick="submitToHOD()" class="bg-indigo-900 text-white px-12 py-4 rounded-full font-black hover:bg-yellow-500 hover:text-indigo-900 transition-all shadow-xl">GUDUBI (SENT TO DEPARTMET HEAD)</button>
            </div>
        </div>

        <!-- Submission List For Approval -->
        <div id="approval-section" class="max-w-4xl mx-auto">
            <h3 class="font-black mb-6 text-indigo-900 flex items-center gap-2 uppercase tracking-tight">
                <span class="p-2 bg-yellow-400 rounded-lg">📋</span> Buundooyinka la soo Gudbiyey (Audit View)
            </h3>
            <div id="list-box"></div>
        </div>
    </div>

    <!-- STUDENT MODAL (ARDAAYADA SEARCH) -->
    <div id="student-modal" class="hidden fixed inset-0 bg-indigo-950/95 backdrop-blur-md flex items-center justify-center p-4 z-50">
        <div class="bg-white p-10 rounded-3xl max-w-sm w-full shadow-[0_35px_60px_-15px_rgba(0,0,0,0.3)]">
            <h2 class="font-black text-2xl mb-2 text-indigo-900 text-center uppercase">OGOW NATIIJADAADA</h2>
            <p class="text-xs text-center text-slate-400 mb-8 italic">ID-gaagga iyo Magacaagga waa inuu diyaar ahaado.</p>
            <input id="student-id" type="text" placeholder="Geli ID Number-kaaga (e.g. 001)" class="w-full border-2 border-slate-200 p-4 rounded-xl mb-4 outline-none focus:border-yellow-500 font-bold text-center text-xl tracking-widest shadow-inner">
            <button onclick="studentSearch()" class="w-full bg-indigo-900 hover:bg-indigo-800 text-white p-5 rounded-2xl font-black text-lg transition-all active:scale-95 shadow-lg shadow-indigo-200 uppercase italic">HUBI BUUNDADA (SEARCH)</button>
            <div id="result" class="text-center"></div>
            <button onclick="document.getElementById('student-modal').classList.add('hidden')" class="mt-8 text-slate-400 font-bold underline text-xs w-full hover:text-red-500 transition-colors uppercase">Halkan ku xir / Exit</button>
        </div>
    </div>

</body>
</html>
