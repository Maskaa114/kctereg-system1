<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KCTE MASTER SYSTEM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, getDocs, updateDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDoMZETvL5-oYm5wiP2dcbLm1p6ZfsgvjE",
            authDomain: "kctereg-online.firebaseapp.com",
            projectId: "kctereg-online",
            storageBucket: "kctereg-online.firebasestorage.app",
            messagingSenderId: "308277595556",
            appId: "1:308277595556:web:1b1814886668eda0310531"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let currentRole = "";

        // LOGIN SYSTEM
        window.login = () => {
            const user = document.getElementById('user').value;
            const pass = document.getElementById('pass').value;
            
            if(user === "Macalin114" && pass === "kctepass") renderUI('Teacher');
            else if(user === "D.head 5353" && pass === "headpass") renderUI('HOD');
            else if(user === "REG.12345" && pass === "regpass") renderUI('REG');
            else if(user === "dean12345" && pass === "deanpass") renderUI('Dean');
            else alert("Username ama Password khalad ah!");
        };

        function renderUI(role) {
            currentRole = role;
            document.getElementById('login-box').classList.add('hidden');
            document.getElementById('dash-title').innerText = role + " DASHBOARD";
            document.getElementById('dashboard-ui').classList.remove('hidden');

            if(role === 'Teacher') document.getElementById('teacher-section').classList.remove('hidden');
            if(role === 'HOD') loadData('PENDING_HOD');
            if(role === 'REG') loadData('PENDING_REG');
            if(role === 'Dean') loadData(); // Dean sees everything
        }

        // EXCEL HANDLING
        let uploadedGrades = [];
        window.readExcel = (e) => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                const workbook = XLSX.read(ev.target.result, {type: 'binary'});
                uploadedGrades = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                alert(uploadedGrades.length + " Grades Loaded!");
            };
            reader.readAsBinaryString(e.target.files[0]);
        };

        window.submitToHOD = async () => {
            if(uploadedGrades.length == 0) return alert("Upload Excel First!");
            await addDoc(collection(db, "grades"), {
                teacher: "Macalin114",
                students: uploadedGrades,
                status: "PENDING_HOD",
                at: new Date().toLocaleString()
            });
            alert("Sent to Department Head!");
            location.reload();
        };

        // APPROVAL LOADING
        function loadData(status) {
            const q = status ? query(collection(db, "grades"), where("status", "==", status)) : collection(db, "grades");
            onSnapshot(q, (snap) => {
                let h = "";
                snap.forEach(d => {
                    const data = d.data();
                    h += `<div class="bg-white p-4 border mb-4 rounded shadow">
                        <p class="font-bold">Macalin: ${data.teacher} (${data.at})</p>
                        <p class="text-blue-600 font-bold">STATUS: ${data.status}</p>
                        <div class="mt-2">
                            ${(currentRole=='HOD' && data.status=='PENDING_HOD') ? `<button onclick="act('${d.id}', 'PENDING_REG')" class="bg-green-500 text-white p-2 rounded">Approve</button>` : ""}
                            ${(currentRole=='REG' && data.status=='PENDING_REG') ? `<button onclick="act('${d.id}', 'APPROVED')" class="bg-blue-800 text-white p-2 rounded font-bold">Final Approval</button>` : ""}
                        </div>
                    </div>`;
                });
                document.getElementById('list-box').innerHTML = h;
            });
        }

        window.act = async (id, s) => {
            await updateDoc(doc(db, "grades", id), { status: s });
            alert("Success!");
        };

        // STUDENT GRADE SEARCH
        window.studentSearch = async () => {
            const idInput = document.getElementById('student-id').value;
            const q = query(collection(db, "grades"), where("status", "==", "APPROVED"));
            const snap = await getDocs(q);
            let found = null;

            snap.forEach(doc => {
                const students = doc.data().students;
                found = students.find(s => s.ID == idInput || s.id == idInput);
            });

            if(found) {
                document.getElementById('result').innerHTML = `
                <div class="mt-4 p-4 bg-green-100 rounded">
                    <p class="font-bold text-xl">Ardayga: ${found.Name || found.magaca}</p>
                    <p class="text-2xl font-black text-blue-900">Buundadaada waa: ${found.Grade || found.buundada}</p>
                </div>`;
            } else {
                alert("Ardaygaan xogtiisa wali lama oggolaan (Pending) ama ma jiro ID-gaan.");
            }
        };

    </script>
</head>
<body class="bg-slate-100">

    <div class="bg-blue-900 p-4 text-white font-bold flex justify-between">
        <h1>KCTE ONLINE REGISTRATION</h1>
        <button onclick="document.getElementById('student-modal').classList.remove('hidden')" class="underline">ARDAAYADA (Check Grade)</button>
    </div>

    <!-- LOGIN BOX -->
    <div id="login-box" class="max-w-md mx-auto mt-20 bg-white p-8 shadow-2xl rounded-xl">
        <h2 class="text-center font-bold text-2xl mb-6">LOGIN STAFF</h2>
        <input id="user" type="text" placeholder="Username" class="w-full border p-3 rounded mb-4 outline-none">
        <input id="pass" type="password" placeholder="Password" class="w-full border p-3 rounded mb-6 outline-none">
        <button onclick="login()" class="w-full bg-blue-900 text-white p-3 rounded font-bold">LOGIN</button>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard-ui" class="hidden container mx-auto p-10">
        <h2 id="dash-title" class="text-3xl font-black mb-6">DASHBOARD</h2>
        
        <div id="teacher-section" class="hidden bg-white p-6 rounded shadow mb-6">
            <h3 class="font-bold border-b mb-4">Macalin114: Soo Geli Excel-ka</h3>
            <input type="file" onchange="readExcel(event)" class="mb-4 block">
            <button onclick="submitToHOD()" class="bg-blue-900 text-white px-6 py-2 rounded">Submit for Approval</button>
        </div>

        <div id="approval-section" class="mt-4">
            <h3 class="font-bold mb-4">Guddiga Oggolaanshaha / Dean Monitoring</h3>
            <div id="list-box"></div>
        </div>
    </div>

    <!-- STUDENT MODAL (LOGIN FOR STUDENT) -->
    <div id="student-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl max-w-sm w-full">
            <h2 class="font-bold text-xl mb-4"> ARDAY: KAEEG GRADE-KAAGA</h2>
            <input id="student-id" type="text" placeholder="Geli ID-gaaga (e.g 1021)" class="w-full border p-3 rounded mb-4">
            <button onclick="studentSearch()" class="w-full bg-blue-700 text-white p-3 rounded font-bold">SEARCH GRADE</button>
            <div id="result"></div>
            <button onclick="document.getElementById('student-modal').classList.add('hidden')" class="mt-4 text-gray-500 underline text-sm w-full">Xir</button>
        </div>
    </div>

</body>
</html>
