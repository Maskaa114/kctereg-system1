<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KCTE STUDENT HUB - v14 FINAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, getDocs, updateDoc, doc, onSnapshot, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDoMZETvL5-oYm5wiP2dcbLm1p6ZfsgvjE",
            authDomain: "kctereg-online.firebaseapp.com",
            projectId: "kctereg-online",
            storageBucket: "kctereg-online.firebasestorage.app",
            messagingSenderId: "308277595556",
            appId: "1:3082775955556:web:1b1814886668eda0310531"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let currentUserSessionId = "";

        // Nadiifiyaha ID-ga: Ka saar / . space iyo wixii dhibaya si loogu gudbo qaladka
        const normalize = (t) => String(t).toUpperCase().replace(/[^A-Z0-9]/g, '').trim();

        // --- LOGIN LOGIC ---
        window.portalLogin = async () => {
            const u = document.getElementById('log-u').value.trim();
            const p = document.getElementById('log-p').value.trim();
            
            if(!u || !p) return alert("BuuxiUsername/ID iyo Password.");

            if(u === "Macalin114" && p === "kctepass") return startPortal("Macalin");
            if(u === "D.head 5353" && p === "headpass") return startPortal("HOD");
            if(u === "REG.12345" && p === "regpass") return startPortal("REG");
            if(u === "dean12345" && p === "deanpass") return startPortal("Dean");

            // Check Student login
            const q = query(collection(db, "st_users_v14"), where("normalizedID", "==", normalize(u)), where("password", "==", p));
            const snap = await getDocs(q);
            if (!snap.empty) {
                currentUserSessionId = normalize(u);
                startPortal("Student");
            } else { alert("Login failed! Akoonka ma jiro ama ID-gu ma 'APPROVED' gareysna."); }
        };

        function startPortal(r) {
            document.getElementById('welcome-box').style.display = 'none';
            document.getElementById('login-div').classList.add('hidden');
            document.getElementById('dashboard-ui').classList.remove('hidden');
            document.getElementById('user-info-txt').innerText = r + " Dashboard";
            
            if(r === 'Macalin') document.getElementById('teacher-ui').classList.remove('hidden');
            if(r === 'Student') displayStudentGrades();
            if(['HOD', 'REG', 'Dean'].includes(r)) loadAuditFiles(r);
        }

        // --- TEACHER PASTE (Improved Detection) ---
        let gradeStaging = [];
        window.onExcelPaste = (e) => {
            const lines = e.target.value.split("\n");
            gradeStaging = [];
            lines.forEach(line => {
                const cols = line.split("\t");
                if (cols.length >= 3) {
                    let name = (cols[1] || "").split("+")[0].trim();
                    let id = (cols[2] || "").trim();
                    let mark = cols.find(v => !isNaN(v) && v != "" && v.length >= 1) || "0";
                    let grade = cols[cols.length-1].trim().toUpperCase() || "N/A";
                    if (name && !name.toLowerCase().includes("name")) {
                        gradeStaging.push({ name, id, mark, grade });
                    }
                }
            });
            document.getElementById('staging-count').innerText = "Diyaar: " + gradeStaging.length + " Arday.";
        };

        window.submitReport = async () => {
            const subject = document.getElementById('subj-input').value.trim();
            if(!subject || gradeStaging.length === 0) return alert("Magaca maadada qor!");
            await addDoc(collection(db, "grade_official_v14"), {
                subject: subject.toUpperCase(), instructor: "Macalin114",
                list: gradeStaging, status: "PENDING_HOD", date: new Date().toLocaleString()
            });
            alert("Success: Buundooyinka waxaa loo diray Hubinta."); location.reload();
        };

        // --- STUDENT SIGNUP (XALKA QALADKAAGA) ---
        window.createAccount = async () => {
            const rid = document.getElementById('reg-id').value.trim();
            const rpw = document.getElementById('reg-pw').value.trim();
            if(!rid || !rpw) return alert("ID-ga iyo Password dhaliso!");

            const normalizedInput = normalize(rid);
            document.getElementById('reg-btn').innerText = "Xaqiijin baa socota...";

            // Raadi Dhammaan Reports-ka "APPROVED" ah
            const q = query(collection(db, "grade_official_v14"), where("status", "==", "APPROVED"));
            const snap = await getDocs(q);
            
            let studentMatched = null;
            snap.forEach(docSnap => {
                const sheet = docSnap.data().list;
                // Bar-bar dhig si Smart ah (Scrubbing non-alphanumeric)
                const match = sheet.find(s => normalize(s.id) === normalizedInput);
                if(match) studentMatched = match;
            });

            if(studentMatched) {
                await setDoc(doc(db, "st_users_v14", normalizedInput), {
                    normalizedID: normalizedInput,
                    originalID: rid.toUpperCase(),
                    password: rpw,
                    name: studentMatched.name
                });
                alert("Masha'Allah! Akoon-kaagu waa diyaar. LOGIN ku dheh ID-gaaga: " + rid);
                location.reload();
            } else {
                alert("Khalad: ID lambarkaaga wali oggolaansho kama helin Registry (Final Approval)!");
                document.getElementById('reg-btn').innerText = "CREATE MY ACCOUNT";
            }
        };

        async function displayStudentGrades() {
            const q = query(collection(db, "grade_official_v14"), where("status", "==", "APPROVED"));
            const snap = await getDocs(q);
            let h = "";
            snap.forEach(docSnap => {
                const sMatch = docSnap.data().list.find(st => normalize(st.id) === currentUserSessionId);
                if(sMatch) {
                    h += `<div class='bg-white p-8 rounded-[2.5rem] shadow-2xl border-t-[10px] border-indigo-900 mb-6 text-center animate-fade-in'>
                        <h3 class='text-[10px] font-black uppercase text-indigo-300'>Institutional Official Card</h3>
                        <h2 class='text-4xl font-black text-indigo-950 uppercase'>${sMatch.name}</h2>
                        <p class='text-xs font-bold text-gray-500 uppercase mt-2'>SUBJECT: ${docSnap.data().subject}</p>
                        <div class='grid grid-cols-2 gap-4 mt-10'>
                            <div class='bg-gray-50 p-6 rounded-3xl border'><span class='block text-[8px] font-bold text-gray-400'>SCORE SCORE</span> <h1 class='text-4xl font-black text-indigo-950'>100/${sMatch.mark}</h1></div>
                            <div class='bg-indigo-950 text-white p-6 rounded-3xl shadow-xl shadow-indigo-100 border-b-8 border-yellow-500'><span class='block text-[8px] font-bold text-indigo-300'>LETTER GRADE</span> <h1 class='text-7xl font-black italic underline decoration-yellow-400'>${sMatch.grade}</h1></div>
                        </div>
                    </div>`;
                }
            });
            document.getElementById('student-res-list').innerHTML = h;
            document.getElementById('student-panel').classList.remove('hidden');
        }

        // --- MANAGEMENT ---
        function loadAuditFiles(role) {
            const q = role==='Dean' ? collection(db,"grade_official_v14") : query(collection(db,"grade_official_v14"), where("status","==",(role==='HOD'?'PENDING_HOD':'PENDING_REG')));
            onSnapshot(q, snap => {
                let html = "";
                snap.forEach(ds => {
                    const info = ds.data();
                    let stH = ""; info.list.forEach(st => stH += `<tr><td class='p-1 border'>${st.id}</td><td class='p-1 border font-bold'>${st.name}</td><td class='p-1 border font-black'>${st.mark}</td><td class='p-1 border font-bold text-red-600'>${st.grade}</td></tr>`);
                    html += `<div class='bg-white p-6 rounded-2xl shadow-xl mb-8 border-l-[15px] border-indigo-950'>
                        <div class='flex justify-between items-center mb-2'>
                            <div><h3 class='font-black text-xl'>${info.subject}</h3><p class='text-[10px]'>Date: ${info.date}</p></div>
                            <div class='flex gap-1 h-fit'>
                                ${(role=='HOD'&&info.status=='PENDING_HOD') ? `<button onclick="actionSt('${ds.id}','PENDING_REG')" class='bg-green-600 text-white px-3 py-1 rounded text-xs'>Ogolow</button>` : ""}
                                ${(role=='REG'&&info.status=='PENDING_REG') ? `<button onclick="actionSt('${ds.id}','APPROVED')" class='bg-indigo-900 text-white px-5 py-2 rounded-2xl text-[10px] font-black italic shadow-lg'>REG FINAL APPROVE</button>` : ""}
                                <button onclick="delSt('${ds.id}')" class='bg-red-400 text-white px-2 py-1 rounded text-[9px]'>Reject</button>
                                <span class='p-1 bg-yellow-50 text-[10px] font-black italic opacity-30'>${info.status}</span>
                            </div>
                        </div>
                        <details class="cursor-pointer text-[10px] text-blue-500 italic"><summary>Student Detail Review ▽</summary>
                            <table class='w-full mt-4 text-[9px] text-left'><thead><tr><th>ID</th><th>FullName</th><th>Score</th><th>Grade</th></tr></thead><tbody>${stH}</tbody></table>
                        </details>
                    </div>`;
                });
                document.getElementById('manager-list').innerHTML = html;
            });
            if(role === "REG") document.getElementById('p-reset-area').classList.remove('hidden');
        }
        window.actionSt = async(id, s) => { await updateDoc(doc(db,"grade_official_v14",id),{status:s}); alert("Nadiifiyey!"); };
        window.delSt = async(id) => { if(confirm("Tirtir Report?")) await deleteDoc(doc(db,"grade_official_v14",id)); };
        
        onSnapshot(collection(db, "st_users_v14"), snap => {
            let list = ""; snap.forEach(d => { list += `<div class='flex justify-between bg-indigo-50/30 p-2 border-b rounded-xl mb-1'><span class='text-[10px] font-black'>${d.data().originalID} - ${d.data().name}</span> <button onclick="pwR('${d.id}')" class='bg-red-600 text-white px-2 py-0.5 rounded text-[8px]'>RESET 123</button></div>`; });
            document.getElementById('reset-box').innerHTML = list;
        });
        window.pwR = async(u) => { await updateDoc(doc(db, "st_users_v14", u), { password: "123" }); alert("Resetted!"); };

    </script>
    <style> .animate-fade-in { animation: fadeIn 0.4s ease-out; } @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: 0; } } .animate-shake { animation: shake 0.3s; } @keyframes shake { 0%,100% {transform:translateX(0);} 25% {transform:translateX(-10px);} 75% {transform:translateX(10px);} } </style>
</head>
<body class="bg-gray-100 font-sans tracking-tight text-indigo-950 overflow-x-hidden italic italic italic">

    <!-- PAGE 1 -->
    <div id="welcome-box" class="fixed inset-0 bg-indigo-950 flex flex-col items-center justify-center p-8 z-[500] text-center italic italic italic italic italic">
        <h1 class="text-7xl lg:text-9xl font-black text-white italic tracking-tighter leading-none mb-1">KCTE <span class="bg-yellow-500 text-indigo-950 px-4 rounded italic shadow-2xl">REG</span></h1>
        <p class="text-indigo-400 font-bold uppercase text-[10px] tracking-[0.5em] mb-12 opacity-80 underline decoration-indigo-800 decoration-8 underline-offset-8">Official Result Dashboard Portal</p>
        <button onclick="document.getElementById('welcome-box').style.display='none'; document.getElementById('login-div').classList.remove('hidden');" class="bg-white text-indigo-950 px-20 py-8 rounded-[4.5rem] font-black text-3xl shadow-xl hover:scale-105 active:scale-95 transition-all">BUUNDA EEG ➜</button>
        <button onclick="document.getElementById('welcome-box').style.display='none'; document.getElementById('login-div').classList.remove('hidden');" class="mt-8 text-yellow-500 font-black uppercase text-xs opacity-50 underline tracking-[0.2em] italic italic">Staff Management Access</button>
    </div>

    <!-- MAIN NAV -->
    <nav class="hidden bg-indigo-950 p-6 flex justify-between border-b-8 border-yellow-500 text-white sticky top-0 z-[200] items-center">
        <h1 class="font-black text-xl italic tracking-widest italic leading-none">KCTE Hub Hub</h1>
        <span id="user-info-txt" class="text-[9px] bg-white/10 px-3 py-1 rounded-full text-yellow-400 font-black italic uppercase italic">Authorized</span>
    </nav>

    <!-- UNIFIED LOGIN BOX -->
    <div id="login-div" class="hidden max-w-sm mx-auto mt-20 p-12 bg-white rounded-[4.5rem] shadow-2xl border border-indigo-50 text-center animate-fade-in relative">
        <h2 class="text-4xl font-black text-indigo-950 mb-1 leading-none uppercase italic tracking-tighter italic">Log in Account</h2>
        <p class="text-[10px] font-black text-gray-400 border-b pb-4 mb-10 italic uppercase decoration-yellow-500 underline underline-offset-8">System Access Entry</p>
        
        <input id="log-u" placeholder="ID No (E.g SRLD/007/15)" class="w-full bg-slate-50 border p-5 rounded-3xl mb-4 font-black italic tracking-widest text-center shadow-inner uppercase">
        <input id="log-p" type="password" placeholder="Pass-key" class="w-full bg-slate-50 border p-5 rounded-3xl mb-12 font-black text-center text-5xl shadow-inner focus:border-yellow-500 outline-none">
        <button onclick="portalLogin()" class="w-full bg-indigo-950 text-white p-6 rounded-3xl font-black text-xl hover:shadow-indigo-400 active:scale-90 transition-all uppercase italic">LOG IN DASHBOARD ➜</button>

        <p class="mt-12 text-[10px] text-gray-300 font-bold leading-loose uppercase italic border-t pt-8">Student? Akoon maba leedahay?<br>
           <button onclick="document.getElementById('sign-up-modal').classList.remove('hidden')" class="bg-yellow-500 text-indigo-950 px-8 py-2 rounded-full font-black text-xs uppercase shadow-xl mt-4">Akoon Cusub Sameey / SIGN UP</button>
        </p>
    </div>

    <!-- MAIN PORTAL WRAPPER -->
    <div id="dashboard-ui" class="hidden p-8 lg:p-12 max-w-5xl mx-auto italic italic">
        <!-- TEACHER -->
        <div id="teacher-ui" class="hidden">
            <div class="bg-white p-12 rounded-[5rem] shadow-2xl text-center border-t-[15px] border-green-500 mb-16 animate-fade-in relative">
                 <h2 class="text-3xl font-black text-indigo-950 mb-8 italic uppercase tracking-widest">Gudbi Official Transcript</h2>
                 <input id="subj-input" placeholder="Enter Course Name" class="w-full p-8 border bg-gray-50 rounded-[3rem] font-black text-4xl text-center uppercase shadow-inner outline-none focus:border-indigo-900 mb-8 italic underline underline-offset-4 decoration-yellow-400">
                 <textarea oninput="onExcelPaste(event)" placeholder="Xogta Excel halkan ku Paste ka dheh durbaba..." class="w-full h-40 border bg-indigo-50/20 p-8 rounded-[3.5rem] outline-none text-[9px] italic tracking-[0.2em] mb-4"></textarea>
                 <p id="paste-status" class="text-indigo-950 font-black mb-8 italic"></p>
                 <span id="staging-count" class="font-black text-xs uppercase opacity-30 italic block mb-6"></span>
                 <button onclick="submitReport()" class="w-full bg-indigo-950 text-white p-8 rounded-[4rem] font-black text-4xl shadow-xl hover:scale-105 active:scale-95 transition underline decoration-yellow-500 decoration-8 underline-offset-8 uppercase italic tracking-tighter">SUBMIT TO REVIEWERS HUB</button>
            </div>
        </div>

        <!-- ARDAY RESULT AREA -->
        <div id="student-panel" class="hidden max-w-4xl mx-auto animate-fade-in">
             <h2 class="text-5xl font-black text-indigo-950 mb-12 italic uppercase underline underline-offset-4 decoration-yellow-500 decoration-8">Result Profile Card</h2>
             <div id="student-res-list" class="space-y-4"></div>
        </div>

        <div id="manager-list"></div>

        <!-- PASSWORD RE-LOCK (FOR REG) -->
        <div id="p-reset-area" class="hidden bg-white p-10 rounded-[3rem] shadow-2xl mt-12 border-t-[20px] border-red-500 italic italic">
             <h3 class="font-black text-red-600 mb-6 uppercase border-b pb-2 tracking-[0.3em] italic italic underline underline-offset-4">Reg Manager Panel: User Control</h3>
             <div id="reset-box" class="space-y-1"></div>
        </div>
    </div>

    <!-- STUDENT SIGNUP MODAL (THE SMART FIX MODAL) -->
    <div id="sign-up-modal" class="hidden fixed inset-0 bg-indigo-950/98 backdrop-blur-3xl flex items-center justify-center p-8 z-[1200] animate-fade-in italic">
        <div class="bg-white p-12 rounded-[4rem] w-full max-w-md shadow-2xl border-t-[20px] border-yellow-500 text-center relative overflow-hidden">
             <div class="absolute -top-10 -right-10 w-40 h-40 bg-yellow-200 rounded-full blur-3xl opacity-30 rotate-12"></div>
             <h2 class="text-4xl font-black text-indigo-950 leading-none tracking-tighter mb-2 italic"> Akoon Dhalis</h2>
             <p class="text-[9px] font-black text-gray-300 uppercase mb-8 border-b pb-4 italic">Verification Gate Registration</p>
             
             <input id="reg-id" placeholder="GELI ID NO (E.G SRLD/141/15)" class="w-full bg-slate-50 border p-6 rounded-2xl font-black text-center text-2xl uppercase shadow-inner outline-none focus:border-yellow-500 mb-4 tracking-tighter italic italic">
             <input id="reg-pw" type="password" placeholder="SET PRIVATE PASSWORD" class="w-full bg-slate-50 border p-6 rounded-2xl font-bold text-center text-4xl shadow-inner focus:border-yellow-500 mb-10 outline-none">
             
             <button id="reg-btn" onclick="createAccount()" class="w-full bg-indigo-950 text-white p-7 rounded-[2.5rem] font-black text-xl hover:shadow-indigo-200 transition-all uppercase underline underline-offset-8 decoration-yellow-400 decoration-8">REGISTER MY HUB HUB HADA</button>
             
             <button onclick="document.getElementById('sign-up-modal').classList.add('hidden')" class="mt-8 text-gray-300 font-bold uppercase text-[9px] border-b border-gray-100">Exit / Close Sign up gate X</button>
        </div>
    </div>

</body>
</html>
