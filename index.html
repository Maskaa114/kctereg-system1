<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KCTE SMART GRADE SYSTEM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, getDocs, updateDoc, doc, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDoMZETvL5-oYm5wiP2dcbLm1p6ZfsgvjE",
            authDomain: "kctereg-online.firebaseapp.com",
            projectId: "kctereg-online",
            storageBucket: "kctereg-online.firebasestorage.app",
            messagingSenderId: "308277595556",
            appId: "1:308277595556:web:1b1814886668eda0310531"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let currentRole = "";
        let finalGrades = [];

        window.login = () => {
            const user = document.getElementById('user').value.trim();
            const pass = document.getElementById('pass').value.trim();
            if(user === "Macalin114" && pass === "kctepass") renderDash('Teacher');
            else if(user === "D.head 5353" && pass === "headpass") renderDash('HOD');
            else if(user === "REG.12345" && pass === "regpass") renderDash('REG');
            else if(user === "dean12345" && pass === "deanpass") renderDash('Dean');
            else alert("ID ama Password khalad ah!");
        };

        function renderDash(role) {
            currentRole = role;
            document.getElementById('login-box').classList.add('hidden');
            document.getElementById('dash-ui').classList.remove('hidden');
            document.getElementById('dash-title').innerText = role + " DASHBOARD";
            if(role === 'Teacher') document.getElementById('teacher-area').classList.remove('hidden');
            if(role === 'HOD') loadData('PENDING_HOD');
            if(role === 'REG') loadData('PENDING_REG');
            if(role === 'Dean') loadData(); 
        }

        // KANI WAA SCANNER-KA CUSUB EE KCTE FORMAT
        window.readExcel = (e) => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                const workbook = XLSX.read(ev.target.result, {type: 'binary'});
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                const rows = XLSX.utils.sheet_to_json(sheet, {header: 1});

                finalGrades = [];
                console.log("Dhismaha Excel-kaaga:", rows);

                rows.forEach((row, index) => {
                    // Ka bood 8-da saf ee u horeeya (Cinwaanada Kolejka)
                    if (index < 5) return;

                    // Baadi safka leh SRLD (waxay u ekaan kartaa: "SRLD /140/15" ama meel kale)
                    const idCellIndex = row.findIndex(c => String(c).toUpperCase().includes("SRLD") || String(c).includes("/"));
                    
                    if (idCellIndex !== -1) {
                        const sId = String(row[idCellIndex]).trim();
                        // Badanaa Magaca ardayga wuxuu ka horeeyaa ID-ga ama waa Column 1
                        const sName = row[1] || row[2] || row[idCellIndex - 1]; 
                        // Grade-ka waa unuga u dambeeya ee safkaas ama midka ka horeeya
                        const sGrade = row[row.length - 1] || row[row.length - 2];

                        if (sId.toUpperCase().includes("SRLD") && sName && sGrade) {
                            finalGrades.push({
                                id: sId.replace(/\s+/g, '').toUpperCase(),
                                name: String(sName).trim(),
                                grade: String(sGrade).trim()
                            });
                        }
                    }
                });

                if (finalGrades.length > 0) {
                    alert("WAA LA HELAY: " + finalGrades.length + " Arday oo xogtoodu nadiif tahay!");
                } else {
                    alert("Wali lama helin arday. Hubi in Column-ka ID-gu leeyahay erayga 'SRLD'");
                }
            };
            reader.readAsBinaryString(e.target.files[0]);
        };

        window.submitToHOD = async () => {
            if(finalGrades.length == 0) return alert("Fadlan kow soo geli Excel file-ka!");
            await addDoc(collection(db, "grade_records"), {
                teacher: "Macalin114",
                records: finalGrades,
                status: "PENDING_HOD",
                at: new Date().toLocaleString()
            });
            alert("Loo diray HOD!"); location.reload();
        };

        function loadData(status) {
            const q = status ? query(collection(db, "grade_records"), where("status", "==", status)) : collection(db, "grade_records");
            onSnapshot(q, (snap) => {
                let h = "";
                snap.forEach(d => {
                    const data = d.data();
                    let stRows = "";
                    data.records.forEach(s => {
                        stRows += `<tr class='border-b'><td class='p-1'>${s.id}</td><td class='p-1 font-bold'>${s.name}</td><td class='p-1 text-red-600 font-black'>${s.grade}</td></tr>`;
                    });
                    h += `<div class="bg-white p-5 rounded-xl shadow-lg mb-6">
                        <h3 class="font-bold border-b pb-2 mb-2 uppercase">${data.teacher} - ${data.status}</h3>
                        <table class="w-full text-left text-xs">
                            <thead><tr class="bg-slate-50"><th>ID No.</th><th>Student Name</th><th>Final Grade</th></tr></thead>
                            <tbody>${stRows}</tbody>
                        </table>
                        <div class="mt-4 flex gap-2">
                            ${(currentRole=='HOD' && data.status=='PENDING_HOD') ? `<button onclick="updateStatus('${d.id}', 'PENDING_REG')" class="bg-green-600 text-white px-4 py-1 rounded">Approve</button>` : ""}
                            ${(currentRole=='REG' && data.status=='PENDING_REG') ? `<button onclick="updateStatus('${d.id}', 'APPROVED')" class="bg-indigo-900 text-white px-4 py-1 rounded">FINAL APPROVE</button>` : ""}
                            <button onclick="delRecord('${d.id}')" class="bg-red-400 text-white px-2 py-1 rounded text-xs">Delete</button>
                        </div>
                    </div>`;
                });
                document.getElementById('data-list').innerHTML = h || "<p class='text-center py-10 opacity-50 font-bold'>Majiraan xog la sugayo.</p>";
            });
        }

        window.updateStatus = async (id, s) => { await updateDoc(doc(db, "grade_records", id), { status: s }); alert("Success!"); };
        window.delRecord = async (id) => { if(confirm("Hubi inaad tirtirto?")) await deleteDoc(doc(db, "grade_records", id)); };

        // STUDENT SEARCH (SEARCH ID FIX)
        window.studentCheck = async () => {
            const inputId = document.getElementById('search-id').value.trim().toUpperCase().replace(/\s+/g, '');
            if(!inputId) return alert("Fadlan ID qor");
            
            const rDiv = document.getElementById('search-result');
            rDiv.innerHTML = "Raadinayaa...";

            const q = query(collection(db, "grade_records"), where("status", "==", "APPROVED"));
            const snapshot = await getDocs(q);
            let match = null;

            snapshot.forEach(doc => {
                match = doc.data().records.find(r => r.id === inputId || r.id.includes(inputId));
            });

            if(match) {
                rDiv.innerHTML = `
                <div class="mt-4 p-8 bg-blue-50 border-4 border-indigo-950 rounded-3xl animate-bounce shadow-2xl">
                    <p class="text-xs uppercase font-bold text-indigo-800 tracking-widest mb-2 underline">Official Result</p>
                    <h2 class="text-3xl font-black text-indigo-950 uppercase">${match.name}</h2>
                    <p class="text-sm text-slate-500 font-bold mb-4 italic uppercase underline">ID NO: ${match.id}</p>
                    <div class="inline-block px-10 py-6 bg-white border-4 border-indigo-900 rounded-3xl">
                        <span class="text-xs block font-black text-gray-300">Grade</span>
                        <h1 class="text-7xl font-black text-indigo-950">${match.grade}</h1>
                    </div>
                </div>`;
            } else {
                rDiv.innerHTML = `<p class="mt-4 text-red-600 font-bold bg-red-100 p-4 rounded uppercase text-xs italic">Ma jirto natiijo APPROVED ah oo ID-gan ah (${inputId}). Hubi inaad dhameyso oggolaanshaha REGISTER-ka (Final Approve).</p>`;
            }
        };

    </script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-900 font-sans">

    <nav class="bg-indigo-950 p-6 flex justify-between items-center text-white border-b-8 border-yellow-500 shadow-xl sticky top-0 z-[100]">
        <h1 class="font-black text-xl italic uppercase tracking-widest decoration-yellow-500 underline underline-offset-8 decoration-4">KCTE SYSTEM</h1>
        <button onclick="document.getElementById('modal').classList.remove('hidden')" class="bg-yellow-500 text-indigo-950 px-10 py-2.5 rounded-full font-black text-xs uppercase hover:bg-white transition-all shadow-xl">Arday Check</button>
    </nav>

    <!-- LOGIN SECTION -->
    <div id="login-box" class="max-w-md mx-auto mt-20 bg-white p-12 rounded-[3rem] shadow-2xl border border-slate-200">
        <h2 class="text-3xl font-black text-indigo-950 mb-1 tracking-tighter text-center uppercase">Portal Gateway</h2>
        <p class="text-[10px] text-slate-400 font-bold text-center mb-8 uppercase tracking-widest border-b pb-2 italic">Official Kebridahar Staff Panel</p>
        <div class="space-y-4">
            <input id="user" type="text" placeholder="Geli Username" class="w-full bg-slate-50 border border-slate-200 p-4 rounded-2xl outline-none focus:border-yellow-500 font-bold italic tracking-tighter">
            <input id="pass" type="password" placeholder="Geli Password" class="w-full bg-slate-50 border border-slate-200 p-4 rounded-2xl outline-none focus:border-yellow-500 font-bold">
            <button onclick="login()" class="w-full bg-indigo-950 text-white p-5 rounded-2xl font-black text-lg shadow-xl shadow-indigo-100 hover:shadow-indigo-300 hover:scale-[1.02] active:scale-95 uppercase italic transition-all">Gal Dashboard</button>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="dash-ui" class="hidden container mx-auto p-8 lg:p-16">
        <h2 id="dash-title" class="text-4xl font-black text-indigo-950 mb-12 tracking-tighter uppercase underline decoration-yellow-500 decoration-8 underline-offset-4">DASHBOARD</h2>
        
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
            <!-- TEACHER VIEW -->
            <div id="teacher-area" class="hidden bg-white p-12 rounded-[3rem] border border-slate-100 shadow-xl text-center">
                <h3 class="font-black text-2xl mb-8 text-indigo-950 italic border-l-8 border-indigo-900 pl-4 tracking-tighter uppercase underline decoration-indigo-50">Soo Geli Faylka Buundooyinka</h3>
                <div class="bg-indigo-50 border-4 border-dashed rounded-[3rem] p-16 text-center border-indigo-200 group hover:bg-white transition-all">
                    <input type="file" onchange="readExcel(event)" accept=".xlsx, .xls" class="mb-4 text-xs file:bg-indigo-950 file:text-white file:rounded-full file:px-6 file:py-2 file:border-0 hover:file:bg-yellow-500 hover:file:text-indigo-950">
                    <button onclick="submitToHOD()" class="mt-6 w-full bg-indigo-950 text-white p-5 rounded-3xl font-black hover:bg-yellow-500 hover:text-indigo-900 transition-all shadow-xl text-lg uppercase italic tracking-tighter active:scale-95">Send for Review (HOD)</button>
                </div>
            </div>

            <!-- AUDIT VIEW -->
            <div id="data-list" class="max-w-lg mx-auto w-full"></div>
        </div>
    </div>

    <!-- ARDAY SEARCH MODAL -->
    <div id="modal" class="hidden fixed inset-0 bg-indigo-950/95 flex items-center justify-center p-6 z-[1000] backdrop-blur-md animate-fade-in">
        <div class="bg-white p-12 rounded-[4rem] w-full max-w-lg shadow-[0_35px_70px_-20px_rgba(0,0,0,0.6)] text-center relative border-t-[10px] border-yellow-500 overflow-hidden">
             <div class="absolute -top-10 -right-10 w-40 h-40 bg-yellow-100 rounded-full blur-3xl opacity-50"></div>
             <h2 class="text-4xl font-black text-indigo-950 mb-1 tracking-tighter uppercase leading-none">Ogow <span class="text-yellow-600 underline decoration-indigo-950 decoration-4">Buundadaada</span></h2>
             <p class="text-[9px] text-slate-400 font-bold mb-10 italic uppercase tracking-[0.3em] underline decoration-indigo-50 decoration-2">KEBRIDAHAR COLLEGE OF TEACHER EDUCATION</p>
             <input id="search-id" type="text" placeholder="E.g SRLD/140/15" class="w-full bg-slate-50 border-4 border-indigo-50 p-7 rounded-[3rem] text-center font-black text-4xl tracking-tighter outline-none focus:border-yellow-500 transition-all text-indigo-950 uppercase shadow-inner placeholder:text-gray-200">
             <button onclick="studentCheck()" class="mt-4 w-full bg-indigo-950 text-white p-7 rounded-[2.5rem] font-black text-2xl hover:bg-yellow-500 hover:text-indigo-900 shadow-2xl transition-all hover:scale-[1.02] active:scale-95 italic">KA BAADI (SEARCH)</button>
             <div id="search-result" class="mt-4 min-h-[120px]"></div>
             <button onclick="document.getElementById('modal').classList.add('hidden')" class="mt-8 text-gray-300 font-bold uppercase text-[10px] hover:text-red-500 transition-colors tracking-widest border-b pb-1 border-gray-100">XIR XIR NATIIJADA</button>
        </div>
    </div>

</body>
</html>
