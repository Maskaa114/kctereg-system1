<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KCTE ONLINE FORM SYSTEM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, getDocs, updateDoc, doc, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDoMZETvL5-oYm5wiP2dcbLm1p6ZfsgvjE",
            authDomain: "kctereg-online.firebaseapp.com",
            projectId: "kctereg-online",
            storageBucket: "kctereg-online.firebasestorage.app",
            messagingSenderId: "308277595556",
            appId: "1:308277595556:web:1b1814886668eda0310531"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let role = "";
        let studentEntries = [];

        window.login = () => {
            const u = document.getElementById('u').value.trim();
            const p = document.getElementById('p').value.trim();
            if(u === "Macalin114" && p === "kctepass") showPortal("Teacher");
            else if(u === "D.head 5353" && p === "headpass") showPortal("HOD");
            else if(u === "REG.12345" && p === "regpass") showPortal("REG");
            else if(u === "dean12345" && p === "deanpass") showPortal("Dean");
            else alert("ID ama Password khalad ah!");
        };

        function showPortal(r) {
            role = r;
            document.getElementById('login-box').classList.add('hidden');
            document.getElementById('main-ui').classList.remove('hidden');
            document.getElementById('u-info').innerText = role;
            if(role === 'Teacher') document.getElementById('teacher-entry').classList.remove('hidden');
            if(role === 'HOD') loadAdminData('PENDING_HOD');
            if(role === 'REG') loadAdminData('PENDING_REG');
            if(role === 'Dean') loadAdminData();
        }

        window.addStudentRow = () => {
            const id = document.getElementById('st-id-input').value;
            const name = document.getElementById('st-name-input').value;
            const mark = document.getElementById('st-mark-input').value;
            const grade = document.getElementById('st-grade-input').value;

            if(!id || !name || !grade) return alert("Fadlan buuxi meelaha bannaan");

            studentEntries.push({ id, name, mark, grade });
            renderTable();
            // Clear inputs
            document.getElementById('st-id-input').value = "";
            document.getElementById('st-name-input').value = "";
            document.getElementById('st-mark-input').value = "";
            document.getElementById('st-grade-input').value = "";
        };

        function renderTable() {
            let html = "";
            studentEntries.forEach((s, index) => {
                html += `<tr class="border-b"><td>${index+1}</td><td>${s.id}</td><td>${s.name}</td><td>${s.mark}</td><td>${s.grade}</td></tr>`;
            });
            document.getElementById('st-tbody').innerHTML = html;
        }

        window.submitReport = async () => {
            const course = document.getElementById('c-name').value;
            if(!course || studentEntries.length == 0) return alert("Fadlan geli Maadada iyo ugu yaraan hal arday.");
            
            try {
                await addDoc(collection(db, "web_reports"), {
                    teacher: "Macalin114",
                    course: course,
                    students: studentEntries,
                    status: "PENDING_HOD",
                    date: new Date().toLocaleString()
                });
                alert("GUUL: Buundooyinkii waa la diray!");
                location.reload();
            } catch (err) {
                alert("Khalad baa dhacay! Hubi Firestore Rules. " + err.message);
            }
        };

        function loadAdminData(st) {
            const q = st ? query(collection(db, "web_reports"), where("status", "==", st)) : collection(db, "web_reports");
            onSnapshot(q, (snap) => {
                let listHtml = "";
                snap.forEach(d => {
                    const info = d.data();
                    let stRows = "";
                    info.students.forEach(s => {
                        stRows += `<tr class="border-b text-xs"><td>${s.id}</td><td>${s.name}</td><td>${s.mark}</td><td>${s.grade}</td></tr>`;
                    });
                    listHtml += `
                    <div class="bg-white p-6 rounded-3xl shadow-lg mb-8 border border-slate-200">
                        <div class="flex justify-between border-b pb-2 mb-4">
                            <div><h3 class="font-black text-indigo-900">${info.course.toUpperCase()}</h3><p class="text-[10px]">By ${info.teacher}</p></div>
                            <div>
                                ${(role=='HOD' && info.status=='PENDING_HOD') ? `<button onclick="updateDoc('${d.id}','PENDING_REG')" class="bg-green-600 text-white px-3 py-1 rounded font-bold">APPROVE</button> <button onclick="delDoc('${d.id}')" class="bg-red-400 text-white px-3 py-1 rounded font-bold">REJECT</button>` : ''}
                                ${(role=='REG' && info.status=='PENDING_REG') ? `<button onclick="updateDoc('${d.id}','APPROVED')" class="bg-indigo-950 text-white px-4 py-1 rounded font-bold uppercase underline">Final Approve</button>` : ''}
                            </div>
                        </div>
                        <table class="w-full text-left text-xs"><thead class="bg-slate-50"><tr><th>ID</th><th>Magaca</th><th>Dhibco</th><th>Grade</th></tr></thead><tbody>${stRows}</tbody></table>
                    </div>`;
                });
                document.getElementById('audit-list').innerHTML = listHtml;
            });
        }

        window.updateDoc = async (id, s) => { await updateDoc(doc(db, "web_reports", id), { status: s }); alert("Approved!"); };
        window.delDoc = async (id) => { await deleteDoc(doc(db, "web_reports", id)); alert("Rejected/Deleted"); };

        window.checkMyResult = async () => {
            const stId = document.getElementById('search-val').value.trim().toUpperCase();
            const snap = await getDocs(query(collection(db, "web_reports"), where("status", "==", "APPROVED")));
            let res = null;
            snap.forEach(d => { 
                let m = d.data().students.find(s => s.id.toUpperCase() === stId);
                if(m) res = { info: m, course: d.data().course };
            });

            const rDiv = document.getElementById('search-res');
            if(res) {
                rDiv.innerHTML = `<div class="p-6 bg-white border-t-8 border-indigo-950 rounded-2xl shadow mt-4 text-center">
                    <p class="font-black text-indigo-900 italic text-xl">${res.info.name}</p>
                    <p class="text-xs uppercase">${res.course}</p>
                    <div class="mt-4 bg-indigo-50 p-4 inline-block rounded-xl border border-indigo-200">
                        <span class="text-4xl font-black text-indigo-950">${res.info.grade}</span>
                        <p class="text-[10px]">Buundo</p>
                    </div>
                </div>`;
            } else { alert("ID Number lama helin ama wali lama ogolaan."); }
        };
    </script>
</head>
<body class="bg-gray-100 font-sans">
    
    <nav class="bg-indigo-950 p-4 text-white flex justify-between border-b-8 border-yellow-500 shadow-xl items-center sticky top-0 z-[100]">
        <h1 class="font-black text-2xl tracking-tighter flex items-center italic">KCTE <span class="bg-white text-indigo-950 px-1 ml-1 rounded">PORTAL</span></h1>
        <div id="u-info" class="text-xs uppercase font-bold text-yellow-500">Gateway</div>
        <button onclick="document.getElementById('std-m').classList.remove('hidden')" class="bg-yellow-500 text-indigo-900 px-6 py-2 rounded-full font-black text-xs italic tracking-tighter uppercase">HUBI GRADE-KA</button>
    </nav>

    <!-- LOGIN -->
    <div id="login-box" class="max-w-md mx-auto mt-20 p-10 bg-white rounded-3xl shadow-2xl border-t-8 border-indigo-950 animate-fade-in">
        <h2 class="text-2xl font-black text-center text-indigo-950 uppercase mb-8">Login Panel</h2>
        <input id="u" type="text" placeholder="Username (Staff)" class="w-full border-2 p-5 rounded-2xl mb-4 outline-none">
        <input id="p" type="password" placeholder="••••" class="w-full border-2 p-5 rounded-2xl mb-8 outline-none">
        <button onclick="login()" class="w-full bg-indigo-950 text-white py-5 rounded-2xl font-black text-xl hover:scale-95 shadow-xl transition-all">ENTER PORTAL</button>
    </div>

    <!-- DASHBOARD -->
    <div id="main-ui" class="hidden p-8 max-w-5xl mx-auto">
        <!-- TEACHER INPUT -->
        <div id="teacher-ui" class="hidden animate-fade-in">
            <div id="teacher-entry" class="hidden bg-white p-10 rounded-3xl shadow-xl border-t-8 border-green-500">
                <h3 class="text-2xl font-black mb-8 uppercase italic underline decoration-yellow-400">📝 Geli Buundooyinka</h3>
                <input id="c-name" type="text" placeholder="Magaca Maadada (EPSY 261)" class="w-full p-6 border rounded-2xl mb-6 font-bold text-xl uppercase tracking-widest bg-gray-50 outline-none focus:border-yellow-500">
                <div class="grid grid-cols-4 gap-2 mb-6">
                    <input id="st-id-input" placeholder="ID Number" class="border-2 p-4 rounded-xl">
                    <input id="st-name-input" placeholder="Ardayga" class="border-2 p-4 rounded-xl">
                    <input id="st-mark-input" placeholder="100%" class="border-2 p-4 rounded-xl text-center">
                    <input id="st-grade-input" placeholder="Grade" class="border-2 p-4 rounded-xl text-center uppercase">
                </div>
                <button onclick="addStudentRow()" class="bg-blue-600 text-white w-full py-4 rounded-2xl font-black mb-6 hover:bg-blue-700 uppercase tracking-tighter shadow-lg transform active:scale-90 transition-all text-xs">+ Ku dar saf kale</button>
                <div class="overflow-x-auto">
                   <table class="w-full text-left text-xs mb-8">
                       <thead class="bg-gray-100 italic"><tr><th>#</th><th>ID</th><th>Name</th><th>Score</th><th>Grade</th></tr></thead>
                       <tbody id="st-tbody"></tbody>
                   </table>
                </div>
                <button onclick="submitReport()" class="w-full bg-indigo-950 text-white py-6 rounded-3xl font-black text-3xl shadow-xl hover:bg-yellow-500 hover:text-indigo-950 transition-all uppercase italic italic shadow-indigo-100 active:scale-95">GUDBI NATIIJADA HADA</button>
            </div>
        </div>

        <div id="audit-list" class="max-w-2xl mx-auto mt-10"></div>
    </div>

    <!-- STUDENT MODAL -->
    <div id="std-m" class="hidden fixed inset-0 bg-indigo-950/95 flex items-center justify-center p-8 z-[200]">
        <div class="bg-slate-50 p-12 rounded-[4rem] w-full max-w-sm text-center border-t-[10px] border-yellow-500 shadow-2xl relative">
            <h2 class="text-3xl font-black text-indigo-950 uppercase italic leading-none">Ogow <span class="text-indigo-400">Buundadaada</span></h2>
            <p class="text-[9px] font-black text-slate-300 mt-2 mb-10 tracking-[0.4em]">Official KCTE Registry Check</p>
            <input id="search-val" type="text" placeholder="E.g SRLD/140/15" class="w-full p-8 rounded-[3.5rem] border-2 bg-white text-3xl font-black text-center mb-4 uppercase focus:border-yellow-500 shadow-inner">
            <button onclick="checkMyResult()" class="w-full bg-indigo-950 text-white p-7 rounded-[3rem] font-black text-2xl shadow-xl active:scale-95 transform transition hover:scale-105">BAADI (SEARCH)</button>
            <div id="search-res"></div>
            <button onclick="document.getElementById('std-m').classList.add('hidden')" class="mt-8 text-gray-400 text-xs font-black uppercase tracking-widest hover:text-red-600 transition underline decoration-2 decoration-gray-100">Exit ResultGate X</button>
        </div>
    </div>

</body>
</html>
