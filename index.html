<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KCTE MASTER SYSTEM v3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, getDocs, updateDoc, doc, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDoMZETvL5-oYm5wiP2dcbLm1p6ZfsgvjE",
            authDomain: "kctereg-online.firebaseapp.com",
            projectId: "kctereg-online",
            storageBucket: "kctereg-online.firebasestorage.app",
            messagingSenderId: "308277595556",
            appId: "1:308277595556:web:1b1814886668eda0310531"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let currentRole = "";

        // Function loogu talagalay inuu fahmo magacyada Column-ka kasta oo Excel-ka ku jira
        const getStudentInfo = (s) => {
            const keys = Object.keys(s);
            // Column 1aad: badanaa waa ID
            // Column 2aad: badanaa waa Name
            // Column 3aad: badanaa waa Grade
            return {
                id: s[keys[0]] || 'N/A',
                name: s[keys[1]] || 'N/A',
                grade: s[keys[2]] || 'N/A'
            };
        };

        window.login = () => {
            const user = document.getElementById('user').value.trim();
            const pass = document.getElementById('pass').value.trim();
            if(user === "Macalin114" && pass === "kctepass") renderUI('Teacher');
            else if(user === "D.head 5353" && pass === "headpass") renderUI('HOD');
            else if(user === "REG.12345" && pass === "regpass") renderUI('REG');
            else if(user === "dean12345" && pass === "deanpass") renderUI('Dean');
            else alert("Khalad!");
        };

        function renderUI(role) {
            currentRole = role;
            document.getElementById('login-box').classList.add('hidden');
            document.getElementById('dash-title').innerText = role + " DASHBOARD";
            document.getElementById('dashboard-ui').classList.remove('hidden');
            if(role === 'Teacher') document.getElementById('teacher-section').classList.remove('hidden');
            if(role === 'HOD') loadData('PENDING_HOD');
            if(role === 'REG') loadData('PENDING_REG');
            if(role === 'Dean') loadData(); 
        }

        let uploadedGrades = [];
        window.readExcel = (e) => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                const workbook = XLSX.read(ev.target.result, {type: 'binary'});
                uploadedGrades = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                alert(uploadedGrades.length + " Arday ayaa la helay!");
            };
            reader.readAsBinaryString(e.target.files[0]);
        };

        window.submitToHOD = async () => {
            if(uploadedGrades.length == 0) return alert("Soo geli Excel-ka!");
            await addDoc(collection(db, "grades"), {
                teacher: "Macalin114",
                students: uploadedGrades,
                status: "PENDING_HOD",
                at: new Date().toLocaleString()
            });
            alert("Loo diray HOD!"); location.reload();
        };

        function loadData(status) {
            const q = status ? query(collection(db, "grades"), where("status", "==", status)) : collection(db, "grades");
            onSnapshot(q, (snap) => {
                let h = "";
                snap.forEach(d => {
                    const data = d.data();
                    let studentRows = "";
                    // Halkaan waxaan ku hureynaa xogta dhabta ah ee gudaha Excel-ka
                    data.students.slice(0, 10).forEach(s => {
                        const info = getStudentInfo(s);
                        studentRows += `<tr><td class='border p-1 text-xs'>${info.id}</td><td class='border p-1 text-xs'>${info.name}</td><td class='border p-1 text-xs font-bold text-red-600'>${info.grade}</td></tr>`;
                    });

                    h += `<div class="bg-white p-4 border-2 mb-6 rounded shadow-xl">
                        <div class="flex justify-between mb-4">
                            <h3 class="font-black text-blue-900">${data.teacher} SUBMISSION (${data.status})</h3>
                            <div class="space-x-2">
                                ${(currentRole=='HOD' && data.status=='PENDING_HOD') ? `<button onclick="act('${d.id}', 'PENDING_REG')" class="bg-green-600 text-white px-3 py-1 rounded">Oggolaaw (HOD)</button>` : ""}
                                ${(currentRole=='REG' && data.status=='PENDING_REG') ? `<button onclick="act('${d.id}', 'APPROVED')" class="bg-indigo-950 text-white px-3 py-1 rounded">FINAL APPROVE</button>` : ""}
                                <button onclick="deleteDoc('${d.id}')" class="bg-red-400 text-white px-2 py-1 text-xs">Delete</button>
                            </div>
                        </div>
                        <table class="w-full border text-left text-sm">
                            <thead class="bg-gray-100"><tr><th class="p-1 border">ID (Col 1)</th><th class="p-1 border">Name (Col 2)</th><th class="p-1 border">Grade (Col 3)</th></tr></thead>
                            <tbody>${studentRows}</tbody>
                        </table>
                    </div>`;
                });
                document.getElementById('list-box').innerHTML = h || "Majiraan wax xog ah.";
            });
        }

        window.act = async (id, s) => { await updateDoc(doc(db, "grades", id), { status: s }); alert("Success!"); };
        
        window.studentSearch = async () => {
            const idInput = document.getElementById('student-id').value.trim();
            const q = query(collection(db, "grades"), where("status", "==", "APPROVED"));
            const snap = await getDocs(q);
            let found = null;
            snap.forEach(doc => {
                doc.data().students.forEach(s => {
                    const info = getStudentInfo(s);
                    if(String(info.id).trim() === idInput) found = info;
                });
            });
            if(found) {
                document.getElementById('result').innerHTML = `<div class="mt-4 p-4 bg-yellow-100 border-2 border-yellow-600 rounded">
                    <p class="font-bold">Student: ${found.name}</p>
                    <h2 class="text-3xl font-black">Grade: ${found.grade}</h2>
                </div>`;
            } else {
                alert("Lama helin arday oggolaansho leh oo ID-gaan leh.");
            }
        };
    </script>
</head>
<body class="bg-slate-100">
    <nav class="bg-indigo-950 p-4 text-white font-bold flex justify-between items-center shadow-2xl">
        <span>KCTE SYSTEM</span>
        <button onclick="document.getElementById('st-modal').classList.remove('hidden')" class="bg-yellow-500 text-indigo-900 px-4 py-1 rounded text-xs font-black shadow">ARDAYDA</button>
    </nav>

    <!-- LOGIN SECTION -->
    <div id="login-box" class="max-w-xs mx-auto mt-20 bg-white p-8 rounded shadow-2xl border-t-8 border-indigo-950">
        <h2 class="font-bold mb-4">STAFF LOGIN</h2>
        <input id="user" type="text" placeholder="Username" class="w-full border p-3 rounded mb-4">
        <input id="pass" type="password" placeholder="Password" class="w-full border p-3 rounded mb-4">
        <button onclick="login()" class="w-full bg-indigo-950 text-white p-3 rounded font-bold">GASHID</button>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard-ui" class="hidden p-6 max-w-4xl mx-auto">
        <h2 id="dash-title" class="text-2xl font-black mb-8 border-l-8 border-yellow-500 pl-4 uppercase">DASHBOARD</h2>
        <div id="teacher-section" class="hidden bg-white p-6 rounded shadow mb-8">
            <h3 class="font-bold mb-4 underline">SUBMIT EXCEL (MACALIN)</h3>
            <input type="file" onchange="readExcel(event)" class="text-xs">
            <button onclick="submitToHOD()" class="bg-blue-800 text-white px-4 py-2 mt-4 rounded shadow font-bold">Gudbi faylka</button>
        </div>
        <div id="list-box"></div>
    </div>

    <!-- STUDENT MODAL -->
    <div id="st-modal" class="hidden fixed inset-0 bg-indigo-950/90 flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-3xl w-full max-w-sm">
            <h2 class="font-black text-center text-lg mb-6 text-indigo-950 uppercase">KAEEG BUUNDADA</h2>
            <input id="student-id" type="text" placeholder="GELI ID-gaaga" class="w-full border-2 p-4 rounded-xl mb-4 text-center text-xl font-bold border-indigo-950 outline-none">
            <button onclick="studentSearch()" class="w-full bg-indigo-950 text-white p-4 rounded-xl font-bold hover:bg-yellow-500 hover:text-indigo-950 transition">SEARCH</button>
            <div id="result" class="text-center"></div>
            <button onclick="document.getElementById('st-modal').classList.add('hidden')" class="w-full mt-4 text-xs underline text-gray-400">XIR</button>
        </div>
    </div>
</body>
</html>
