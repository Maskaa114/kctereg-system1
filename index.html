<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KCTE UNIVERSAL SYSTEM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, getDocs, updateDoc, doc, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDoMZETvL5-oYm5wiP2dcbLm1p6ZfsgvjE",
            authDomain: "kctereg-online.firebaseapp.com",
            projectId: "kctereg-online",
            storageBucket: "kctereg-online.firebasestorage.app",
            messagingSenderId: "308277595556",
            appId: "1:308277595556:web:1b1814886668eda0310531"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let currentUserRole = "";
        let excelRows = [];

        window.login = () => {
            const u = document.getElementById('u').value.trim();
            const p = document.getElementById('p').value.trim();
            if(u === "Macalin114" && p === "kctepass") start("Teacher");
            else if(u === "D.head 5353" && p === "headpass") start("HOD");
            else if(u === "REG.12345" && p === "regpass") start("REG");
            else if((u === "dean12345" || u === "v.dean1") && p === "deanpass") start("Dean");
            else alert("Gashidka waa qalad!");
        };

        function start(r) {
            currentUserRole = r;
            document.getElementById('login-box').classList.add('hidden');
            document.getElementById('nav-role').innerText = r;
            document.getElementById('app-ui').classList.remove('hidden');
            if(r === "Teacher") document.getElementById('teacher-view').classList.remove('hidden');
            if(r === "HOD") loadData('PENDING_HOD');
            if(r === "REG") loadData('PENDING_REG');
            if(r === "Dean") loadData();
        }

        // EXCEL ENGINE: AQBALA WAX KASTA (NO FILTERS)
        window.loadExcelFile = (e) => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = (evt) => {
                const workbook = XLSX.read(evt.target.result, { type: 'binary' });
                const firstSheet = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheet];
                // Sida uu u qoran yahay Excel-ku saf iyo qol kasta u qaado
                excelRows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                
                alert("Waa la aqriyey Excel-ka! Safafka la helay: " + excelRows.length);
                renderPreviewTable();
            };
            reader.readAsBinaryString(file);
        };

        function renderPreviewTable() {
            let h = "";
            excelRows.slice(0, 10).forEach(row => {
                h += `<tr class='border-b'>${row.map(c => `<td class='p-1 border text-[8px] whitespace-nowrap'>${c||""}</td>`).join("")}</tr>`;
            });
            document.getElementById('p-body').innerHTML = h;
        }

        window.submitExcel = async () => {
            const subject = document.getElementById('subject').value.trim();
            if(!subject || excelRows.length == 0) return alert("Magaca Maadada qor oo Excel geli!");
            
            await addDoc(collection(db, "dynamic_grades"), {
                instructor: "Macalin114",
                subject: subject.toUpperCase(),
                fullData: excelRows, // Xogta dhabta ah ee Excel-ka
                status: "PENDING_HOD",
                date: new Date().toLocaleString()
            });
            alert("Report-ka waa la gudbiyey!");
            location.reload();
        };

        function loadData(stFilter) {
            const q = stFilter ? query(collection(db, "dynamic_grades"), where("status", "==", stFilter)) : collection(db, "dynamic_grades");
            onSnapshot(q, (snap) => {
                let html = "";
                snap.forEach(docSnap => {
                    const info = docSnap.data();
                    let rowsH = "";
                    // Muuji Table-ka dhabta ah ee Excel-ka (Safafka hore ee muhiimka ah)
                    info.fullData.slice(0, 20).forEach(row => {
                        rowsH += `<tr>${row.map(c => `<td class='border p-1'>${c||""}</td>`).join("")}</tr>`;
                    });

                    html += `
                    <div class='bg-white p-6 rounded-3xl shadow-xl mb-8 border-l-[15px] border-indigo-950'>
                        <div class='flex justify-between items-center border-b pb-4 mb-4'>
                            <div><h2 class='font-black text-xl'>${info.subject}</h2><p class='text-[10px] uppercase font-bold text-gray-400'>Teacher: ${info.instructor}</p></div>
                            <div class='flex gap-2'>
                                ${(currentUserRole == 'HOD' && info.status == 'PENDING_HOD') ? `<button onclick="act('${docSnap.id}','PENDING_REG')" class='bg-green-600 text-white px-4 py-2 rounded-lg text-xs font-bold shadow'>Approve</button> <button onclick="del('${docSnap.id}')" class='bg-red-500 text-white px-4 py-2 rounded-lg text-xs'>Reject</button>` : ""}
                                ${(currentUserRole == 'REG' && info.status == 'PENDING_REG') ? `<button onclick="act('${docSnap.id}','APPROVED')" class='bg-indigo-950 text-white px-8 py-2 rounded-lg text-xs font-bold uppercase'>Publish (REG APPROVE)</button>` : ""}
                                <span class='p-2 bg-slate-50 text-[10px] font-black rounded uppercase'>${info.status}</span>
                            </div>
                        </div>
                        <div class='overflow-x-auto border rounded-xl max-h-80'>
                            <table class='w-full text-left text-[9px]'><tbody class='divide-y'>${rowsH}</tbody></table>
                        </div>
                    </div>`;
                });
                document.getElementById('list-box').innerHTML = html;
            });
        }

        window.act = async (id, s) => { await updateDoc(doc(db, "dynamic_grades", id), { status: s }); alert("Talaabadii waa guuleysatay!"); };
        window.del = async (id) => { if(confirm("Hubi inaad tirtirto?")) await deleteDoc(doc(db, "dynamic_grades", id)); };

        // --- ARDAY CHECKER: SEARCH ACROSS ALL EXCEL CELLS ---
        window.studentCheck = async () => {
            const idVal = document.getElementById('search-val').value.trim().toUpperCase().replace(/\s+/g, '');
            if(!idVal) return alert("Fadlan qor ID SRLD-gaaga!");
            
            const rDiv = document.getElementById('st-res');
            rDiv.innerHTML = "Hubinta ayaa socota...";

            const q = query(collection(db, "dynamic_grades"), where("status", "==", "APPROVED"));
            const snap = await getDocs(q);
            let matchRow = null; let matchSubject = "";

            snap.forEach(dSnap => {
                const allData = dSnap.data().fullData;
                allData.forEach(row => {
                    // Search: Haday ID-ga ardaygu ku jirto "Safka kasta" - unug kasta eeg
                    const rowString = row.join("|").toUpperCase().replace(/\s+/g, '');
                    if(rowString.includes(idVal)) {
                        matchRow = row;
                        matchSubject = dSnap.data().subject;
                    }
                });
            });

            if(matchRow) {
                let cellHtml = matchRow.map(c => `<div class='bg-white p-4 border rounded-xl shadow-sm'><span class='block text-[8px] text-gray-300 font-bold'>DATA CELL</span><p class='font-black text-indigo-950 uppercase'>${c||"EMPTY"}</p></div>`).join("");
                rDiv.innerHTML = `
                    <div class='mt-6 p-8 bg-indigo-50 border-t-8 border-indigo-900 rounded-[2.5rem] animate-fade-in'>
                        <h2 class='text-2xl font-black text-indigo-950 mb-1'>${matchSubject}</h2>
                        <p class='text-xs uppercase font-bold text-gray-400 mb-6'>KCTE Official Match Record</p>
                        <div class='grid grid-cols-2 md:grid-cols-3 gap-2'>${cellHtml}</div>
                        <p class='mt-6 text-[10px] text-green-600 font-black italic tracking-widest uppercase italic'>System Verified Card ✓</p>
                    </div>`;
            } else { rDiv.innerHTML = `<p class='mt-6 p-4 bg-red-100 text-red-600 rounded-xl font-bold uppercase text-[9px]'>ID-ga SRLD (${idVal}) wali xog lama oggolaan (HOD/REG) ama laguma helin database-ka.</p>`; }
        };

    </script>
</head>
<body class="bg-slate-50 font-sans tracking-tight">

    <nav class="bg-indigo-950 p-6 flex justify-between items-center text-white border-b-8 border-yellow-500 shadow-2xl sticky top-0 z-[500]">
        <h1 class="text-2xl font-black tracking-tighter uppercase italic">KCTE <span class="bg-white text-indigo-900 px-1 rounded-sm not-italic">PORTAL</span></h1>
        <div id="nav-role" class="text-[10px] font-black uppercase text-yellow-500 bg-white/5 border px-4 py-1 rounded-full italic italic">Online Admin</div>
        <button onclick="document.getElementById('m').classList.remove('hidden')" class="bg-yellow-500 text-indigo-900 px-8 py-2 rounded-full font-black text-xs hover:bg-white uppercase tracking-tighter shadow-xl transform active:scale-90 transition-all italic">CHECK GRADE</button>
    </nav>

    <!-- LOGIN -->
    <div id="login-box" class="max-w-md mx-auto mt-20 p-12 bg-white rounded-[3.5rem] shadow-2xl text-center border-t-8 border-indigo-950 animate-fade-in">
        <h2 class="text-3xl font-black mb-1 leading-none text-indigo-950 uppercase italic italic">STAFF ACCESS</h2>
        <p class="text-[10px] text-slate-300 font-bold uppercase mb-10 tracking-widest">OFFICIAL ACADEMIC LOGIN</p>
        <div class="space-y-4">
            <input id="u" type="text" placeholder="Magaca Gashidka (e.g Macalin114)" class="w-full bg-gray-50 border-2 p-5 rounded-2xl outline-none focus:border-yellow-500 font-bold italic tracking-tighter shadow-inner">
            <input id="p" type="password" placeholder="Pass-key (Security)" class="w-full bg-gray-50 border-2 p-5 rounded-2xl outline-none focus:border-yellow-500 text-center font-black tracking-widest text-4xl mb-4">
            <button onclick="login()" class="w-full bg-indigo-950 text-white p-5 rounded-3xl font-black text-2xl hover:scale-[1.02] shadow-xl uppercase italic tracking-tighter active:scale-95 transition-all italic">Diri xogta Portal-ka</button>
        </div>
    </div>

    <!-- MAIN APP DASHBOARD -->
    <div id="app-ui" class="hidden p-8 lg:p-16 max-w-7xl mx-auto">
        
        <div id="teacher-view" class="hidden mb-16">
            <div class="bg-white p-12 rounded-[4.5rem] shadow-2xl border-t-[12px] border-green-500 relative overflow-hidden">
                <h3 class="text-4xl font-black mb-10 text-indigo-950 uppercase italic decoration-yellow-500 underline underline-offset-8 decoration-8">Gudbi Excel Maada kasta</h3>
                <input id="subject" type="text" placeholder="E.g SUBJECT - EPSY 261" class="w-full border-4 p-8 rounded-3xl font-black text-3xl outline-none bg-gray-50 focus:border-indigo-950 uppercase text-center mb-8 shadow-inner italic">
                <div class="p-12 border-4 border-dashed rounded-[3rem] border-indigo-100 bg-slate-50 text-center mb-8 hover:bg-white transition-all group">
                     <p class="font-bold text-xs uppercase opacity-30 mb-8 italic italic underline italic">AQBALA EXCEL KASTA: MA MAGAC, ID, GRADE BAAD KA COPIES-GAREYSAY EXCEL-KAAGII? ISAGAOO SAAS AH BUU GALAYA.</p>
                     <input type="file" onchange="loadExcelFile(event)" accept=".xlsx, .xls" class="mb-4 block mx-auto text-xs file:bg-indigo-950 file:text-white file:rounded-full file:px-8 file:py-2">
                </div>
                <div class="overflow-x-auto max-h-60 border rounded-2xl mb-8">
                     <table class="w-full text-[10px] text-left">
                        <thead class="bg-white sticky top-0 font-black"><tr><th class="p-2 border uppercase">Preview Table Content</th></tr></thead>
                        <tbody id="p-body"></tbody>
                     </table>
                </div>
                <button onclick="submitExcel()" class="w-full bg-indigo-950 text-white p-8 rounded-[3.5rem] font-black text-3xl hover:bg-yellow-500 hover:text-indigo-900 transition-all uppercase italic shadow-2xl active:scale-95 transform shadow-indigo-100 italic italic">GUDUBI Hubinta (SUBMIT)</button>
            </div>
        </div>

        <div id="list-box" class="max-w-4xl mx-auto"></div>
    </div>

    <!-- STUDENT MODAL: SEARCH (UNIVERSAL ID) -->
    <div id="m" class="hidden fixed inset-0 bg-indigo-950/98 backdrop-blur-3xl flex items-center justify-center p-8 z-[1000] animate-fade-in">
        <div class="bg-white p-16 rounded-[4.5rem] w-full max-w-lg shadow-[0_50px_100px_-20px_rgba(0,0,0,0.6)] border-t-[20px] border-yellow-500 relative text-center">
             <h2 class="text-5xl font-black text-indigo-950 uppercase tracking-tighter leading-none mb-1">Xarun <span class="text-yellow-600 underline decoration-indigo-950 decoration-4 italic">Natiijo</span></h2>
             <p class="text-[9px] font-black text-slate-300 mb-10 tracking-[0.4em] uppercase underline decoration-gray-50 underline-offset-4 decoration-2 italic">Student Results Self-Service</p>
             <input id="search-val" type="text" placeholder="E.g 140 or SRLD/140/15" class="w-full border-4 bg-gray-50 p-8 rounded-[3.5rem] font-black text-4xl text-center text-indigo-950 shadow-inner focus:border-yellow-500 outline-none uppercase placeholder:opacity-10 mb-6">
             <button onclick="studentCheck()" class="w-full bg-indigo-950 text-white p-8 rounded-[3.5rem] font-black text-2xl shadow-xl hover:scale-105 active:scale-95 transition-all uppercase tracking-tighter italic shadow-indigo-300 italic">Ka Baadi Database-ka (SEARCH)</button>
             <div id="st-res" class="min-h-[200px]"></div>
             <button onclick="document.getElementById('m').classList.add('hidden')" class="mt-8 text-gray-300 font-bold uppercase text-[9px] hover:text-red-500 tracking-[0.5em] italic border-b border-gray-100 pb-2">Close X Search Access</button>
        </div>
    </div>

</body>
</html>
