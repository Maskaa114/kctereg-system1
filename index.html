<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KCTE STUDENT PORTAL - SIMPLE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, getDocs, updateDoc, doc, onSnapshot, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDoMZETvL5-oYm5wiP2dcbLm1p6ZfsgvjE",
            authDomain: "kctereg-online.firebaseapp.com",
            projectId: "kctereg-online",
            storageBucket: "kctereg-online.firebasestorage.app",
            messagingSenderId: "308277595556",
            appId: "1:308277595556:web:1b1814886668eda0310531"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let studentIdSession = "";

        // --- 1. PORTAL LOGIN (Dual Staff & Student) ---
        window.portalLogin = async () => {
            const u = document.getElementById('login-u').value.trim().toUpperCase().replace(/\s+/g,'');
            const p = document.getElementById('login-p').value.trim();

            if(u === "MACALIN114" && p === "kctepass") return renderDash("Macalin");
            if(u === "D.HEAD5353" && p === "headpass") return renderDash("HOD");
            if(u === "REG.12345" && p === "regpass") return renderDash("REG");
            if(u === "DEAN12345" && p === "deanpass") return renderDash("Dean");

            // Student Login Check
            const q = query(collection(db, "users"), where("sid", "==", u), where("pass", "==", p));
            const snap = await getDocs(q);
            if (!snap.empty) {
                studentIdSession = u;
                renderDash("Arday");
            } else { alert("Login failed! Xogtaadu wali maysan galin ama password baa khaldan."); }
        };

        function renderDash(role) {
            document.getElementById('start-view').classList.add('hidden');
            document.getElementById('login-area').classList.add('hidden');
            document.getElementById('app-content').classList.remove('hidden');
            document.getElementById('user-role-label').innerText = role;

            if(role === 'Macalin') document.getElementById('teacher-section').classList.remove('hidden');
            if(role === 'Arday') showMyResults();
            if(['HOD','REG','Dean'].includes(role)) loadOfficialAudit(role);
        }

        // --- 2. TEACHER COPY/PASTE LOGIC ---
        let teacherData = [];
        window.onPasteExcel = (e) => {
            const lines = e.target.value.split("\n");
            teacherData = [];
            lines.forEach(l => {
                const c = l.split("\t");
                if(c.length >= 3){
                    let name = (c[1] || "").split("+")[0].split("=")[0].trim();
                    let sid = (c[2] || "").toUpperCase().replace(/\s+/g,'');
                    let mark = c.find(val => !isNaN(val) && val != "" && val.length >= 1) || "0";
                    let grade = c[c.length-1].toUpperCase().trim() || "F";
                    if(name && !name.toLowerCase().includes("name")) teacherData.push({name, sid, mark, grade});
                }
            });
            document.getElementById('p-info').innerText = `Diyaar: ${teacherData.length} Arday.`;
        };

        window.submitSub = async () => {
            const sub = document.getElementById('sub-name').value;
            if(!sub || teacherData.length == 0) return alert("Subject-ga iyo Xogta Excel!");
            await addDoc(collection(db, "v8_final_grades"), {
                subject: sub.toUpperCase(), instructor: "Macalin114",
                records: teacherData, status: "PENDING_HOD", time: new Date().toLocaleString()
            });
            alert("Report sent to Head!"); location.reload();
        };

        // --- 3. STUDENT REGISTRATION (ONLY 2 INPUTS) ---
        window.studentCreateAccount = async () => {
            const sid = document.getElementById('st-id-create').value.trim().toUpperCase().replace(/\s+/g,'');
            const pass = document.getElementById('st-pass-create').value.trim();
            if(!sid || !pass) return alert("Fadlan ID-gaaga iyo Password xulo!");

            const snap = await getDocs(query(collection(db, "v8_final_grades"), where("status", "==", "APPROVED")));
            let isValidId = false;
            snap.forEach(d => { if(d.data().records.find(r => r.sid === sid)) isValidId = true; });

            if(isValidId) {
                await setDoc(doc(db, "users", sid), { sid, pass });
                alert("Akoonkaaga waa diyaar! Hadda Sign In dheh adigoo ID-gaaga u isticmaalaya Username.");
                location.reload();
            } else { alert("ID-gan looma ogolaan karo akoon ilaa Registration-ku dhameystiro."); }
        };

        // --- 4. DISPLAY RESULTS FOR STUDENT ---
        async function showMyResults() {
            document.getElementById('student-results-view').classList.remove('hidden');
            const snap = await getDocs(query(collection(db, "v8_final_grades"), where("status", "==", "APPROVED")));
            let html = "";
            snap.forEach(d => {
                const s = d.data().records.find(r => r.sid === studentIdSession);
                if(s) {
                    html += `<div class='bg-white p-8 rounded-[2.5rem] shadow-xl border-t-8 border-indigo-900 mb-6 text-center animate-fade-in'>
                        <h2 class='text-[10px] font-black text-slate-300 uppercase'>Institutional Result Card</h2>
                        <h1 class='text-4xl font-black text-indigo-950 mt-2 uppercase'>${s.name}</h1>
                        <p class='text-xs font-bold text-gray-500 uppercase italic'>Subject: ${d.data().subject}</p>
                        <div class='grid grid-cols-2 gap-4 mt-8'>
                            <div class='bg-gray-50 p-6 rounded-3xl border'><span class='text-[8px] font-bold opacity-30'>Wadarta Mark-ka</span><h2 class='text-4xl font-black'>100/${s.mark}</h2></div>
                            <div class='bg-indigo-950 text-white p-6 rounded-3xl border-b-8 border-yellow-500 shadow-xl'><span class='text-[8px] font-bold italic opacity-40'>LETTER GRADE</span><h2 class='text-6xl font-black underline decoration-yellow-400 decoration-4'>${s.grade}</h2></div>
                        </div>
                    </div>`;
                }
            });
            document.getElementById('results-list').innerHTML = html || "<p class='p-10 italic text-center'>Xog Approved ah laguma hayo ID-gaaga.</p>";
        }

        // --- 5. MANAGEMENT AUDIT & PASSWORD RESET ---
        function loadOfficialAudit(role){
            const q = role==='Dean' ? collection(db,"v8_final_grades") : query(collection(db,"v8_final_grades"), where("status","==",(role==='HOD'?'PENDING_HOD':'PENDING_REG')));
            onSnapshot(q, snap => {
                let listHtml = "";
                snap.forEach(dSnap => {
                    const d = dSnap.data();
                    let stRows = "";
                    d.records.forEach(st => stRows += `<tr><td>${st.sid}</td><td>${st.name}</td><td class="font-bold">${st.mark}</td><td class="text-red-600 font-bold">${st.grade}</td></tr>`);
                    listHtml += `<div class='bg-white p-6 rounded-2xl shadow-xl mb-6 border-l-[12px] border-indigo-900 animate-fade-in'>
                        <div class='flex justify-between border-b pb-4'>
                            <div><h3 class='font-black'>${d.subject}</h3><p class='text-[9px] uppercase'>Inst: ${d.instructor}</p></div>
                            <div class='flex gap-1 h-fit'>
                                ${(role==='HOD'&&d.status==='PENDING_HOD') ? `<button onclick="actionSt('${dSnap.id}','PENDING_REG')" class='bg-green-600 text-white px-3 py-1 rounded font-bold text-xs'>Ogolow</button>` : ""}
                                ${(role==='REG'&&d.status==='PENDING_REG') ? `<button onclick="actionSt('${dSnap.id}','APPROVED')" class='bg-blue-800 text-white px-5 py-2 rounded-xl font-black text-xs underline'>FINAL APPROVAL</button>` : ""}
                                <span class='p-1 bg-yellow-50 text-[10px] font-bold'>${d.status}</span>
                            </div>
                        </div>
                        <details class="text-[9px] mt-2 italic"><summary>Student List</summary><table class='w-full text-left'>${stRows}</table></details>
                    </div>`;
                });
                document.getElementById('audit-list-area').innerHTML = listHtml;
            });
            if(role === 'REG') document.getElementById('pass-manager').classList.remove('hidden');
        }
        window.actionSt = async(id,s) => { await updateDoc(doc(db,"v8_final_grades",id), { status:s }); alert("Done!"); };
        
        onSnapshot(collection(db, "users"), snap => {
            let h = "";
            snap.forEach(d => h += `<div class="p-2 border-b flex justify-between"><span class="text-xs">${d.id}</span> <button onclick="resPW('${d.id}')" class="bg-red-500 text-white px-2 py-1 rounded text-[8px]">Reset 123</button></div>`);
            document.getElementById('reset-box').innerHTML = h;
        });
        window.resPW = async(u) => { await updateDoc(doc(db, "users", u), { pass: "123" }); alert("Pass reset to 123"); };

    </script>
</head>
<body class="bg-gray-100 font-sans tracking-tighter overflow-x-hidden text-indigo-950">

    <!-- LANDING VIEW (For Ardayda First) -->
    <div id="start-view" class="fixed inset-0 bg-indigo-950 flex flex-col items-center justify-center p-8 z-[200]">
        <h1 class="text-7xl font-black text-white italic tracking-widest leading-none mb-10">KCTE HUB</h1>
        <button onclick="document.getElementById('start-view').classList.add('hidden'); document.getElementById('login-area').classList.remove('hidden');" class="bg-white text-indigo-900 px-24 py-10 rounded-[4rem] font-black text-4xl shadow-2xl hover:scale-105 active:scale-95 transition-all">KA EEG BUUNDADA ➜</button>
        <button onclick="document.getElementById('start-view').classList.add('hidden'); document.getElementById('login-area').classList.remove('hidden');" class="mt-12 text-yellow-500 underline text-xs font-bold uppercase tracking-[0.4em] opacity-60">Management Staff Access</button>
    </div>

    <nav id="portal-nav" class="hidden bg-indigo-950 p-6 flex justify-between border-b-[8px] border-yellow-500 text-white sticky top-0 z-[500] items-center">
        <h1 class="text-2xl font-black italic">KCTE Hub</h1>
        <span id="user-role-label" class="bg-indigo-900 border border-white/20 px-4 py-1 rounded-full text-[9px] font-black text-yellow-400 uppercase tracking-widest">Portal Access</span>
    </nav>

    <!-- SIGN IN & SIGN UP (Simple Two Field Boxes) -->
    <div id="login-area" class="hidden max-w-sm mx-auto mt-20 p-10 bg-white rounded-[4rem] shadow-2xl border-t-8 border-indigo-950 text-center animate-fade-in italic">
        <h2 class="text-4xl font-black mb-10 tracking-tighter uppercase italic italic">PORTAL LOGIN</h2>
        <input id="login-u" placeholder="ID No (e.g SRLD/140/15)" class="w-full bg-slate-50 border p-5 rounded-3xl mb-4 font-black tracking-widest uppercase">
        <input id="login-p" type="password" placeholder="Pass-key" class="w-full bg-slate-50 border p-5 rounded-3xl mb-10 font-bold text-center text-4xl shadow-inner">
        <button onclick="portalLogin()" class="w-full bg-indigo-950 text-white p-6 rounded-3xl font-black text-xl hover:shadow-indigo-300 transition active:scale-90 uppercase">Gal Nidaamka Hub Hub</button>
        <div class="mt-12 border-t pt-8">
            <p class="text-[10px] text-gray-400 font-bold mb-3 uppercase">Cusub Arday ah? Akoon maba leedahay?</p>
            <button onclick="document.getElementById('modal-up').classList.remove('hidden')" class="bg-yellow-500 text-indigo-950 px-6 py-2 rounded-full font-black text-xs italic tracking-tight underline">CREATE MY ACCOUNT HADA</button>
        </div>
    </div>

    <!-- MAIN PORTAL WRAPPER -->
    <div id="app-content" class="hidden p-8 lg:p-12 max-w-5xl mx-auto italic italic">
        
        <!-- TEACHER -->
        <div id="teacher-section" class="hidden animate-fade-in">
             <div class="bg-white p-12 rounded-[5rem] shadow-2xl text-center border-t-[15px] border-green-500 mb-10">
                <input id="sub-name" placeholder="Subject EPSY 261" class="w-full p-8 border bg-slate-50 rounded-3xl mb-8 font-black text-4xl text-center outline-none focus:border-indigo-900 uppercase italic">
                <textarea oninput="onPasteExcel(event)" placeholder="Halkan midig-guji ka dibna Paste xogtii Excel..." class="w-full h-40 border p-5 rounded-3xl text-[9px] mb-4 outline-none italic tracking-[0.15em] bg-indigo-50/20"></textarea>
                <p id="p-info" class="text-indigo-950 font-black mb-8 italic uppercase"></p>
                <button onclick="submitSub()" class="w-full bg-indigo-950 text-white p-8 rounded-[4rem] font-black text-4xl shadow-2xl hover:scale-105 active:scale-95 transition">GUDBI NATIIJADA Hub</button>
             </div>
        </div>

        <!-- ARDAY RESULT LIST -->
        <div id="student-results-view" class="hidden">
             <h2 class="text-5xl font-black text-indigo-950 mb-10 uppercase italic underline underline-offset-8 decoration-yellow-400 decoration-8">Dashboard Card</h2>
             <div id="results-list"></div>
        </div>

        <div id="audit-list-area"></div>

        <!-- REG PASS MANAGER -->
        <div id="pass-manager" class="hidden bg-white p-8 rounded-3xl border-t-[10px] border-red-600 shadow-xl mt-12">
            <h4 class="font-black text-red-600 mb-4 underline">DIB U HABAYNTA PASSWORD-KA</h4>
            <div id="reset-box"></div>
        </div>
    </div>

    <!-- SIGN UP MODAL (2 INPUTS) -->
    <div id="modal-up" class="hidden fixed inset-0 bg-indigo-950/98 backdrop-blur-3xl flex items-center justify-center p-8 z-[1100] italic">
        <div class="bg-slate-100 p-12 rounded-[4rem] w-full max-w-sm text-center shadow-2xl border-t-[20px] border-yellow-500">
             <h2 class="text-4xl font-black text-indigo-950 mb-1 tracking-tighter uppercase italic">STUDENT SIGN UP</h2>
             <p class="text-[9px] font-black text-slate-300 mb-10 uppercase tracking-widest border-b pb-4 decoration-indigo-200 leading-none">Register With 2 Fields Only</p>
             <input id="st-id-create" placeholder="ENTER SRLD ID (E.g SRLD/141/15)" class="w-full bg-white p-6 border rounded-2xl mb-4 font-black text-center text-indigo-950 uppercase shadow-inner italic">
             <input id="st-pass-create" type="password" placeholder="CHOOSE PASSWORD" class="w-full bg-white p-6 border rounded-2xl mb-8 font-black text-center text-4xl shadow-inner">
             <button onclick="studentCreateAccount()" class="w-full bg-indigo-950 text-white p-7 rounded-[2.5rem] font-black text-2xl hover:scale-105 active:scale-90 transition-all uppercase">REGISTER MY DATA HADA</button>
             <button onclick="document.getElementById('modal-up').classList.add('hidden')" class="mt-8 text-slate-400 text-[10px] font-bold uppercase underline">Close Gateway</button>
        </div>
    </div>

</body>
</html>
