<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KCTE MASTER PORTAL - OFFICIAL v3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, getDocs, updateDoc, doc, onSnapshot, deleteDoc, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDoMZETvL5-oYm5wiP2dcbLm1p6ZfsgvjE",
            authDomain: "kctereg-online.firebaseapp.com",
            projectId: "kctereg-online",
            storageBucket: "kctereg-online.firebasestorage.app",
            messagingSenderId: "308277595556",
            appId: "1:308277595556:web:1b1814886668eda0310531"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let role = "";
        let finalData = [];

        window.login = () => {
            const u = document.getElementById('u').value.trim();
            const p = document.getElementById('p').value.trim();
            if(u === "Macalin114" && p === "kctepass") startUI("Teacher");
            else if(u === "D.head 5353" && p === "headpass") startUI("HOD");
            else if(u === "REG.12345" && p === "regpass") startUI("REG");
            else if(u === "dean12345" && p === "deanpass") startUI("Dean");
            else alert("ID ama Password khalad ah!");
        };

        function startUI(r) {
            role = r;
            document.getElementById('login-box').style.display = "none";
            document.getElementById('nav-role').innerText = r;
            document.getElementById('app-div').classList.remove('hidden');
            if(r === "Teacher") document.getElementById('teacher-view').classList.remove('hidden');
            if(r === "HOD") loadAdmin('PENDING_HOD');
            if(r === "REG") loadAdmin('PENDING_REG');
            if(r === "Dean") loadAdmin();
        }

        window.cleanAndParse = (e) => {
            const rawText = e.target.value;
            const rows = rawText.split("\n");
            finalData = [];
            rows.forEach(line => {
                if (line.trim() === "") return;
                const cols = line.split("\t");
                if (cols.length < 3) return;

                // Raadi unugga (Cell) ka dhex jira Excel ee u eg ID-ga SRLD
                let sId = cols.find(c => String(c).toUpperCase().includes("/") && (String(c).toUpperCase().includes("RLD") || String(c).toUpperCase().includes("0"))) || "N/A";
                let sName = cols.find(c => isNaN(c) && !c.includes("/") && c.length > 5) || cols[0];
                let sMark = cols.find(c => !isNaN(c) && c !== "") || "0";
                let sGrade = cols[cols.length-1].toUpperCase();

                if(sId !== "ID NO" && !sId.includes("Students Name")) {
                    finalData.push({ 
                        name: String(sName).split("+")[0].trim(), 
                        id: sId.toUpperCase().replace(/\s+/g, ''), 
                        mark: sMark, 
                        grade: sGrade 
                    });
                }
            });
            document.getElementById('p-info').innerText = "Waa la sifeeyay " + finalData.length + " Arday.";
            renderTable();
        };

        function renderTable() {
            let h = "";
            finalData.forEach(s => {
                h += `<tr class='border-b'><td>${s.name}</td><td>${s.id}</td><td>${s.mark}</td><td class='font-bold'>${s.grade}</td></tr>`;
            });
            document.getElementById('p-body').innerHTML = h;
        }

        window.sendCloud = async () => {
            const subj = document.getElementById('subj').value.trim();
            if(!subj || finalData.length == 0) return alert("Course name & paste data!");
            await addDoc(collection(db, "final_records"), {
                instructor: "Macalin114",
                subject: subj.toUpperCase(),
                students: finalData,
                status: "PENDING_HOD",
                date: new Date().toLocaleString()
            });
            alert("Report sent!"); location.reload();
        };

        function loadAdmin(st) {
            const q = st ? query(collection(db, "final_records"), where("status", "==", st)) : collection(db, "final_records");
            onSnapshot(q, (snap) => {
                let html = "";
                snap.forEach(d => {
                    const info = d.data();
                    let stRows = "";
                    info.students.forEach(s => {
                        stRows += `<tr class='border-b'><td>${s.id}</td><td>${s.name}</td><td>${s.mark}%</td><td class='font-black text-red-600'>${s.grade}</td></tr>`;
                    });
                    html += `<div class='bg-white p-6 rounded-3xl shadow-xl mb-6 border-l-[15px] border-indigo-950 animate-fade-in'>
                        <div class='flex justify-between border-b pb-4 mb-4'>
                            <div><h3 class='font-black text-2xl'>${info.subject}</h3><p class='text-[10px]'>Teacher: ${info.instructor} | Date: ${info.date}</p></div>
                            <div class='flex gap-2 h-fit'>
                                ${(role=='HOD' && info.status=='PENDING_HOD') ? `<button onclick="actDoc('${d.id}','PENDING_REG')" class='bg-green-600 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-lg'>Approve</button>` : ""}
                                ${(role=='REG' && info.status=='PENDING_REG') ? `<button onclick="actDoc('${d.id}','APPROVED')" class='bg-blue-900 text-white px-8 py-3 rounded-2xl text-[10px] font-black uppercase underline shadow-xl'>REG FINAL APPROVE</button>` : ""}
                                <button onclick="delDoc('${d.id}')" class='bg-red-400 text-white px-3 py-1 rounded text-xs'>Reject</button>
                                <span class='p-1 bg-yellow-50 text-yellow-600 text-[8px] font-bold rounded uppercase'>${info.status}</span>
                            </div>
                        </div>
                        <details class="cursor-pointer text-[10px] text-indigo-400"><summary>Guji si aad u aragto List-iga (Preview)</summary>
                            <table class='w-full text-left text-[11px] mt-4'><thead><tr><th>ID No</th><th>Name</th><th>Mark</th><th>Grade</th></tr></thead><tbody>${stRows}</tbody></table>
                        </details>
                    </div>`;
                });
                document.getElementById('list-area').innerHTML = html;
            });
        }

        window.actDoc = async (id, s) => { await updateDoc(doc(db, "final_records", id), { status: s }); alert("Updated to: " + s); };
        window.delDoc = async (id) => { if(confirm("Confirm Delete?")) await deleteDoc(doc(db, "final_records", id)); };

        // --- ARDAYNAJIITO RAADI (SEARCH FIX) ---
        window.findGrade = async () => {
            const sid = document.getElementById('search-val').value.trim().toUpperCase().replace(/\s+/g, '');
            const display = document.getElementById('res');
            if(!sid) return alert("SRLD Number!");
            display.innerHTML = "<p class='animate-pulse text-indigo-900'>Baaritaan...</p>";

            const q = query(collection(db, "final_records"), where("status", "==", "APPROVED"));
            const snap = await getDocs(q);
            let match = null; let subj = "";

            snap.forEach(docSnap => {
                // Barar ID-ga isagoo ka baaraya magaca iyo ID unugyada maadaama Excel-kaaga dhowr xog is-dhex galeen
                let m = docSnap.data().students.find(s => s.id.includes(sid) || s.name.includes(sid));
                if(m) { match = m; subj = docSnap.data().subject; }
            });

            if(match) {
                display.innerHTML = `
                    <div class='mt-6 p-8 bg-indigo-50 border-t-8 border-indigo-950 rounded-[3rem] shadow-2xl animate-fade-in text-center relative overflow-hidden'>
                        <h2 class='text-4xl font-black text-indigo-950 uppercase'>${match.name}</h2>
                        <p class='text-xs font-bold text-gray-500 mt-2 uppercase'>Maadada: ${subj}</p>
                        <div class='grid grid-cols-2 gap-4 mt-8'>
                             <div class='bg-white p-5 rounded-2xl border-2'> <span class='text-[8px] font-bold opacity-30'>TIRA %</span> <h2 class='text-4xl font-black text-indigo-900'>${match.mark}%</h2> </div>
                             <div class='bg-indigo-950 text-white p-5 rounded-2xl border-b-8 border-yellow-500'> <span class='text-[8px] font-black opacity-50 uppercase'>XARAF Grade</span> <h2 class='text-5xl font-black italic'>${match.grade}</h2> </div>
                        </div>
                    </div>`;
            } else { display.innerHTML = "<div class='mt-4 p-4 bg-red-100 text-red-700 text-xs font-bold rounded-xl uppercase italic animate-bounce'>Xogtaan wali lama helin (HUBI STATUS: APPROVED MA NOQDAY?).</div>"; }
        };

    </script>
</head>
<body class="bg-slate-100 font-sans tracking-tight">

    <nav class="bg-indigo-950 p-6 flex justify-between items-center text-white border-b-8 border-yellow-500 shadow-xl sticky top-0 z-[100]">
        <h1 class="text-xl font-black italic tracking-widest italic italic">KCTE <span class="bg-white text-indigo-900 px-1 rounded-sm not-italic ml-1">SYSTEM</span></h1>
        <div id="nav-role" class="text-[9px] font-black uppercase text-indigo-200 border px-3 py-1 rounded-full border-white/10 tracking-[0.3em] italic">System Core</div>
        <button onclick="document.getElementById('m-mod').classList.remove('hidden')" class="bg-yellow-500 text-indigo-950 px-8 py-3 rounded-full font-black text-xs uppercase shadow-xl hover:scale-110 transform transition-all active:scale-95 italic italic tracking-tighter">KaEEG BUUNDADA</button>
    </nav>

    <!-- LOGIN -->
    <div id="login-box" class="max-w-md mx-auto mt-20 p-12 bg-white rounded-[3.5rem] shadow-2xl text-center border border-slate-100 italic italic italic italic">
        <h2 class="text-3xl font-black text-indigo-950 mb-1 leading-none tracking-tighter uppercase">Institutional Portal</h2>
        <p class="text-[9px] font-black text-slate-300 uppercase mb-12 tracking-widest border-b pb-4 italic">Security Authentication gateway</p>
        <input id="u" type="text" placeholder="Staff Name" class="w-full bg-gray-50 border-2 p-5 rounded-3xl outline-none focus:border-yellow-500 font-bold mb-4 uppercase tracking-tighter italic">
        <input id="p" type="password" placeholder="Pass-key" class="w-full bg-gray-50 border-2 p-5 rounded-3xl outline-none focus:border-yellow-500 text-3xl font-bold mb-8 text-center shadow-inner tracking-widest">
        <button onclick="login()" class="w-full bg-indigo-950 text-white p-6 rounded-3xl font-black text-xl hover:shadow-indigo-400 active:scale-95 transform transition uppercase italic italic">Gal Portal-ka Hub Hub</button>
    </div>

    <!-- MAIN PORTAL -->
    <div id="app-div" class="hidden p-8 lg:p-16 max-w-7xl mx-auto">
        
        <!-- TEACHER INPUT SECTION -->
        <div id="teacher-view" class="hidden mb-20 animate-fade-in">
            <div class="bg-white p-12 rounded-[5rem] shadow-2xl border border-indigo-50 text-center relative group">
                <h3 class="text-4xl font-black mb-12 text-indigo-950 underline decoration-yellow-500 decoration-8 underline-offset-8 uppercase">Gudbi Xog Cusub</h3>
                <input id="subj" type="text" placeholder="Magaca Maadada" class="w-full max-w-lg bg-gray-50 border-4 p-8 rounded-[2.5rem] text-3xl font-black outline-none focus:border-indigo-900 uppercase text-center shadow-inner italic mb-10 decoration-yellow-400 underline decoration-dotted">
                
                <div class="bg-indigo-50/40 border-4 border-dashed rounded-[4rem] border-indigo-100 p-12 group-hover:bg-white transition-all italic italic italic">
                    <p class="text-[10px] font-black opacity-30 uppercase italic italic mb-8">Raac Nidaamka: Copy Garey xogta ardayda ka dib halkan ku Paste-Dheh.</p>
                    <textarea oninput="cleanAndParse(event)" placeholder="Halkan midig-guji ka dibna ku riix Paste..." class="w-full h-40 p-5 rounded-[2rem] border focus:ring-4 focus:ring-indigo-100 text-[10px] tracking-widest italic outline-none"></textarea>
                    
                    <p id="p-info" class="text-sm font-black text-indigo-950 mt-4 mb-10 italic uppercase"></p>

                    <table class="w-full text-left text-[10px] border rounded shadow-inner bg-white">
                        <thead class="bg-gray-100 font-bold uppercase italic"><tr><th>Name</th><th>ID No</th><th>100% Mark</th><th>Grade</th></tr></thead>
                        <tbody id="p-body"></tbody>
                    </table>
                    
                    <button onclick="sendCloud()" class="w-full bg-indigo-950 text-white p-8 rounded-[4rem] font-black text-4xl shadow-xl mt-12 hover:scale-105 active:scale-95 transition-all italic tracking-tighter decoration-yellow-500 underline underline-offset-8 decoration-4 uppercase">Gudbi Hada (SUBMIT REPORT)</button>
                </div>
            </div>
        </div>

        <div id="list-area" class="max-w-4xl mx-auto"></div>
    </div>

    <!-- STUDENT MODAL: RESULT VIEWER -->
    <div id="st-mod" class="hidden fixed inset-0 bg-indigo-950/98 backdrop-blur-3xl flex items-center justify-center p-8 z-[1200] animate-fade-in">
        <div class="bg-white p-16 rounded-[4.5rem] w-full max-w-lg shadow-[0_50px_100px_rgba(0,0,0,0.8)] border-t-[20px] border-yellow-500 text-center relative overflow-hidden italic italic italic">
             <div class="absolute -top-10 -right-10 w-40 h-40 bg-indigo-50 opacity-20 blur-3xl rotate-45 pointer-events-none"></div>
             <h2 class="text-5xl font-black text-indigo-950 leading-none mb-1 tracking-tighter uppercase italic italic">Result View</h2>
             <p class="text-[9px] font-black text-slate-300 mb-10 tracking-[0.4em] italic italic underline decoration-gray-100">Official KCTE Grade Gateway Portal</p>
             
             <input id="search-val" type="text" placeholder="Geli ID (E.g SRLD/141/15)" class="w-full bg-slate-50 border-4 border-indigo-50 p-8 rounded-[3.5rem] text-4xl font-black text-indigo-950 text-center uppercase outline-none focus:border-yellow-500 shadow-inner mb-6 italic tracking-tighter placeholder:opacity-10 italic">
             <button onclick="findResult()" class="w-full bg-indigo-950 text-white p-8 rounded-[3.5rem] font-black text-3xl shadow-xl hover:scale-105 active:scale-95 transition-all underline decoration-yellow-400 decoration-8 underline-offset-8">KaBAADI XOGTAYDA (Go)</button>
             
             <div id="res" class="min-h-[250px]"></div>
             
             <button onclick="document.getElementById('st-mod').classList.add('hidden')" class="mt-8 text-gray-300 font-bold uppercase text-[9px] hover:text-red-500 transition-colors border-b border-slate-100 pb-1 italic italic italic">XIR DAASHA RESULT-ka X</button>
        </div>
    </div>

</body>
</html>
