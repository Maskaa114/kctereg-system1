<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KCTE SMART GRADE SYSTEM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, getDocs, updateDoc, doc, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDoMZETvL5-oYm5wiP2dcbLm1p6ZfsgvjE",
            authDomain: "kctereg-online.firebaseapp.com",
            projectId: "kctereg-online",
            storageBucket: "kctereg-online.firebasestorage.app",
            messagingSenderId: "308277595556",
            appId: "1:308277595556:web:1b1814886668eda0310531"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let currentRole = "";
        let finalData = [];

        // Nidaamka Login-ka
        window.login = () => {
            const user = document.getElementById('user').value.trim();
            const pass = document.getElementById('pass').value.trim();
            if(user === "Macalin114" && pass === "kctepass") renderUI('Teacher');
            else if(user === "D.head 5353" && pass === "headpass") renderUI('HOD');
            else if(user === "REG.12345" && pass === "regpass") renderUI('REG');
            else if(user === "dean12345" && pass === "deanpass") renderUI('Dean');
            else alert("Khalad!");
        };

        function renderUI(role) {
            currentRole = role;
            document.getElementById('login-box').classList.add('hidden');
            document.getElementById('dashboard-ui').classList.remove('hidden');
            document.getElementById('dash-title').innerText = role + " DASHBOARD";
            if(role === 'Teacher') document.getElementById('teacher-section').classList.remove('hidden');
            if(role === 'HOD') loadData('PENDING_HOD');
            if(role === 'REG') loadData('PENDING_REG');
            if(role === 'Dean') loadData(); 
        }

        // SMART EXCEL PARSER: Ka xayuubi cinwaanada, soo saar xogta nadiifka ah
        window.readExcel = (e) => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                const data = new Uint8Array(ev.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                const rows = XLSX.utils.sheet_to_json(sheet, {header: 1}); // Read raw rows

                finalData = [];
                rows.forEach((row) => {
                    // Baar haddii safkan uu leeyahay ID u eg KCTE (SRLD /...) ama nambar qof.
                    // Waxaan raadineynaa safafka dhabta ah ee ardayda.
                    const rowStr = row.join("|").toLowerCase();
                    if(rowStr.includes("srld") || row.length > 3 && !rowStr.includes("college") && !rowStr.includes("regular")) {
                        let studentId = row.find(c => String(c).toUpperCase().includes("SRLD") || String(c).includes("/"));
                        let studentName = row[1] || row[2]; // Badanaa waa Col B ama C
                        let studentGrade = row[row.length - 1]; // Buundada dhabta ah ee u dambeysa

                        if(studentId && studentName) {
                            finalData.push({
                                id: String(studentId).trim(),
                                name: String(studentName).trim(),
                                grade: String(studentGrade).trim()
                            });
                        }
                    }
                });

                if(finalData.length > 0) {
                    alert("WAA LA HELAY: " + finalData.length + " Arday oo xogtoodu nadiif tahay!");
                    console.log("Cleaned Data:", finalData);
                } else {
                    alert("Excel-ka ma uusan helin ID sax ah. Hubi nambarka SRLD.");
                }
            };
            reader.readAsArrayBuffer(e.target.files[0]);
        };

        window.submitToHOD = async () => {
            if(finalData.length == 0) return alert("Fadlan kow soo geli Excel file-ka!");
            await addDoc(collection(db, "grades"), {
                teacher: "Macalin114",
                students: finalData,
                status: "PENDING_HOD",
                at: new Date().toLocaleString()
            });
            alert("Grade-kii nadiifka ahaa waxaa loo diray HOD!"); location.reload();
        };

        function loadData(status) {
            const q = status ? query(collection(db, "grades"), where("status", "==", status)) : collection(db, "grades");
            onSnapshot(q, (snap) => {
                let h = "";
                snap.forEach(d => {
                    const data = d.data();
                    let rows = "";
                    data.students.slice(0, 10).forEach(s => {
                        rows += `<tr class='border-b hover:bg-slate-50'>
                            <td class='p-2'>${s.id}</td>
                            <td class='p-2'>${s.name}</td>
                            <td class='p-2 font-black text-red-600'>${s.grade}</td>
                        </tr>`;
                    });
                    h += `<div class="bg-white rounded-2xl shadow-xl p-6 mb-8 border border-slate-200">
                        <div class="flex justify-between items-center mb-4">
                            <div>
                                <h3 class="font-black text-indigo-900 uppercase">KCTE - ${data.teacher} Submission</h3>
                                <p class="text-xs text-gray-500 font-bold">${data.at} | ${data.students.length} Arday</p>
                            </div>
                            <div class="space-x-2">
                                ${(currentRole=='HOD' && data.status=='PENDING_HOD') ? `<button onclick="act('${d.id}', 'PENDING_REG')" class="bg-green-600 text-white px-4 py-2 rounded-lg font-bold">APPROVE TO REG</button>` : ""}
                                ${(currentRole=='REG' && data.status=='PENDING_REG') ? `<button onclick="act('${d.id}', 'APPROVED')" class="bg-indigo-700 text-white px-4 py-2 rounded-lg font-black">FINAL APPROVE</button>` : ""}
                                <button onclick="deleteD('${d.id}')" class="bg-red-100 text-red-600 px-3 py-2 rounded-lg text-xs">Reject</button>
                            </div>
                        </div>
                        <table class="w-full text-left text-sm border">
                            <thead class="bg-indigo-950 text-white italic"><tr><th class="p-2">ID NO.</th><th class="p-2">NAME</th><th class="p-2">FINAL GRADE</th></tr></thead>
                            <tbody>${rows}</tbody>
                        </table>
                    </div>`;
                });
                document.getElementById('list-box').innerHTML = h || "<p class='text-center py-10 text-gray-400'>Majiraan xog la sugayo.</p>";
            });
        }

        window.act = async (id, s) => { if(confirm("Ma gudbinaysaa xogta?")) { await updateDoc(doc(db, "grades", id), { status: s }); alert("Success!"); } };
        window.deleteD = async (id) => { if(confirm("Ma tirtiraysaa?")) { await deleteDoc(doc(db, "grades", id)); } };

        // STUDENT SEARCH: Hubi ID walba oo u dhigma KCTE format
        window.studentSearch = async () => {
            const input = document.getElementById('st-id').value.trim();
            const resultDiv = document.getElementById('st-result');
            resultDiv.innerHTML = "Raadinayaa...";
            
            const q = query(collection(db, "grades"), where("status", "==", "APPROVED"));
            const snap = await getDocs(q);
            let found = null;

            snap.forEach(doc => {
                const sList = doc.data().students;
                let match = sList.find(s => s.id.toLowerCase() === input.toLowerCase());
                if(match) found = match;
            });

            if(found) {
                resultDiv.innerHTML = `
                    <div class="mt-4 p-6 bg-indigo-50 border-4 border-indigo-950 rounded-2xl animate-pulse">
                        <p class="text-xs uppercase font-black text-indigo-800 tracking-tighter">KEBRIDAHAR COLLEGE OF TEACHER EDUCATION</p>
                        <h1 class="text-2xl font-black mt-2 text-slate-800">${found.name}</h1>
                        <p class="text-sm text-gray-500 mt-1">ID NO: ${found.id}</p>
                        <div class="mt-4 bg-white p-4 inline-block rounded-xl border-2 border-indigo-900 shadow-lg">
                           <span class="text-gray-400 block text-[10px] font-bold">OFFICIAL GRADE</span>
                           <span class="text-5xl font-black text-indigo-900">${found.grade}</span>
                        </div>
                    </div>`;
            } else {
                resultDiv.innerHTML = "<p class='mt-4 p-4 bg-red-100 text-red-700 rounded-xl font-bold'>Ardaygan laguma hayo xog Approved ah. Hubi ID-ga (SRLD/...).</p>";
            }
        };

    </script>
</head>
<body class="bg-slate-100 font-sans">
    
    <!-- HEADER -->
    <nav class="bg-indigo-950 p-6 text-white border-b-4 border-yellow-500 shadow-2xl flex justify-between items-center">
        <h1 class="font-black text-2xl tracking-tighter flex items-center gap-2">KCTE <span class="bg-yellow-500 text-indigo-900 px-2 rounded italic text-sm">MANAGEMENT</span></h1>
        <button onclick="document.getElementById('mod').classList.remove('hidden')" class="bg-yellow-500 text-indigo-900 px-6 py-2 rounded-full font-black hover:bg-white transition-all text-xs">ARDAYDA: CHECK GRADE</button>
    </nav>

    <!-- LOGIN BOX -->
    <div id="login-box" class="max-w-md mx-auto mt-20 bg-white p-10 rounded-3xl shadow-2xl border-t-8 border-indigo-900">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-black text-indigo-950">GASHIDKA STAFF</h2>
            <p class="text-gray-400 italic text-sm">Fadlan geli macluumaadkaaga diiwaangashan.</p>
        </div>
        <input id="user" type="text" placeholder="Isticmaalaha" class="w-full border-2 p-4 rounded-2xl mb-4 focus:border-yellow-500 outline-none">
        <input id="pass" type="password" placeholder="Furaha Sirta" class="w-full border-2 p-4 rounded-2xl mb-8 focus:border-yellow-500 outline-none">
        <button onclick="login()" class="w-full bg-indigo-900 hover:bg-indigo-700 text-white p-5 rounded-2xl font-black text-xl transition-transform active:scale-95 shadow-xl uppercase">GAL DASHBOARD-KA</button>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard-ui" class="hidden p-8 max-w-5xl mx-auto animate-fade-in">
        <h2 id="dash-title" class="text-3xl font-black mb-10 text-indigo-950 border-l-8 border-yellow-500 pl-4 tracking-tighter italic">DASHBOARD</h2>
        
        <!-- Section for Teacher -->
        <div id="teacher-section" class="hidden bg-white p-10 rounded-3xl shadow-xl border-2 mb-10">
            <h3 class="font-black text-xl mb-6 text-indigo-950 underline decoration-yellow-400">📤 SOO GUDBI EXCEL-KA (KCTE FORMAT)</h3>
            <div class="bg-slate-50 border-4 border-dashed rounded-3xl p-10 text-center">
                <input type="file" onchange="readExcel(event)" accept=".xlsx, .xls" class="mb-4">
                <p class="text-[10px] text-gray-400 mb-6 font-bold italic italic underline">Xusuusin: System-ku wuxuu toos u garanayaa SRLD ID-ga iyo Grade-ka.</p>
                <button onclick="submitToHOD()" class="bg-indigo-950 text-white px-10 py-4 rounded-2xl font-black shadow-2xl hover:scale-105 transition-transform uppercase">Gudbi Faylka Nadiifta Ah</button>
            </div>
        </div>

        <!-- Approval Box -->
        <div id="list-box"></div>
    </div>

    <!-- MODAL FOR STUDENTS -->
    <div id="mod" class="hidden fixed inset-0 bg-indigo-900/90 backdrop-blur-sm flex items-center justify-center p-6 z-50">
        <div class="bg-white p-10 rounded-[2.5rem] shadow-[0_30px_60px_-12px_rgba(0,0,0,0.5)] w-full max-w-sm border-t-8 border-indigo-950">
            <h2 class="font-black text-2xl text-indigo-950 mb-1 tracking-tighter uppercase">HEEGSID NATIIJO</h2>
            <p class="text-[10px] text-gray-400 mb-8 italic uppercase">Official student tracking portal</p>
            <input id="st-id" type="text" placeholder="SRLD /001 /15" class="w-full border-2 p-5 rounded-2xl mb-4 font-bold text-indigo-900 border-indigo-100 text-center uppercase tracking-widest text-lg">
            <button onclick="studentSearch()" class="w-full bg-indigo-950 text-white p-5 rounded-2xl font-black text-xl hover:bg-yellow-500 hover:text-indigo-900 transition-all uppercase">Check Grade</button>
            <div id="st-result"></div>
            <button onclick="document.getElementById('mod').classList.add('hidden')" class="w-full mt-6 text-gray-300 font-bold uppercase underline text-[10px]">Back to home</button>
        </div>
    </div>

</body>
</html>
