<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KCTE OFFICIAL MANAGEMENT HUB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, getDocs, updateDoc, doc, onSnapshot, deleteDoc, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDoMZETvL5-oYm5wiP2dcbLm1p6ZfsgvjE",
            authDomain: "kctereg-online.firebaseapp.com",
            projectId: "kctereg-online",
            storageBucket: "kctereg-online.firebasestorage.app",
            messagingSenderId: "308277595556",
            appId: "1:308277595556:web:1b1814886668eda0310531"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let role = "";
        let finalExcelData = [];

        window.login = () => {
            const u = document.getElementById('u').value.trim();
            const p = document.getElementById('p').value.trim();
            if(u === "Macalin114" && p === "kctepass") start("Macalin");
            else if(u === "D.head 5353" && p === "headpass") start("HOD");
            else if(u === "REG.12345" && p === "regpass") start("REG");
            else if(u === "dean12345" && p === "deanpass") start("Dean");
            else alert("ID ama Password khalad ah!");
        };

        function start(r) {
            role = r;
            document.getElementById('login-box').style.display = "none";
            document.getElementById('nav-role').innerText = r + " Dashboard";
            document.getElementById('app-ui').classList.remove('hidden');
            if(r === "Macalin") document.getElementById('teacher-zone').classList.remove('hidden');
            if(r === "HOD") loadData('PENDING_HOD');
            if(r === "REG") loadData('PENDING_REG');
            if(r === "Dean") loadData();
        }

        window.handleFile = (e) => {
            const reader = new FileReader();
            reader.onload = (evt) => {
                const workbook = XLSX.read(evt.target.result, { type: 'binary' });
                const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1 });
                finalExcelData = [];
                rows.forEach((row, index) => {
                    // Ka bood 10-ka saf ee u horreeya (Cinwaannada Kulliyadda)
                    if (index < 9) return; 
                    const rowText = row.join(" ").toUpperCase();
                    if(rowText.includes("SRLD")) {
                        finalExcelData.push({
                            id: String(row.find(c => String(c).includes("/"))).replace(/\s/g, '').toUpperCase(),
                            name: row[1] || row[2] || "Unknown Student",
                            mark: row[row.length - 2] || "0",
                            grade: row[row.length - 1] || "F"
                        });
                    }
                });
                document.getElementById('st-count').innerText = "La aqriyey: " + finalExcelData.length + " Arday.";
            };
            reader.readAsBinaryString(e.target.files[0]);
        };

        window.submitSub = async () => {
            const sub = document.getElementById('subject').value;
            if(!sub || finalExcelData.length === 0) return alert("Magaca Maadada qor, Excel-kana xulo!");
            await addDoc(collection(db, "official_results"), {
                teacher: "Macalin114",
                course: sub.toUpperCase(),
                records: finalExcelData,
                status: "PENDING_HOD",
                time: new Date().toLocaleString()
            });
            alert("Xogta " + sub + " waa la gudbiyey!");
            location.reload();
        };

        function loadData(st) {
            const q = st ? query(collection(db, "official_results"), where("status", "==", st)) : collection(db, "official_results");
            onSnapshot(q, (snap) => {
                let h = "";
                snap.forEach(d => {
                    const info = d.data();
                    let stRows = "";
                    info.records.forEach(s => {
                        stRows += `<tr class='border-b'><td>${s.id}</td><td>${s.name}</td><td class='font-black'>${s.grade}</td></tr>`;
                    });
                    h += `<div class="bg-white p-6 rounded-3xl shadow-xl mb-6 border-l-[12px] border-indigo-950">
                        <div class="flex justify-between items-center mb-4">
                            <div><h3 class="font-black text-xl text-indigo-900">${info.course}</h3><p class="text-[10px]">Instructor: ${info.teacher}</p></div>
                            <div class="space-x-2">
                                ${(role=='HOD' && info.status=='PENDING_HOD') ? `<button onclick="act('${d.id}','PENDING_REG')" class="bg-green-600 text-white px-4 py-1 rounded-lg font-bold">Approve</button>` : ''}
                                ${(role=='REG' && info.status=='PENDING_REG') ? `<button onclick="act('${d.id}','APPROVED')" class="bg-indigo-950 text-white px-6 py-2 rounded-xl font-bold uppercase italic italic">Oggolaansho Final</button>` : ''}
                            </div>
                        </div>
                        <details class="text-[10px] text-gray-500"><summary>Guji si aad u hubiso ardayda</summary>
                            <table class="w-full text-left mt-2 border"><thead><tr class="bg-slate-50 font-black"><th>ID</th><th>Magaca</th><th>Grade</th></tr></thead><tbody>${stRows}</tbody></table>
                        </details>
                    </div>`;
                });
                document.getElementById('list-data').innerHTML = h;
            });
        }

        window.act = async (id, s) => { await updateDoc(doc(db, "official_results", id), { status: s }); alert("Updated!"); };

        window.studentCheck = async () => {
            const id = document.getElementById('search-val').value.trim().toUpperCase().replace(/\s+/g, '');
            if(!id) return alert("Fadlan ID Number-kaaga qor!");
            const snap = await getDocs(query(collection(db, "official_results"), where("status", "==", "APPROVED")));
            let res = null; let meta = null;
            snap.forEach(d => { 
                let m = d.data().records.find(s => s.id === id); 
                if(m) { res = m; meta = d.data(); }
            });
            const rDiv = document.getElementById('st-res');
            if(res) {
                rDiv.innerHTML = `<div class="mt-4 p-8 bg-indigo-50 border-4 border-indigo-950 rounded-3xl text-center shadow-2xl animate-bounce">
                    <p class="text-[9px] font-black uppercase mb-4 opacity-50 underline tracking-[0.2em]">KCTE Institutional Transcript</p>
                    <h2 class="text-3xl font-black text-indigo-950 leading-tight">${res.name}</h2>
                    <p class="text-sm font-bold text-gray-400 mt-2 uppercase italic italic">${meta.course}</p>
                    <div class="grid grid-cols-2 gap-4 mt-8">
                        <div class="bg-white p-4 rounded-xl border-2"> <span class="block text-[8px] font-bold opacity-30 uppercase">Score 100%</span> <h1 class="text-3xl font-black">${res.mark}%</h1> </div>
                        <div class="bg-indigo-950 text-white p-4 rounded-xl shadow-xl shadow-indigo-100"> <span class="block text-[8px] font-bold text-indigo-400 uppercase italic">Letter Grade</span> <h1 class="text-5xl font-black italic underline">${res.grade}</h1> </div>
                    </div>
                </div>`;
            } else { alert("ID Number lama helin (Check status with Registry)."); }
        };
    </script>
</head>
<body class="bg-gray-100 font-sans tracking-tight">
    
    <nav class="bg-indigo-950 p-6 flex justify-between items-center text-white border-b-8 border-yellow-500 sticky top-0 z-[500] shadow-2xl">
        <h1 class="text-2xl font-black italic tracking-tighter uppercase italic leading-none">KCTE <span class="bg-white text-indigo-950 px-2 rounded-lg not-italic">PORTAL</span></h1>
        <div id="nav-role" class="bg-indigo-900 border border-white/20 px-6 py-1 rounded-full text-[10px] font-black text-yellow-500 uppercase italic tracking-[0.2em]">Secure Center</div>
        <button onclick="document.getElementById('mod').classList.remove('hidden')" class="bg-yellow-500 text-indigo-900 px-8 py-3 rounded-full font-black text-xs uppercase hover:bg-white transition-all transform active:scale-95 italic italic">Natiijo Raadis</button>
    </nav>

    <!-- LOGIN -->
    <div id="login-box" class="max-w-md mx-auto mt-20 p-12 bg-white rounded-[4rem] shadow-2xl border-t-8 border-indigo-950 text-center relative overflow-hidden">
        <h2 class="text-4xl font-black text-indigo-950 mb-1 leading-none uppercase italic italic italic italic">Login Gateway</h2>
        <p class="text-[9px] font-black text-gray-300 uppercase mb-10 tracking-[0.3em] border-b pb-4 italic underline underline-offset-8 decoration-yellow-400">Control Hub access</p>
        <div class="space-y-4">
            <input id="u" type="text" placeholder="Username / Magaca" class="w-full bg-slate-50 border-2 p-5 rounded-2xl outline-none focus:border-yellow-500 font-bold uppercase tracking-widest text-sm shadow-inner italic">
            <input id="p" type="password" placeholder="Pass-key" class="w-full bg-slate-50 border-2 p-5 rounded-2xl outline-none focus:border-yellow-500 text-center font-bold tracking-widest text-4xl shadow-inner mb-6">
            <button onclick="login()" class="w-full bg-indigo-950 text-white p-6 rounded-[2.5rem] font-black text-2xl hover:bg-indigo-900 active:scale-95 transition-all uppercase italic italic shadow-xl">Gudaha gal Portal-ka</button>
        </div>
    </div>

    <!-- MAIN APP DASHBOARD -->
    <div id="app-ui" class="hidden p-8 lg:p-16 max-w-6xl mx-auto">
        
        <div id="teacher-zone" class="hidden max-w-4xl mx-auto mb-16 text-center animate-fade-in">
            <div class="bg-white p-12 rounded-[4.5rem] shadow-2xl border border-indigo-50 overflow-hidden relative">
                 <h2 class="text-5xl font-black text-indigo-950 mb-10 tracking-tighter uppercase underline decoration-yellow-500 underline-offset-8 decoration-8 italic italic">Gudbi Natiijada</h2>
                 <input id="subject" type="text" placeholder="Geli Maadada (Somali, English...)" class="w-full bg-gray-50 border-4 p-8 rounded-3xl font-black text-3xl outline-none focus:border-indigo-950 uppercase text-center shadow-inner mb-8 italic italic tracking-tighter">
                 <div class="bg-indigo-50 border-4 border-dashed rounded-[3rem] p-16 hover:bg-white transition-all text-center">
                      <input type="file" onchange="handleFile(event)" accept=".xlsx, .xls" class="mb-6 block mx-auto text-[10px] font-black italic italic italic italic">
                      <p id="st-count" class="font-black text-indigo-900 mb-6 text-sm italic italic uppercase"></p>
                      <button onclick="submitSub()" class="w-full bg-indigo-950 text-white p-8 rounded-[3.5rem] font-black text-4xl shadow-xl hover:scale-105 active:scale-90 transition-all uppercase tracking-tighter italic">SUBMIT REPORT NOW</button>
                 </div>
            </div>
        </div>

        <div id="list-data" class="max-w-4xl mx-auto"></div>
    </div>

    <!-- STUDENT MODAL: SEARCH (ID ONLY SEARCH) -->
    <div id="mod" class="hidden fixed inset-0 bg-indigo-950/98 flex items-center justify-center p-8 z-[1000] backdrop-blur-3xl">
        <div class="bg-slate-100 p-16 rounded-[4.5rem] w-full max-w-xl shadow-[0_50px_100px_rgba(0,0,0,0.5)] border-t-[20px] border-yellow-500 text-center relative overflow-hidden">
             <h2 class="text-5xl font-black text-indigo-950 leading-none mb-1 uppercase tracking-tight italic underline underline-offset-4 decoration-indigo-50">Hubi Buundada</h2>
             <p class="text-[9px] font-black text-slate-400 mb-12 uppercase tracking-[0.4em] italic italic underline underline-offset-8 decoration-gray-50">Academic Transcript Center</p>
             <input id="search-val" type="text" placeholder="ID Number (SRLD/140/15)" class="w-full bg-white p-8 rounded-[4rem] border-4 border-slate-50 text-4xl font-black text-center text-indigo-950 shadow-inner mb-6 outline-none focus:border-yellow-500 uppercase tracking-widest placeholder:opacity-10 italic">
             <button onclick="studentCheck()" class="w-full bg-indigo-950 text-white p-8 rounded-[4rem] font-black text-3xl shadow-xl hover:scale-105 active:scale-95 transition-all italic underline decoration-yellow-400 decoration-8 underline-offset-8 italic italic">Hubi Nidaamka Hada</button>
             <div id="st-res" class="min-h-[250px]"></div>
             <button onclick="document.getElementById('mod').classList.add('hidden')" class="mt-8 text-gray-300 font-bold uppercase text-[9px] border-b pb-1 hover:text-red-500 transition tracking-[0.3em] italic italic italic">Back to home Hub</button>
        </div>
    </div>

</body>
</html>
