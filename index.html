<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KCTE FLEXIBLE SYSTEM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, getDocs, updateDoc, doc, onSnapshot, deleteDoc, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDoMZETvL5-oYm5wiP2dcbLm1p6ZfsgvjE",
            authDomain: "kctereg-online.firebaseapp.com",
            projectId: "kctereg-online",
            storageBucket: "kctereg-online.firebasestorage.app",
            messagingSenderId: "308277595556",
            appId: "1:308277595556:web:1b1814886668eda0310531"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let currentUserRole = "";
        let rawTableData = [];

        window.login = () => {
            const user = document.getElementById('u').value.trim();
            const pass = document.getElementById('p').value.trim();
            if(user === "Macalin114" && pass === "kctepass") renderPortal("Teacher");
            else if(user === "D.head 5353" && pass === "headpass") renderPortal("HOD");
            else if(user === "REG.12345" && pass === "regpass") renderPortal("REG");
            else if((user === "dean12345" || user === "v.dean1") && pass === "deanpass") renderPortal("Dean");
            else alert("ID ama Password khalad ah!");
        };

        function renderPortal(role) {
            currentUserRole = role;
            document.getElementById('login-div').classList.add('hidden');
            document.getElementById('dash-main').classList.remove('hidden');
            document.getElementById('role-display').innerText = role + " Session";
            if(role === 'Teacher') document.getElementById('teacher-zone').classList.remove('hidden');
            if(role === 'HOD') loadReports('PENDING_HOD');
            if(role === 'REG') loadReports('PENDING_REG');
            if(role === 'Dean') loadReports();
        }

        // --- EXCEL LOGIC (DUMMY-PROOF / FLEXIBLE) ---
        window.handleExcelUpload = (e) => {
            const reader = new FileReader();
            reader.onload = (evt) => {
                const data = evt.target.result;
                const workbook = XLSX.read(data, { type: 'binary' });
                // Hel dhamaan xogta iyadoo safaf ah (No filters)
                const sheetRows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1 });
                
                rawTableData = [];
                sheetRows.forEach(row => {
                    // Ka xaqiiji inay jirto ugu yaraan 2 qol (cells) oo xog leh si looga boodo safafka maran
                    if(row.length > 2) {
                        rawTableData.push(row.map(cell => cell === null ? "" : cell));
                    }
                });
                alert("Smart Parser: Waxaa la diyaariyey " + rawTableData.length + " saf (rows) oo xog ah!");
            };
            reader.readAsBinaryString(e.target.files[0]);
        };

        window.submitSub = async () => {
            const courseName = document.getElementById('subject').value.trim();
            if(!courseName || rawTableData.length === 0) return alert("Fadlan Magaca Maadada qor oo Excel-ka soo xulo!");
            
            try {
                await addDoc(collection(db, "flexible_grades"), {
                    instructor: "Macalin114",
                    course: courseName,
                    data: rawTableData, // Dhamman safafka Excel-ka siday u qornaayeen
                    status: "PENDING_HOD",
                    createdAt: new Date().getTime(),
                    dateStr: new Date().toLocaleString()
                });
                alert("Success: Xogta waa loo gudbiyey Head-ka.");
                location.reload();
            } catch (error) { alert("Khalad Firebase: Rules-ka iska hubi!"); }
        };

        function loadReports(filter) {
            const q = filter ? query(collection(db, "flexible_grades"), where("status", "==", filter)) : query(collection(db, "flexible_grades"));
            onSnapshot(q, (snap) => {
                let listHtml = "";
                snap.forEach(d => {
                    const item = d.data();
                    let rowsHtml = "";
                    
                    // Samee Table rows iyadoo lagu saleynayo xogta Excel-ka
                    item.data.slice(0, 50).forEach(r => {
                        let cells = "";
                        r.forEach(c => { cells += `<td class="p-1 border">${c}</td>`; });
                        rowsHtml += `<tr class="text-[10px] hover:bg-gray-50">${cells}</tr>`;
                    });

                    listHtml += `
                    <div class="bg-white rounded-2xl shadow-xl p-6 mb-6 border border-slate-200">
                        <div class="flex justify-between items-start border-b pb-4 mb-4">
                            <div>
                                <h3 class="text-xl font-black text-indigo-950 uppercase italic underline decoration-yellow-400">${item.course}</h3>
                                <p class="text-[10px] text-gray-400 uppercase font-bold tracking-widest">${item.instructor} | ${item.dateStr}</p>
                            </div>
                            <div class="flex gap-2">
                                ${(currentUserRole === 'HOD' && item.status === 'PENDING_HOD') ? `<button onclick="update('${d.id}','PENDING_REG')" class="bg-green-600 text-white px-3 py-1 rounded text-xs font-bold">Approve</button><button onclick="delDoc('${d.id}')" class="bg-red-400 text-white px-3 py-1 rounded text-xs">Delete</button>` : ""}
                                ${(currentUserRole === 'REG' && item.status === 'PENDING_REG') ? `<button onclick="update('${d.id}','APPROVED')" class="bg-indigo-900 text-white px-3 py-1 rounded text-xs font-black uppercase">Final Approve</button>` : ""}
                                <span class="bg-slate-100 p-1 text-[10px] font-black">${item.status}</span>
                            </div>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left">
                                <tbody id="tb-${d.id}">${rowsHtml}</tbody>
                            </table>
                        </div>
                        <p class="text-[8px] text-gray-300 mt-2 italic">* Preview mode: Excel raw content shown above for verification.</p>
                    </div>`;
                });
                document.getElementById('report-area').innerHTML = listHtml || "<p class='text-center py-20 opacity-30 uppercase font-black tracking-widest'>Ma jiraan xog la oggolaanayo xiligan...</p>";
            });
        }

        window.update = async (id, s) => { await updateDoc(doc(db, "flexible_grades", id), { status: s }); alert("Workflow Updated: " + s); };
        window.delDoc = async (id) => { if(confirm("Hubi inaad tirtirayso xogta?")) await deleteDoc(doc(db, "flexible_grades", id)); };

        // --- STUDENT NATIIJO NATIIJO (ULTRA SMART SEARCH) ---
        window.checkMyGrade = async () => {
            const inputId = document.getElementById('search-val').value.trim().toUpperCase().replace(/\s+/g, '');
            if(!inputId) return alert("Fadlan qor ID SRLD lambarkaaga!");
            const resultBox = document.getElementById('search-res');
            resultBox.innerHTML = "Dheef raadin baa socota...";

            const q = query(collection(db, "flexible_grades"), where("status", "==", "APPROVED"));
            const snap = await getDocs(q);
            let matchRow = null; let subInfo = null;

            snap.forEach(docSnap => {
                const sheet = docSnap.data().data;
                sheet.forEach(row => {
                    // Baar hadii nambarka Input-ka uu ku jiro wax kasta oo ka mid ah safka (Flexible)
                    const rowText = row.join("").toUpperCase().replace(/\s+/g, '');
                    if(rowText.includes(inputId)) { matchRow = row; subInfo = docSnap.data(); }
                });
            });

            if(matchRow) {
                let studentName = matchRow[1] || matchRow[2] || "Lama heli";
                let finalGrade = matchRow[matchRow.length - 1] || "No Grade";
                let percentage = matchRow[matchRow.length - 2] || "No Score";
                resultBox.innerHTML = `
                    <div class="mt-4 p-8 bg-white border-t-[10px] border-indigo-950 rounded-[3rem] shadow-2xl animate-fade-in text-center">
                        <p class="text-[9px] font-black text-slate-300 uppercase tracking-widest mb-4">Official KCTE Result Card</p>
                        <h2 class="text-3xl font-black text-indigo-950 leading-tight uppercase underline decoration-yellow-400 decoration-8 underline-offset-4">${studentName}</h2>
                        <p class="text-xs font-bold text-indigo-500 mt-2 uppercase italic italic">${subInfo.course}</p>
                        <div class="grid grid-cols-2 gap-4 mt-8">
                             <div class="bg-gray-50 p-4 rounded-xl border border-indigo-50"> <span class="text-[9px] block uppercase font-bold text-gray-400 italic">Score %</span> <h1 class="text-2xl font-black">${percentage}</h1> </div>
                             <div class="bg-indigo-950 text-white p-4 rounded-xl shadow-lg border border-indigo-500 shadow-indigo-100"> <span class="text-[9px] block italic text-indigo-400">Final Grade</span> <h1 class="text-4xl font-black italic decoration-yellow-500 underline">${finalGrade}</h1> </div>
                        </div>
                        <p class="mt-6 text-[8px] text-green-600 font-bold tracking-widest flex items-center justify-center italic">OFFICIALLY VERIFIED - ${subInfo.dateStr}</p>
                    </div>`;
            } else { resultBox.innerHTML = `<p class="mt-4 bg-red-50 p-6 rounded-2xl text-red-600 text-xs font-bold uppercase tracking-tight italic">Xog laguma hayo ID lambarkan [${inputId}]. Hubi SRLD number-ka ama xiriir Registrar.</p>`; }
        };

    </script>
    <style> .animate-fade-in { animation: fadeIn 0.4s ease-out; } @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } } </style>
</head>
<body class="bg-slate-100 font-sans tracking-tight text-slate-900 overflow-x-hidden">

    <!-- NAVBAR -->
    <nav class="bg-indigo-950 p-6 text-white border-b-[8px] border-yellow-500 shadow-2xl flex justify-between items-center sticky top-0 z-[500] backdrop-blur-md">
        <h1 class="text-xl font-black flex items-center italic uppercase italic tracking-tighter decoration-yellow-400 underline underline-offset-8 decoration-4 leading-none">KCTE <span class="bg-white text-indigo-900 px-2 rounded-lg italic">PORTAL</span></h1>
        <div id="role-display" class="bg-white/5 border border-white/20 px-4 py-1 rounded-full text-[10px] uppercase font-black italic tracking-widest text-indigo-200">Session Portal</div>
        <button onclick="document.getElementById('modal-s').classList.remove('hidden')" class="bg-yellow-500 text-indigo-950 px-6 py-2 rounded-full font-black text-xs hover:bg-white uppercase tracking-tighter shadow-lg transform transition active:scale-95 shadow-yellow-200/50 italic">ARDAAYADA Check</button>
    </nav>

    <!-- LOGIN AREA -->
    <div id="login-div" class="max-w-sm mx-auto mt-20 bg-white p-12 rounded-[4rem] shadow-2xl border-t-[10px] border-indigo-950 text-center animate-fade-in">
        <h2 class="text-3xl font-black text-indigo-950 mb-1 leading-none tracking-tighter uppercase italic">Panel Login</h2>
        <p class="text-[9px] font-black text-gray-300 mb-10 italic uppercase border-b pb-4 tracking-widest decoration-yellow-500">Official Access Gate</p>
        <div class="space-y-4">
            <input id="u" type="text" placeholder="Geli ID (Staff)" class="w-full bg-slate-50 border-2 border-indigo-50 p-4 rounded-2xl outline-none focus:border-yellow-500 text-lg font-black tracking-widest italic shadow-inner">
            <input id="p" type="password" placeholder="Password" class="w-full bg-slate-50 border-2 border-indigo-50 p-4 rounded-2xl outline-none focus:border-yellow-500 text-center text-4xl">
            <button onclick="login()" class="w-full bg-indigo-950 text-white p-5 rounded-2xl font-black text-2xl hover:bg-indigo-800 transition active:scale-95 shadow-2xl shadow-indigo-100 uppercase italic italic">Login Account</button>
        </div>
    </div>

    <!-- MAIN APP DASHBOARD -->
    <div id="dash-main" class="hidden p-8 lg:p-12 max-w-7xl mx-auto">
        
        <!-- Teacher View: Input any Excel file -->
        <div id="teacher-zone" class="hidden max-w-4xl mx-auto mb-16 text-center animate-fade-in">
            <div class="bg-white p-12 rounded-[4.5rem] shadow-2xl border-4 border-indigo-50 mb-10 overflow-hidden relative group">
                <div class="absolute -top-10 -right-10 text-9xl font-black text-slate-100 opacity-20 rotate-12 group-hover:text-yellow-100 transition">FILE</div>
                <h2 class="text-4xl font-black text-indigo-950 mb-10 tracking-tighter uppercase underline underline-offset-4 decoration-yellow-400 decoration-8">SOO GUDBI EXCEL-KA NATIIJOOYINKA</h2>
                <div class="space-y-4 max-w-2xl mx-auto relative z-10">
                    <input id="subject" type="text" placeholder="Subject Name (EPSY 261, SOM 101, etc)" class="w-full p-7 rounded-[2.5rem] bg-indigo-50/50 border-4 border-indigo-100 font-black text-3xl outline-none focus:border-yellow-500 shadow-inner uppercase tracking-tighter placeholder:opacity-20 text-center underline decoration-indigo-200">
                    <div class="p-10 border-4 border-dashed rounded-[3rem] border-indigo-200 bg-white group-hover:border-indigo-400 transition-all flex flex-col items-center">
                        <input type="file" onchange="handleExcelUpload(event)" accept=".xlsx, .xls" class="mb-4 block text-xs">
                        <button onclick="submitSub()" class="w-full bg-indigo-950 text-white py-6 rounded-3xl font-black text-3xl shadow-2xl hover:scale-105 active:scale-95 uppercase tracking-tighter italic decoration-yellow-500 underline underline-offset-4 shadow-indigo-100">GUDBI HADA (SUBMIT)</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Auditor/Manager List -->
        <div id="report-area" class="max-w-3xl mx-auto"></div>
    </div>

    <!-- MODAL STUDENT VIEW -->
    <div id="modal-s" class="hidden fixed inset-0 bg-indigo-950/98 backdrop-blur-2xl flex items-center justify-center p-8 z-[1000] animate-fade-in">
        <div class="bg-slate-100 p-16 rounded-[4.5rem] w-full max-w-md shadow-[0_50px_100px_-20px_rgba(0,0,0,0.6)] relative overflow-hidden border-t-[20px] border-yellow-500 text-center">
             <div class="absolute top-0 right-0 p-12 text-7xl font-black text-indigo-950 rotate-12 opacity-5 pointer-events-none tracking-tighter leading-none italic uppercase italic italic italic italic">STUDENT</div>
             <h2 class="text-4xl font-black text-indigo-950 tracking-tighter leading-none mb-1 uppercase italic italic">Grade Checker</h2>
             <p class="text-[9px] font-black text-slate-300 mb-10 tracking-[0.5em] italic italic underline decoration-yellow-400/30 uppercase leading-none">Kebridahar Teacher Center Registry</p>
             <input id="search-val" type="text" placeholder="SRLD/140/15" class="w-full bg-white p-7 rounded-[3rem] border-2 border-indigo-50 font-black text-3xl text-center outline-none focus:border-yellow-500 mb-4 tracking-widest shadow-inner text-indigo-950 italic uppercase italic">
             <button onclick="checkMyGrade()" class="w-full bg-indigo-950 text-white p-8 rounded-[3.5rem] font-black text-2xl shadow-2xl hover:scale-105 active:scale-95 uppercase italic transition-all italic italic italic decoration-indigo-500 underline decoration-2 underline-offset-4 italic">CHECK GRADE SEARCH</button>
             <div id="search-res" class="min-h-[160px]"></div>
             <button onclick="document.getElementById('modal-s').classList.add('hidden')" class="mt-8 text-gray-300 font-black uppercase text-[10px] tracking-widest italic italic italic underline decoration-gray-200">Exit Result Gate / Close</button>
        </div>
    </div>

</body>
</html>
