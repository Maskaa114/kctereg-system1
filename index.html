<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KCTE OFFICIAL PORTAL v19</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, getDocs, updateDoc, doc, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDoMZETvL5-oYm5wiP2dcbLm1p6ZfsgvjE",
            authDomain: "kctereg-online.firebaseapp.com",
            projectId: "kctereg-online",
            storageBucket: "kctereg-online.firebasestorage.app",
            messagingSenderId: "308277595556",
            appId: "1:308277595556:web:1b1814886668eda0310531"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- ID Nadiifiye (Matches IDs correctly) ---
        const cleanID = (t) => String(t).toUpperCase().replace(/[^A-Z0-9]/g, '').trim();

        // --- 1. LOGIN SYSTEM ---
        window.loginStaff = () => {
            const u = document.getElementById('su').value.trim();
            const p = document.getElementById('sp').value.trim();
            if(u==="Macalin114" && p==="kctepass") return startPortal("Macalin");
            if(u==="D.head 5353" && p==="headpass") return startPortal("HOD");
            if(u==="REG.12345" && p==="regpass") return startPortal("REG");
            if(u==="dean12345" && p==="deanpass") return startPortal("Dean");
            alert("Xog qaldan!");
        };

        function startPortal(r) {
            document.getElementById('home').classList.add('hidden');
            document.getElementById('login-box').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            document.getElementById('u-role').innerText = r + " Account";
            if(r === 'Macalin') document.getElementById('t-ui').classList.remove('hidden');
            if(['HOD','REG','Dean'].includes(r)) loadAuditFiles(r);
        }

        // --- 2. TEACHER: COPY & PASTE ENGINE ---
        let gradeBuffer = [];
        window.parseData = (e) => {
            const rows = e.target.value.split("\n");
            gradeBuffer = [];
            rows.forEach(r => {
                const cols = r.split("\t");
                if(cols.length >= 3){
                    // Nidaamku wuxuu kala saarayaa Magaca, ID-ga iyo Buundada
                    let name = (cols[1] || "").split("+")[0].trim();
                    let id = (cols[2] || "").trim();
                    let mark = cols.find(v => !isNaN(v) && v != "" && v.length >= 1) || "0";
                    let grade = (cols[cols.length-1] || "F").toUpperCase().trim();
                    // Kaliya xereey hadduusan ahayn header row
                    if(name && !name.toLowerCase().includes("name") && !id.toLowerCase().includes("id")) {
                        gradeBuffer.push({ name, sid: id, mark, grade });
                    }
                }
            });
            document.getElementById('log-c').innerText = gradeBuffer.length + " Arday ayaa laga diyaariyey xogta Excel.";
        };

        window.submitReport = async () => {
            const subject = document.getElementById('subj').value.trim();
            if(!subject || gradeBuffer.length === 0) return alert("Magaca maadada qor iyo Xogta Excel.");
            await addDoc(collection(db, "results_v19"), {
                subject: subject.toUpperCase(), instructor: "Macalin114",
                students: gradeBuffer, status: "PENDING_HOD", at: new Date().toLocaleString()
            });
            alert("Success! Hubinta loo gudbiyey."); location.reload();
        };

        // --- 3. STUDENT MULTI-COURSE REPORT (NEW!) ---
        window.getNatiijo = async () => {
            const idInput = document.getElementById('st_search').value.trim();
            if(!idInput) return alert("Fadlan qor ID-gaaga.");

            const tid = cleanID(idInput);
            const resArea = document.getElementById('st-res-area');
            resArea.innerHTML = "<p class='animate-pulse text-indigo-400 font-bold'>RAADINTA TRANSCRIPT-KA...</p>";

            const q = query(collection(db, "results_v19"), where("status", "==", "APPROVED"));
            const snap = await getDocs(q);
            let userFound = null; let gradeList = [];

            snap.forEach(docSnap => {
                const record = docSnap.data().students.find(s => cleanID(s.sid) === tid);
                if(record) {
                    userFound = record; 
                    gradeList.push({ subject: docSnap.data().subject, mark: record.mark, grade: record.grade });
                }
            });

            if(userFound) {
                let subjectsTable = "";
                gradeList.forEach(g => {
                    subjectsTable += `
                    <tr class="border-b">
                        <td class="p-3 font-bold text-indigo-950 uppercase">${g.subject}</td>
                        <td class="p-3 text-center font-black">100/${g.mark}</td>
                        <td class="p-3 text-right"><span class="bg-indigo-900 text-yellow-400 px-3 py-1 rounded font-black italic shadow-lg">${g.grade}</span></td>
                    </tr>`;
                });

                resArea.innerHTML = `
                <div class='mt-10 p-10 bg-white border-t-[20px] border-indigo-950 rounded-[4rem] shadow-2xl animate-fade-in relative'>
                    <div class='flex flex-col items-center mb-10'>
                        <h4 class='text-[10px] font-black uppercase text-indigo-300 tracking-[0.4em] italic mb-6'>KCTE Official Result Gateway</h4>
                        <div class="mb-4 text-center">
                            <span class='block text-[8px] font-bold text-gray-400 uppercase italic'>FullName / Magaca Saddexan</span>
                            <h2 class='text-4xl font-black text-indigo-950 uppercase italic tracking-tighter leading-none'>${userFound.name}</h2>
                        </div>
                        <p class='text-xs font-bold text-gray-500 uppercase mt-2'>ID: ${userFound.sid}</p>
                    </div>

                    <table class='w-full text-sm border-collapse text-left bg-slate-50 rounded-2xl overflow-hidden'>
                        <thead class='bg-indigo-900 text-white text-[10px] font-black uppercase tracking-widest'><tr><th class='p-3'>SUBJECT/MAADADA</th><th class='p-3 text-center'>MARK(Tira)</th><th class='p-3 text-right'>GRADE</th></tr></thead>
                        <tbody>${subjectsTable}</tbody>
                    </table>

                    <div class='mt-12 text-center'>
                        <p class='text-[10px] text-green-600 font-bold uppercase underline underline-offset-8 decoration-dotted'>Verified Student Transcript OK - 2026</p>
                    </div>
                </div>`;
            } else {
                resArea.innerHTML = `<div class='mt-10 p-6 bg-red-100 text-red-700 rounded-3xl font-black text-xs text-center animate-shake italic uppercase tracking-tighter italic'>Ma hayno xog la oggolaaday (APPROVED) oo kuxiran ID-gan [${idInput}]. Fadlan hubi ID Numberka.</div>`;
            }
        };

        // --- 4. MANAGEMENT WORKFLOW ---
        function loadAuditFiles(r) {
            const target = r === 'HOD' ? 'PENDING_HOD' : 'PENDING_REG';
            const q = r === 'Dean' ? collection(db,"results_v19") : query(collection(db,"results_v19"), where("status","==",target));
            onSnapshot(q, snap => {
                let html = "";
                snap.forEach(ds => {
                    const i = ds.data();
                    let stH = ""; i.students.forEach(st => stH += `<tr class='border-b'><td class='p-1'>${st.sid}</td><td class='p-1 font-bold'>${st.name}</td><td class='p-1'>100/${st.mark}</td><td class='p-1 font-bold text-red-600'>${st.grade}</td></tr>`);
                    html += `
                    <div class='bg-white p-10 rounded-[3rem] shadow-xl border-l-[20px] border-indigo-950 mb-10 animate-fade-in italic'>
                        <div class='flex flex-col lg:flex-row justify-between gap-6 border-b pb-6 mb-4'>
                            <div><h2 class='text-2xl font-black uppercase text-indigo-950 decoration-yellow-400 underline underline-offset-4 decoration-8'>${i.subject}</h2><p class='text-[10px] font-black italic opacity-40 mt-1 uppercase'>Sent by: Macalin114</p></div>
                            <div class='flex gap-2 items-center'>
                                ${(r=='HOD' && i.status=='PENDING_HOD') ? `<button onclick="actionSt('${ds.id}','PENDING_REG')" class='bg-green-600 text-white px-5 py-2 rounded-xl text-xs font-black shadow-lg shadow-green-100 hover:scale-105 active:scale-95 transition-all uppercase'>ApproveHub</button>` : ""}
                                ${(r=='REG' && i.status=='PENDING_REG') ? `<button onclick="actionSt('${ds.id}','APPROVED')" class='bg-indigo-900 text-white px-6 py-2 rounded-2xl text-[10px] font-black shadow-2xl uppercase underline underline-offset-4 tracking-tighter'>FINAL HubHub HUB ➜</button>` : ""}
                                <button onclick="rejectD('${ds.id}')" class='bg-red-500 text-white px-4 py-2 rounded-xl text-[10px] uppercase font-bold shadow-lg active:scale-95 transition-all italic'>Rejected</button>
                                <span class='p-2 bg-yellow-50 text-[10px] font-bold text-yellow-600 uppercase border italic rounded'>${i.status}</span>
                            </div>
                        </div>
                        <h4 class="font-black text-gray-300 text-[11px] mb-4 tracking-widest uppercase">Student Audit Report (Current View)</h4>
                        <div class="max-h-80 overflow-y-auto border-4 border-slate-50 rounded-[2rem] bg-white">
                            <table class='w-full text-left text-[11px] font-bold leading-tight'><thead class='bg-indigo-50/50 uppercase italic text-[9px]'><tr><th class='p-3'>ID Number</th><th class='p-3'>Student Name</th><th class='p-3'>Numerical Mark</th><th class='p-3'>Xaraf Grade</th></tr></thead><tbody>${stH}</tbody></table>
                        </div>
                    </div>`;
                });
                document.getElementById('manager-list').innerHTML = html || "<p class='p-20 text-center italic opacity-30 font-black'>HUB DATABASE EMPTY</p>";
            });
        }
        window.actionSt = async(id,s) => { await updateDoc(doc(db,"results_v19",id),{status:s}); alert("Succesfully Update to: " + s); };
        window.rejectD = async(id) => { if(confirm("Confirm Reject?")) await deleteDoc(doc(db,"results_v19",id)); };
    </script>
    <style> .animate-fade-in { animation: fIn 0.5s ease-out; } @keyframes fIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: 0; } } .animate-shake { animation: sK 0.3s; } @keyframes sK { 25%{transform:translateX(-10px);} 75%{transform:translateX(10px);} } </style>
</head>
<body class="bg-indigo-950 font-sans tracking-tight text-slate-900 italic">

    <!-- HOMEPAGE -->
    <div id="home" class="container mx-auto p-12 lg:p-24 max-w-4xl text-center italic">
        <h1 class="text-7xl lg:text-9xl font-black text-white leading-none mb-1 tracking-tighter uppercase italic italic">KCTE Hub Hub</h1>
        <p class="text-indigo-400 font-bold uppercase text-[10px] tracking-[0.5em] mb-12 italic underline decoration-yellow-400 decoration-8 underline-offset-[10px]">Academic Result & Registration Service Gateway</p>
        
        <div class="bg-white p-12 lg:p-16 rounded-[5rem] shadow-[0_50px_100px_rgba(0,0,0,0.6)] border-t-[30px] border-yellow-500 text-center relative overflow-hidden italic">
             <div class="absolute -top-10 -right-10 w-40 h-40 bg-indigo-50 rounded-full blur-3xl opacity-30 italic"></div>
             <h2 class="text-5xl font-black text-indigo-950 leading-none mb-1 uppercase tracking-tighter italic">Natiijo <span class="text-indigo-400 italic">Finder</span></h2>
             <p class="text-[9px] font-black text-gray-400 mb-10 tracking-[0.2em] italic uppercase">Official Academic Transcript Self-Search Port</p>
             <div class="space-y-4 max-w-lg mx-auto">
                 <input id="st_search" placeholder="Geli ID (SRLD/000/15)" class="w-full p-8 rounded-[4rem] bg-slate-50 border-4 border-white font-black text-5xl text-center text-indigo-950 shadow-inner focus:border-yellow-400 transition uppercase tracking-widest placeholder:text-gray-100 italic outline-none">
                 <button onclick="getNatiijo()" class="w-full bg-indigo-950 text-white py-10 rounded-[5rem] font-black text-4xl shadow-2xl hover:bg-yellow-500 hover:text-indigo-950 transform hover:scale-105 active:scale-95 transition-all underline underline-offset-8 decoration-indigo-400 decoration-8 italic italic uppercase tracking-tighter shadow-indigo-100">HUUR CHECK RESULT HADA ➜</button>
             </div>

             <div id="st-res-area" class="min-h-[250px]"></div>

             <div class="mt-20 border-t pt-8 italic italic">
                  <button onclick="document.getElementById('login-box').classList.remove('hidden'); document.getElementById('home').classList.add('hidden')" class="text-slate-300 font-black uppercase text-[10px] tracking-widest hover:text-indigo-900 italic transition-all italic underline underline-offset-4 decoration-yellow-400">HubHub Staff Official Administration Port Login</button>
             </div>
        </div>
    </div>

    <!-- STAFF LOGIN BOX -->
    <div id="login-box" class="hidden fixed inset-0 bg-indigo-950 flex items-center justify-center p-8 z-[1000] italic">
        <div class="bg-white p-12 lg:p-16 rounded-[5rem] w-full max-w-sm text-center shadow-2xl border-t-[12px] border-indigo-900 relative">
             <h2 class="text-4xl font-black text-indigo-950 mb-1 leading-none tracking-tighter uppercase italic">Control Door</h2>
             <p class="text-[10px] font-black text-gray-300 border-b pb-6 mb-12 tracking-widest italic uppercase">Institutional management Desk Identity Verify</p>
             <input id="su" placeholder="Management User-Name" class="w-full bg-slate-50 border-2 p-5 rounded-3xl mb-4 font-black italic tracking-widest uppercase text-center shadow-inner italic">
             <input id="sp" type="password" placeholder="Hubhub Security Key" class="w-full bg-slate-50 border-2 p-5 rounded-3xl mb-12 font-bold text-center text-3xl italic tracking-[0.2em] shadow-inner italic focus:border-yellow-400 outline-none">
             <button onclick="loginStaff()" class="w-full bg-indigo-950 text-white p-7 rounded-3xl font-black text-xl hover:shadow-indigo-400 transition-all uppercase active:scale-90 shadow-xl shadow-indigo-100">LOG-IN Management HADA HUB</button>
             <button onclick="location.reload()" class="mt-8 text-gray-200 text-xs font-bold uppercase underline">Exit Gateway HUB X</button>
        </div>
    </div>

    <!-- MAIN DASH UI -->
    <div id="main-app" class="hidden container mx-auto p-12 lg:p-24 bg-slate-50 min-h-screen max-w-7xl animate-fade-in shadow-2xl relative">
        <h1 class="text-7xl font-black text-indigo-950 mb-1 leading-none tracking-widest uppercase italic italic underline decoration-yellow-400 decoration-[15px] underline-offset-8">DESK Dashboard</h1>
        <p id="u-role" class="text-indigo-400 font-bold uppercase text-[11px] mb-20 italic underline underline-offset-8 decoration-slate-200 decoration-4">Authenticated HUB Status: OK 200%</p>

        <!-- MACALIN INPUT AREA -->
        <div id="t-ui" class="hidden animate-fade-in">
             <div class="bg-white p-16 rounded-[6rem] shadow-2xl border border-indigo-50 text-center italic relative group">
                <input id="subj" placeholder="Sub: Subject Name Master" class="w-full p-8 border bg-gray-50 rounded-[4rem] mb-12 font-black text-5xl text-center focus:border-indigo-900 shadow-inner italic underline decoration-yellow-500 decoration-8 uppercase tracking-widest">
                <textarea oninput="parseData(event)" placeholder="Halkan Copy Paste ku dhuuji xogtaada dhabta ah ee Excel..." class="w-full h-52 border-4 p-8 rounded-[4rem] bg-indigo-50/20 text-[9px] mb-6 italic outline-none tracking-widest shadow-inner group-hover:bg-white transition-all"></textarea>
                <p id="log-c" class="font-black text-indigo-900 mb-12 uppercase text-lg italic decoration-yellow-500 underline underline-offset-8"></p>
                <button onclick="submitReport()" class="w-full bg-indigo-950 text-white py-12 rounded-[5rem] font-black text-4xl shadow-xl hover:scale-105 active:scale-95 transform transition-all underline underline-offset-4 decoration-yellow-500 decoration-[10px]">SUBMIT TO Maamulayaasha Hada ➜</button>
             </div>
        </div>

        <div id="manager-ui" class="max-w-4xl mx-auto w-full italic">
             <div id="manager-list"></div>
        </div>
    </div>

</body>
</html>
