<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KCTE OFFICIAL PORTAL v21 - FINAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, getDocs, updateDoc, doc, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDoMZETvL5-oYm5wiP2dcbLm1p6ZfsgvjE",
            authDomain: "kctereg-online.firebaseapp.com",
            projectId: "kctereg-online",
            storageBucket: "kctereg-online.firebasestorage.app",
            messagingSenderId: "308277595556",
            appId: "1:308277595556:web:1b1814886668eda0310531"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- NADIIFIYAHA ID-GA (Furoo dhibka dhan) ---
        // Wuxuu ID-ga ka saaraa /, spaces, iyo calaamado kasta. 142/15 -> 14215
        const normalize = (t) => String(t).toUpperCase().replace(/[^0-9]/g, '');

        // --- 1. LOGIN SYSTEM ---
        window.loginPortal = () => {
            const u = document.getElementById('user').value.trim();
            const p = document.getElementById('pass').value.trim();
            if(u==="Macalin114" && p==="kctepass") return openPortal("Macalin");
            if(u==="D.head 5353" && p==="headpass") return openPortal("HOD");
            if(u==="REG.12345" && p==="regpass") return openPortal("REG");
            if(u==="dean12345" && p==="deanpass") return openPortal("Dean");
            alert("Username/Password ma jiro.");
        };

        function openPortal(r) {
            document.getElementById('landing').classList.add('hidden');
            document.getElementById('login-box').classList.add('hidden');
            document.getElementById('app-main').classList.remove('hidden');
            document.getElementById('role-title').innerText = r + " HUB Access";
            if(r === 'Macalin') document.getElementById('teacher-ui').classList.remove('hidden');
            if(['HOD','REG','Dean'].includes(r)) loadAudit(r);
        }

        // --- 2. STUDENT TRANSCRIPT VIEW (v21 REFIXED) ---
        window.searchMyResult = async () => {
            const rawId = document.getElementById('st-id-input').value.trim();
            if(!rawId) return alert("Fadlan qor ID Number SRLD.");

            const searchVal = normalize(rawId); // Example "14215"
            const area = document.getElementById('st-card');
            area.innerHTML = "<p class='animate-bounce text-white font-bold italic mt-4'>XOGRAADIN BAASOCATA...</p>";

            const q = query(collection(db, "grades_final_v21"), where("status", "==", "APPROVED"));
            const snap = await getDocs(q);
            let matches = [];

            snap.forEach(docSnap => {
                const students = docSnap.data().list;
                const match = students.find(s => normalize(s.sid).includes(searchVal) || normalize(s.name).includes(searchVal));
                if(match) matches.push({ st: match, subj: docSnap.data().subject });
            });

            if(matches.length > 0) {
                let html = "";
                matches.forEach(m => {
                    html += `
                    <div class='mt-6 p-8 bg-white border-t-[12px] border-yellow-500 rounded-[3rem] shadow-2xl animate-fade-in text-center relative overflow-hidden'>
                        <h4 class='text-[10px] font-black uppercase text-indigo-200 tracking-widest mb-6'>KCTE Official Electronic Portal</h4>
                        
                        <div class="mb-6">
                            <span class='block text-[8px] font-bold text-gray-400 uppercase tracking-tighter italic mb-1'>FullName (Magaca Saddexan)</span>
                            <h2 class='text-4xl font-black text-indigo-950 uppercase italic leading-none'>${m.st.name}</h2>
                        </div>

                        <div class="bg-slate-50 p-4 rounded-3xl mb-8 flex justify-around">
                             <div class="text-left border-r pr-4"><span class='block text-[8px] opacity-30'>SUBJECT</span> <p class='text-xs font-black uppercase text-indigo-700'>${m.subj}</p></div>
                             <div class="text-left pl-4"><span class='block text-[8px] opacity-30'>ID NUMBER</span> <p class='text-xs font-black text-slate-500'>${m.st.sid}</p></div>
                        </div>

                        <div class='grid grid-cols-2 gap-4'>
                            <div class='bg-white p-6 rounded-2xl border shadow-inner text-indigo-950'> 
                                <span class='text-[9px] block font-black opacity-30 uppercase'>Total Tira /100</span> 
                                <h1 class='text-4xl font-black'>100/${m.st.mark}</h1> 
                            </div>
                            <div class='bg-indigo-950 text-white p-6 rounded-2xl shadow-xl border-b-8 border-yellow-500'> 
                                <span class='text-[9px] block opacity-50 uppercase'>Final Grade</span> 
                                <h1 class='text-7xl font-black italic underline underline-offset-4 decoration-yellow-400'>${m.st.grade}</h1> 
                            </div>
                        </div>
                        <p class="mt-12 text-[10px] text-green-500 font-bold uppercase underline decoration-dotted underline-offset-8 italic">Validated Result OK ✓</p>
                    </div>`;
                });
                area.innerHTML = html;
            } else {
                area.innerHTML = `<div class='mt-8 p-6 bg-red-100 text-red-600 rounded-3xl font-black text-xs uppercase animate-pulse italic'>Lama helin: ID Number (${rawId}) maysan ogolaan 'APPROVED' ama ID baa qaldan. XIRIIRI REGISTRAR.</div>`;
            }
        };

        // --- 3. TEACHER COPY/PASTE LOGIC ---
        let currentBatch = [];
        window.processClipboard = (e) => {
            const raw = e.target.value.split("\n");
            currentBatch = [];
            raw.forEach(line => {
                const c = line.split("\t");
                if(c.length >= 3){
                    let name = (c[1] || "").split("+")[0].trim();
                    let sid = (c[2] || "").trim();
                    let m = c.find(v => !isNaN(v) && v != "" && v.length >= 1) || "0";
                    let g = (c[c.length-1] || "F").toUpperCase().trim();
                    if(name && !name.toLowerCase().includes("name")) currentBatch.push({name, sid, mark:m, grade:g});
                }
            });
            document.getElementById('c-count').innerText = "Ardayda loo diyaariyey: " + currentBatch.length;
        };

        window.submitToDB = async () => {
            const sj = document.getElementById('s-input').value.trim();
            if(!sj || currentBatch.length == 0) return alert("Fadlan qor maadada.");
            await addDoc(collection(db, "grades_final_v21"), {
                subject: sj.toUpperCase(), instructor: "Macalin114",
                list: currentBatch, status: "PENDING_HOD", date: new Date().toLocaleString()
            });
            alert("WAA LAA DIRAY!"); location.reload();
        };

        // --- 4. STAFF DASHBOARDS ---
        function loadAudit(role) {
            const target = (role === 'HOD') ? 'PENDING_HOD' : (role === 'REG' ? 'PENDING_REG' : null);
            const q = target ? query(collection(db,"grades_final_v21"), where("status","==",target)) : collection(db,"grades_final_v21");
            onSnapshot(q, snap => {
                let html = "";
                snap.forEach(ds => {
                    const i = ds.data();
                    let sRows = ""; i.list.forEach(st => sRows += `<tr class='border-b'><td>${st.sid}</td><td>${st.name}</td><td>${st.mark}</td><td class="font-black text-red-600">${st.grade}</td></tr>`);
                    html += `
                    <div class='bg-white p-10 rounded-[3rem] shadow-xl border-l-[20px] border-indigo-950 mb-10'>
                        <div class='flex justify-between items-center mb-6'>
                            <div><h3 class='font-black text-2xl uppercase italic decoration-yellow-400 underline decoration-8'>${i.subject}</h3><p class='text-[10px] italic'>Uploaded at: ${i.date}</p></div>
                            <div class='flex gap-2'>
                                ${(role=='HOD'&&i.status=='PENDING_HOD') ? `<button onclick="updateDocS('${ds.id}','PENDING_REG')" class='bg-green-600 text-white px-6 py-2 rounded-xl text-xs font-black shadow-lg'>Approve (Gudbi REG)</button>` : ""}
                                ${(role=='REG'&&i.status=='PENDING_REG') ? `<button onclick="updateDocS('${ds.id}','APPROVED')" class='bg-indigo-950 text-white px-8 py-3 rounded-2xl text-[10px] font-black uppercase underline shadow-2xl'>FINAL APPROVAL HUB Hub</button>` : ""}
                                <button onclick="delDocS('${ds.id}')" class='bg-red-400 text-white px-3 py-1 rounded text-xs italic font-bold'>Delete</button>
                                <span class='p-1 text-[8px] bg-slate-100 rounded border'>${i.status}</span>
                            </div>
                        </div>
                        <details class="cursor-pointer font-black text-blue-500 uppercase text-xs italic italic"><summary>Student Audit Details ▽</summary>
                             <table class='w-full text-left mt-6 border'><thead class='bg-slate-50 uppercase text-[9px]'><tr><th>ID</th><th>FullName</th><th>Score</th><th>Grade</th></tr></thead><tbody>${sRows}</tbody></table>
                        </details>
                    </div>`;
                });
                document.getElementById('list-area').innerHTML = html || "<p class='p-20 text-center italic opacity-30 uppercase'>SYSTEM PIPELINE IS EMPTY</p>";
            });
        }
        window.updateDocS = async(id, s) => { await updateDoc(doc(db,"grades_final_v21",id), {status:s}); alert("Guul!"); };
        window.delDocS = async(id) => { if(confirm("Tirtirid dhab ah?")) await deleteDoc(doc(db,"grades_final_v21",id)); };
    </script>
    <style> .animate-fade-in { animation: fIn 0.5s ease-out; } @keyframes fIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } } .animate-shake { animation: sK 0.3s; } @keyframes sK { 25%{transform:translateX(-10px);} 75%{transform:translateX(10px);} } </style>
</head>
<body class="bg-indigo-950 font-sans tracking-tight text-slate-900 italic overflow-x-hidden italic italic">

    <!-- ARDAYDA LANDING PAGE (V21 PRIMARY) -->
    <div id="landing" class="container mx-auto p-12 lg:p-24 max-w-5xl text-center italic">
        <h1 class="text-7xl lg:text-9xl font-black text-white italic tracking-tighter leading-none mb-1 uppercase">KCTE HUB</h1>
        <p class="text-indigo-400 font-bold uppercase text-[11px] mb-16 tracking-[0.4em] italic italic underline decoration-yellow-400 decoration-8 underline-offset-8">Official Final Academic Results Port</p>
        
        <div class="bg-white p-12 lg:p-20 rounded-[5rem] shadow-[0_50px_100px_rgba(0,0,0,0.6)] border-t-[20px] border-yellow-500 text-center relative overflow-hidden italic">
             <div class="absolute -top-10 -right-10 w-60 h-60 bg-indigo-50/10 rounded-full blur-3xl italic opacity-50 italic"></div>
             <h2 class="text-5xl font-black text-indigo-950 leading-none mb-12 italic underline underline-offset-8 decoration-yellow-400 decoration-4">Check Your Buundo</h2>
             
             <div class="max-w-md mx-auto space-y-6">
                 <input id="st-id-input" placeholder="ID (E.g SRLD/142/15)" class="w-full bg-slate-50 border-4 border-slate-100 p-10 rounded-[5rem] text-center font-black text-5xl italic outline-none shadow-2xl focus:ring-8 focus:ring-yellow-500 text-indigo-950 uppercase placeholder:opacity-10 italic">
                 <button onclick="searchMyResult()" class="w-full bg-indigo-950 text-white py-8 rounded-[4rem] font-black text-4xl shadow-xl hover:scale-105 active:scale-90 transition italic italic underline decoration-yellow-500 decoration-8 underline-offset-4">NATIIJADAYDA ARAG ➜</button>
             </div>

             <div id="st-card" class="min-h-[250px] transition-all"></div>

             <div class="mt-24 border-t pt-10 border-indigo-50/50">
                  <button onclick="document.getElementById('login-modal').classList.remove('hidden');" class="text-indigo-100 font-bold uppercase text-[8px] tracking-[0.3em] opacity-30 italic italic underline decoration-yellow-400">Institutional Admin Gateway Logic Staff Only</button>
             </div>
        </div>
    </div>

    <!-- STAFF LOGIN BOX -->
    <div id="login-modal" class="hidden fixed inset-0 bg-indigo-950/98 backdrop-blur-3xl flex items-center justify-center p-8 z-[2000] italic">
        <div class="bg-white p-16 rounded-[4.5rem] w-full max-w-sm text-center shadow-2xl relative border-t-8 border-indigo-900 italic">
             <h2 class="text-3xl font-black text-indigo-950 mb-10 uppercase italic">Entry Login</h2>
             <input id="user" placeholder="Staff UserName" class="w-full bg-slate-50 border p-5 rounded-2xl mb-4 font-black italic tracking-widest text-center shadow-inner uppercase">
             <input id="pass" type="password" placeholder="Hub Hub HUB" class="w-full bg-slate-50 border p-5 rounded-2xl mb-12 font-black text-4xl text-center italic outline-none focus:border-yellow-400 shadow-inner">
             <button onclick="loginPortal()" class="w-full bg-indigo-950 text-white p-7 rounded-[3rem] font-black text-2xl shadow-xl active:scale-95 transform">Login Dash Hub ➜</button>
             <button onclick="location.reload()" class="mt-6 text-gray-300 font-bold uppercase text-[10px] underline block w-full italic">Xir Portal Exit</button>
        </div>
    </div>

    <!-- MAIN APP WRAPPER -->
    <div id="app-main" class="hidden container mx-auto p-12 lg:p-24 max-w-6xl italic italic">
        <h2 id="role-title" class="text-5xl font-black text-white mb-20 italic italic italic underline decoration-yellow-500 decoration-[15px] underline-offset-8">Hub Portal</h2>
        
        <!-- MACALINKA -->
        <div id="teacher-ui" class="hidden animate-fade-in max-w-4xl mx-auto italic italic italic">
            <div class="bg-white p-12 rounded-[5.5rem] shadow-2xl border-t-[18px] border-green-500 text-center italic italic mb-10 italic">
                <h3 class="text-4xl font-black text-indigo-950 mb-12 italic uppercase decoration-indigo-200 underline decoration-8 underline-offset-4">Gudbi Natiijada Port</h3>
                <input id="s-input" placeholder="SUBJECT Name E.g SOMALI I" class="w-full p-8 border bg-gray-50 rounded-3xl font-black text-4xl text-center uppercase shadow-inner italic underline decoration-yellow-500">
                <textarea oninput="processClipboard(event)" placeholder="Halkan midig-guji ka dib Paste xogtii Excel ee rasmiga ah dhuuji..." class="w-full h-52 border-4 p-8 border-indigo-50 bg-indigo-50/10 rounded-[3rem] text-[9px] italic mt-12 outline-none tracking-widest transition-all"></textarea>
                <p id="c-count" class="font-black text-indigo-950 my-10 uppercase text-lg italic italic decoration-yellow-400 underline decoration-2 underline-offset-8"></p>
                <button onclick="submitToDB()" class="w-full bg-indigo-950 text-white p-12 rounded-[5rem] font-black text-4xl shadow-xl hover:scale-105 active:scale-95 transition underline underline-offset-4 decoration-yellow-400 decoration-[12px] italic uppercase tracking-tighter">Submit Official HUB Port Hub</button>
            </div>
        </div>

        <div id="list-area"></div>
    </div>

</body>
</html>
