<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KCTE PORTAL v22 - STABLE ACCESS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, getDocs, updateDoc, doc, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDoMZETvL5-oYm5wiP2dcbLm1p6ZfsgvjE",
            authDomain: "kctereg-online.firebaseapp.com",
            projectId: "kctereg-online",
            storageBucket: "kctereg-online.firebasestorage.app",
            messagingSenderId: "308277595556",
            appId: "1:308277595556:web:1b1814886668eda0310531"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Nadiifiye ID oo loogu talagalay Student Search-ka kaliya
        const scrub = (t) => String(t).toUpperCase().replace(/[^A-Z0-9]/g, '').trim();

        // --- 1. STAFF LOGIN (EXACT MATCHING) ---
        window.portalLogin = () => {
            const user = document.getElementById('u').value.trim();
            const pass = document.getElementById('p').value.trim();

            // Staff Credentials (WAAN SAXAY LOGIN-KAN HADA)
            if (user === "Macalin114" && pass === "kctepass") return setupUI("Macalin");
            if (user === "D.head 5353" && pass === "headpass") return setupUI("HOD");
            if (user === "REG.12345" && pass === "regpass") return setupUI("REG");
            if (user === "dean12345" && pass === "deanpass") return setupUI("Dean");

            alert("KHALAD: Hubi in magaca ama password-ka qaldanyahay.");
        };

        function setupUI(role) {
            document.getElementById('home-search').classList.add('hidden');
            document.getElementById('login-modal').classList.add('hidden');
            document.getElementById('dash-main').classList.remove('hidden');
            document.getElementById('role-tag').innerText = role;
            if (role === 'Macalin') document.getElementById('teacher-ui').classList.remove('hidden');
            if (['HOD', 'REG', 'Dean'].includes(role)) loadAudits(role);
        }

        // --- 2. ARDAYDA: ARAG NATIIJADA (Direct Search No Password) ---
        window.getNatiijoNow = async () => {
            const sidInput = document.getElementById('id_search').value.trim();
            if(!sidInput) return alert("Fadlan qor ID SRLD number-kaaga!");
            
            const target = scrub(sidInput);
            const resArea = document.getElementById('st-card-area');
            resArea.innerHTML = "<p class='animate-bounce text-white font-black'>BAARITAANKA HUBINKA...</p>";

            const q = query(collection(db, "v22_db"), where("status", "==", "APPROVED"));
            const snap = await getDocs(q);
            let foundData = [];

            snap.forEach(d => {
                const list = d.data().students;
                const match = list.find(s => scrub(s.sid) === target || scrub(s.name).includes(target));
                if(match) foundData.push({ info: match, subject: d.data().subject });
            });

            if(foundData.length > 0) {
                let html = "";
                foundData.forEach(r => {
                    html += `
                    <div class='mt-6 p-8 bg-white border-t-[15px] border-yellow-500 rounded-[3rem] shadow-2xl animate-fade-in text-center italic relative overflow-hidden'>
                        <h4 class='text-[10px] font-black text-indigo-400 uppercase tracking-widest mb-6 underline decoration-indigo-50'>Kebridahar Teachers College Record</h4>
                        
                        <div class='mb-6'>
                            <span class='block text-[8px] font-bold text-gray-300 uppercase italic'>STUDENT FULL NAME</span>
                            <h2 class='text-4xl font-black text-indigo-950 uppercase italic leading-tight'>${r.info.name}</h2>
                        </div>

                        <div class='bg-indigo-50/50 p-4 rounded-3xl border border-indigo-100 flex justify-between px-8 mb-8'>
                            <div class='text-left'><span class='block text-[8px] opacity-40 uppercase'>Department</span><p class='font-black text-indigo-700 text-sm'>${r.subject}</p></div>
                            <div class='text-right'><span class='block text-[8px] opacity-40 uppercase'>Student ID</span><p class='font-black text-slate-500 text-sm'>${r.info.sid}</p></div>
                        </div>

                        <div class='grid grid-cols-2 gap-4'>
                            <div class='bg-white p-6 rounded-[2rem] border shadow-inner text-indigo-900'>
                                <span class='text-[10px] font-bold uppercase opacity-30 block mb-1'>Tira / Score</span>
                                <h1 class='text-5xl font-black'>100/${r.info.mark}</h1>
                            </div>
                            <div class='bg-indigo-950 text-white p-6 rounded-[2rem] shadow-xl border-b-8 border-yellow-500'>
                                <span class='text-[10px] font-bold uppercase opacity-50 block mb-1 underline decoration-yellow-400'>Final Grade</span>
                                <h1 class='text-7xl font-black italic tracking-tighter'>${r.info.grade}</h1>
                            </div>
                        </div>
                    </div>`;
                });
                resArea.innerHTML = html;
            } else {
                resArea.innerHTML = `<div class='mt-6 p-8 bg-red-100 text-red-600 rounded-[2rem] font-bold text-[11px] uppercase italic animate-shake border border-red-200'>MAAN LAMA HELIN: ID Number (${sidInput}) xogtiisa ma horay oggolaadeen Registration Head? <br>Ma noqon kartaa 'REG FINAL APPROVED'? Iska hubi.</div>`;
            }
        };

        // --- 3. TEACHER COPY/PASTE LOGIC ---
        let teacherBuffer = [];
        window.processDataPaste = (e) => {
            const raw = e.target.value.split("\n");
            teacherBuffer = [];
            raw.forEach(r => {
                const c = r.split("\t");
                if(c.length >= 3){
                    let name = (c[1] || "").split("+")[0].trim();
                    let sid = (c[2] || "").trim();
                    let mark = c.find(v => !isNaN(v) && v != "" && v.length >= 1) || "0";
                    let grade = (c[c.length-1] || "F").toUpperCase().trim();
                    if(name && !name.toLowerCase().includes("name")) teacherBuffer.push({name, sid, mark, grade});
                }
            });
            document.getElementById('c-count').innerText = "Arday Ready: " + teacherBuffer.length;
        };

        window.submitSub = async () => {
            const sj = document.getElementById('sj-field').value.trim();
            if(!sj || teacherBuffer.length === 0) return alert("Subj Name & Excel Content.");
            await addDoc(collection(db, "v22_db"), {
                subject: sj.toUpperCase(), instructor: "Macalin114",
                students: teacherBuffer, status: "PENDING_HOD", date: new Date().toLocaleString()
            });
            alert("Succes! Gudbiye Hubinta."); location.reload();
        };

        // --- 4. AUDITS ---
        function loadAudits(r) {
            const t = r==='Dean' ? collection(db,"v22_db") : query(collection(db,"v22_db"), where("status","==",(r==='HOD'?'PENDING_HOD':'PENDING_REG')));
            onSnapshot(q => {
                onSnapshot(t, snap => {
                    let html = "";
                    snap.forEach(ds => {
                        const d = ds.data();
                        let sH = ""; d.students.forEach(st => sH += `<tr class='border-b'><td>${st.sid}</td><td>${st.name}</td><td>${st.mark}</td><td class="font-bold">${st.grade}</td></tr>`);
                        html += `
                        <div class='bg-white p-8 rounded-[3rem] shadow-2xl border-l-[18px] border-indigo-950 mb-10'>
                            <div class='flex justify-between items-center mb-6'>
                                <div><h2 class='font-black text-2xl uppercase underline decoration-yellow-400'>${d.subject}</h2><p class='text-[10px] italic'>Teacher: Macalin114 | ${d.date}</p></div>
                                <div class='flex gap-1 h-fit'>
                                    ${(r=='HOD'&&d.status=='PENDING_HOD') ? `<button onclick="actU('${ds.id}','PENDING_REG')" class='bg-green-600 text-white px-5 py-2 rounded-xl text-xs font-black shadow-lg shadow-green-100 uppercase'>Approve Hub</button>` : ""}
                                    ${(r=='REG'&&d.status=='PENDING_REG') ? `<button onclick="actU('${ds.id}','APPROVED')" class='bg-indigo-950 text-white px-8 py-3 rounded-2xl text-[11px] font-black underline italic shadow-2xl'>FINAL Hub-Hub ➜</button>` : ""}
                                    <span class='p-1 bg-gray-50 border rounded text-[8px] font-bold opacity-30 tracking-widest uppercase'>Status: ${d.status}</span>
                                </div>
                            </div>
                            <details class="cursor-pointer font-bold text-xs text-blue-400 uppercase italic"><summary>Detail Students Table ▽</summary>
                                 <table class='w-full text-left mt-6 text-[10px]'><thead class='bg-slate-50 uppercase'><tr><th>ID No</th><th>Magaca</th><th>100/X</th><th>Grade</th></tr></thead><tbody>${sH}</tbody></table>
                            </details>
                        </div>`;
                    });
                    document.getElementById('audit-list').innerHTML = html;
                });
            });
        }
        window.actU = async(id, s) => { await updateDoc(doc(db,"v22_db",id), {status:s}); alert("Update OK!"); };

    </script>
    <style> .animate-fade-in { animation: fIn 0.5s ease-out; } @keyframes fIn { from { opacity: 0; transform: translateY(25px); } to { opacity: 1; transform: translateY(0); } } .animate-shake { animation: sK 0.3s; } @keyframes sK { 25%{transform:translateX(-10px);} 75%{transform:translateX(10px);} } </style>
</head>
<body class="bg-indigo-950 font-sans tracking-tight text-slate-900 italic overflow-x-hidden italic">

    <!-- ARDAYDA LANDING PAGE -->
    <div id="home-search" class="container mx-auto p-8 lg:p-24 max-w-4xl text-center italic">
        <h1 class="text-7xl lg:text-9xl font-black text-white italic tracking-tighter mb-4 leading-none uppercase italic italic italic">KCTE <span class="bg-yellow-500 text-indigo-950 px-2 rounded-lg italic shadow-2xl shadow-yellow-100">HUB</span></h1>
        <p class="text-indigo-300 font-bold uppercase text-[10px] tracking-[0.5em] mb-12 italic underline decoration-yellow-400 decoration-8 underline-offset-8 italic italic">Grade Portal Gateway Dashboard 2026</p>
        
        <div class="bg-white p-12 lg:p-20 rounded-[5rem] shadow-[0_50px_100px_rgba(0,0,0,0.4)] border-t-[30px] border-yellow-500 relative overflow-hidden italic">
             <div class="absolute -top-10 -right-10 w-40 h-40 bg-indigo-50 rounded-full blur-3xl italic opacity-10"></div>
             <h2 class="text-6xl font-black text-indigo-950 leading-none mb-12 italic underline underline-offset-8 decoration-yellow-500 decoration-8">Gashidka Ardayda</h2>
             <div class="max-w-md mx-auto space-y-4">
                 <input id="id_search" placeholder="ID Number (E.g SRLD/007/15)" class="w-full bg-slate-50 border-4 border-slate-50 p-10 rounded-[4rem] text-center font-black text-5xl italic outline-none focus:ring-[20px] focus:ring-yellow-400 text-indigo-950 shadow-inner uppercase tracking-tighter placeholder:opacity-5 italic">
                 <button onclick="getNatiijoNow()" class="w-full bg-indigo-900 text-white py-10 rounded-[5rem] font-black text-4xl shadow-xl hover:scale-105 active:scale-95 transition underline decoration-yellow-400 decoration-[15px] underline-offset-8">RAADI BUUNDADAYDA ➜</button>
             </div>
             <div id="st-card-area" class="min-h-[250px] transition-all"></div>
             <div class="mt-24 border-t pt-10 border-indigo-50 italic">
                  <button onclick="document.getElementById('login-modal').classList.remove('hidden');" class="text-slate-100 opacity-20 hover:opacity-100 font-bold uppercase text-[10px] tracking-[0.4em] underline">Institutional Portal Dashboard Access HUB HUB</button>
             </div>
        </div>
    </div>

    <!-- STAFF LOGIN MODAL (v22 STRICT LOGINS) -->
    <div id="login-modal" class="hidden fixed inset-0 bg-indigo-950 flex items-center justify-center p-8 z-[1000] italic italic">
        <div class="bg-white p-12 rounded-[4rem] w-full max-w-sm text-center shadow-2xl relative border-t-[10px] border-indigo-950 italic">
             <h2 class="text-4xl font-black text-indigo-950 mb-10 italic uppercase underline tracking-tighter">Enter Desk HUB</h2>
             <div class="space-y-4">
                <input id="u" placeholder="Magaca Gashidka Management" class="w-full bg-slate-50 border p-5 rounded-3xl font-black italic tracking-widest text-indigo-950 uppercase italic text-center outline-none focus:border-yellow-500 shadow-inner">
                <input id="p" type="password" placeholder="KEY Pass" class="w-full bg-slate-50 border p-5 rounded-3xl font-black text-5xl text-center shadow-inner italic focus:border-yellow-400 outline-none mb-10">
                <button onclick="portalLogin()" class="w-full bg-indigo-950 text-white p-7 rounded-[3rem] font-black text-2xl shadow-xl active:scale-90 transform uppercase">GASHID ➜ HUB GATEWAY</button>
             </div>
             <button onclick="location.reload()" class="mt-8 text-gray-200 uppercase font-black text-[9px] underline">Back to Homepage Gateway Search Hub Hub</button>
        </div>
    </div>

    <!-- MAIN DASHBOARD CONTENT -->
    <div id="dash-main" class="hidden container mx-auto p-12 lg:p-24 max-w-7xl italic italic">
        <h2 id="role-tag" class="text-7xl font-black text-white mb-20 italic italic underline underline-offset-8 decoration-yellow-400 decoration-[20px] uppercase tracking-widest italic italic">Staff Dashboard Hub Access Port Hub</h2>
        
        <!-- TEACHER -->
        <div id="teacher-ui" class="hidden animate-fade-in max-w-5xl mx-auto italic italic italic italic">
             <div class="bg-white p-12 lg:p-20 rounded-[5rem] shadow-2xl border-t-[25px] border-green-500 text-center italic mb-10 italic italic">
                <input id="sj-field" placeholder="SUBJECT Title E.g Somali I" class="w-full p-8 border bg-slate-50 rounded-[4rem] mb-12 font-black text-5xl text-center focus:border-indigo-900 shadow-inner italic uppercase">
                <textarea oninput="processDataPaste(event)" placeholder="Xogta Excel copy halkan toos u dhuuji PASTE..." class="w-full h-52 border-4 p-8 border-indigo-100 bg-indigo-50/20 rounded-[4rem] text-[9px] mt-6 outline-none italic tracking-widest italic italic italic italic italic shadow-inner"></textarea>
                <p id="c-count" class="font-black text-indigo-950 my-10 uppercase text-lg italic decoration-yellow-400 underline decoration-8 italic underline underline-offset-4"></p>
                <button onclick="submitSub()" class="w-full bg-indigo-950 text-white p-12 rounded-[5rem] font-black text-4xl shadow-xl hover:scale-105 active:scale-95 transition underline decoration-yellow-500 decoration-[15px] underline-offset-4 italic uppercase">Submit To Official Hubhub ➜</button>
             </div>
        </div>

        <div id="audit-list"></div>
    </div>

</body>
</html>
